<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img">
<rect width="1100" height="700" fill="#FFFFFF"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">

<text x="550" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2937">Jev 的三个原语与一次请求</text>
<text x="550" y="78" text-anchor="middle" font-size="14" fill="#6B7280">输出空间由你的请求定义，所以它无法幻觉出格式</text>

<!-- ===== 左：请求 ===== -->
<rect x="36" y="140" width="236" height="432" rx="9" fill="#EFF4FE" stroke="#2563EB" stroke-width="1.8"/>
<text x="54" y="175" font-size="15" font-weight="700" fill="#1D4ED8">POST /v1/systemone</text>

<rect x="56" y="196" width="196" height="108" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="72" y="226" font-size="15" font-weight="700" fill="#1D4ED8">state</text>
<text x="72" y="250" font-size="12.5" fill="#475569">要判断的内容</text>
<text x="72" y="274" font-size="12" fill="#6B7280">文本 / JSON / 数组</text>

<rect x="56" y="316" width="196" height="80" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="72" y="346" font-size="15" font-weight="700" fill="#1D4ED8">model</text>
<text x="72" y="370" font-size="12.5" fill="#475569">模型 ID，如 jev-latest</text>

<rect x="56" y="408" width="196" height="108" rx="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
<text x="72" y="438" font-size="15" font-weight="700" fill="#1D4ED8">questions</text>
<text x="72" y="462" font-size="12.5" fill="#475569">你命名的若干问题</text>

<!-- ===== 中：三个原语 ===== -->
<rect x="306" y="140" width="488" height="132" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="328" y="174" font-size="16" font-weight="700" fill="#0F766E">noul</text>
<text x="328" y="198" font-size="12.5" fill="#475569">是 / 否问题，返回 0 到 1 的概率</text>
<rect x="328" y="228" width="444" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
<text x="342" y="250" font-size="11.5" fill="#374151">{"is_urgent": {"type": "noul", "noul": 0.95}}</text>

<rect x="306" y="290" width="488" height="132" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="328" y="324" font-size="16" font-weight="700" fill="#0F766E">choice</text>
<text x="328" y="348" font-size="12.5" fill="#475569">从你定义的选项里选一个，返回所选选项 + 全量概率分布</text>
<text x="328" y="366" font-size="12.5" fill="#475569">最多 255 个选项</text>
<rect x="328" y="378" width="444" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
<text x="342" y="400" font-size="11.5" fill="#374151">billing 0.88 / technical 0.12 / sales 0.00</text>

<rect x="306" y="440" width="488" height="132" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="328" y="474" font-size="16" font-weight="700" fill="#0F766E">score</text>
<text x="328" y="498" font-size="12.5" fill="#475569">沿你定义的有序量表打分，返回概率加权值</text>
<text x="328" y="516" font-size="12.5" fill="#475569">2 到 10 级</text>
<rect x="328" y="528" width="444" height="34" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
<text x="342" y="550" font-size="11.5" fill="#374151">score 1.05   legend 0 平静 / 1 不满 / 2 非常愤怒</text>

<!-- ===== 右：答案 ===== -->
<rect x="828" y="140" width="236" height="432" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="846" y="175" font-size="16" font-weight="700" fill="#0F766E">answers</text>
<text x="846" y="205" font-size="12.5" fill="#475569">按同样的 key 返回</text>

<rect x="846" y="230" width="200" height="120" rx="9" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="862" y="262" font-size="15" font-weight="700" fill="#0F766E">usage</text>
<text x="862" y="290" font-size="12" fill="#475569">input_tokens</text>
<text x="862" y="314" font-size="12" fill="#475569">output_tokens</text>

<path d="M278 250L296 250" stroke="#475569" stroke-width="1.8" fill="none"/>
<polygon points="304,250 293,254.5 293,245.5" fill="#475569"/>
<path d="M800 250L818 250" stroke="#475569" stroke-width="1.8" fill="none"/>
<polygon points="826,250 815,254.5 815,245.5" fill="#475569"/>

<!-- ===== 底部 ===== -->
<text x="550" y="640" text-anchor="middle" font-size="13" fill="#475569">type-safe：只会返回你列过的类型与选项，不会凭空造出选项 D —— 但可能选错</text>

</g>
</svg>
