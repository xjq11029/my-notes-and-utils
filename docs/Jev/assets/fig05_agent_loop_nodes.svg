<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img">
<rect width="1100" height="620" fill="#FFFFFF"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">

<text x="550" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2937">Agent 循环里，哪些位置该换成 Jev</text>
<text x="550" y="78" text-anchor="middle" font-size="14" fill="#6B7280">这些判断过去每一个都要消耗一次 LLM 调用</text>

<!-- ===== 连线（先画，压在节点下方） ===== -->
<path d="M250 282L320 199" stroke="#475569" stroke-width="1.8" fill="none"/>
<polygon points="328,190 323.79,203.48 315.39,196.36" fill="#475569"/>

<path d="M552 168L626 168" stroke="#475569" stroke-width="1.8" fill="none"/>
<polygon points="638,168 625,173.5 625,162.5" fill="#475569"/>

<path d="M855 206L951 272" stroke="#475569" stroke-width="1.8" fill="none"/>
<polygon points="960,278 946.19,275.18 952.41,266.1" fill="#475569"/>

<path d="M960 358 C 960 400, 830 406, 658 420" stroke="#475569" stroke-width="1.8" fill="none"/>
<polygon points="646,424 658.47,417.39 659.43,428.35" fill="#475569"/>

<path d="M468 468 C 330 470, 175 428, 164 374" stroke="#475569" stroke-width="1.8" fill="none"/>
<polygon points="162,362 169.84,373.74 159.04,375.8" fill="#475569"/>

<path d="M692 468L746 468" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 5" fill="none"/>
<polygon points="758,468 745,473.5 745,462.5" fill="#475569"/>

<text x="255" y="415" text-anchor="middle" font-size="12" fill="#6B7280">回到观察</text>
<text x="725" y="452" text-anchor="middle" font-size="11" fill="#6B7280">旁支</text>

<!-- ===== 节点：观察 ===== -->
<rect x="60" y="280" width="200" height="76" rx="9" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<text x="160" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">观察 / 上一步结果</text>

<!-- ===== 节点：该调用哪个工具 ===== -->
<rect x="330" y="130" width="220" height="76" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="440" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">该调用哪个工具？</text>
<text x="440" y="188" text-anchor="middle" font-size="12" fill="#6B7280">过去：一次 LLM 调用</text>

<!-- ===== 节点：执行工具 ===== -->
<rect x="640" y="130" width="220" height="76" rx="9" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<text x="750" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">执行工具</text>

<!-- ===== 节点：这一步结果是否通过 ===== -->
<rect x="850" y="280" width="220" height="76" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="960" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">这一步结果是否通过？</text>
<text x="960" y="338" text-anchor="middle" font-size="12" fill="#6B7280">过去：一次 LLM 调用</text>

<!-- ===== 节点：任务是否结束 ===== -->
<rect x="470" y="430" width="220" height="76" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="580" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">任务是否结束？</text>
<text x="580" y="488" text-anchor="middle" font-size="12" fill="#6B7280">过去：一次 LLM 调用</text>

<!-- ===== 节点：是否需要人工审批（旁支） ===== -->
<rect x="760" y="430" width="220" height="76" rx="9" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.8"/>
<text x="870" y="464" text-anchor="middle" font-size="15" font-weight="700" fill="#0F766E">是否需要人工审批？</text>
<text x="870" y="488" text-anchor="middle" font-size="12" fill="#6B7280">过去：一次 LLM 调用</text>

<!-- ===== 底部 ===== -->
<text x="550" y="580" text-anchor="middle" font-size="14" fill="#475569">代码控制权限与执行，Jev 只负责选择与检查</text>

</g>
</svg>
