<svg viewBox="0 0 680 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="受控自治循环的八个步骤">
  <rect x="0" y="0" width="680" height="504" fill="#111721"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4a5a6c"/>
    </marker>
  </defs>
  <g font-family="sans-serif">
    <rect x="200" y="16" width="280" height="42" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
    <text x="216" y="35" fill="#4dabf7" font-size="12" font-weight="700">1</text>
    <text x="236" y="35" fill="#dfe6ee" font-size="13.5" font-weight="600">接收目标</text>
    <text x="236" y="51" fill="#7d8b9c" font-size="11">用户任务或上游调度任务</text>

    <rect x="200" y="74" width="280" height="42" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
    <text x="216" y="93" fill="#4dabf7" font-size="12" font-weight="700">2</text>
    <text x="236" y="93" fill="#dfe6ee" font-size="13.5" font-weight="600">装配上下文</text>
    <text x="236" y="109" fill="#7d9cbb" font-size="11">指令 + 状态 + 记忆 + 工具说明 + 环境，裁剪到预算内</text>

    <rect x="200" y="132" width="280" height="42" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
    <text x="216" y="151" fill="#4dabf7" font-size="12" font-weight="700">3</text>
    <text x="236" y="151" fill="#dfe6ee" font-size="13.5" font-weight="600">模型生成动作候选</text>
    <text x="236" y="167" fill="#7d8b9c" font-size="11">回答 / 调工具 / 交接子 Agent / 更新计划</text>

    <rect x="200" y="190" width="280" height="42" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
    <text x="216" y="209" fill="#4dabf7" font-size="12" font-weight="700">4</text>
    <text x="236" y="209" fill="#dfe6ee" font-size="13.5" font-weight="600">执行动作</text>
    <text x="236" y="225" fill="#7d8b9c" font-size="11">Harness 真正触发工具，不让模型"假装已执行"</text>

    <rect x="200" y="248" width="280" height="42" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
    <text x="216" y="267" fill="#4dabf7" font-size="12" font-weight="700">5</text>
    <text x="236" y="267" fill="#dfe6ee" font-size="13.5" font-weight="600">采集反馈</text>
    <text x="236" y="283" fill="#7d8b9c" font-size="11">工具结果、测试结果、异常信息回流</text>

    <rect x="200" y="306" width="280" height="42" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.5"/>
    <text x="216" y="325" fill="#e8a34b" font-size="12" font-weight="700">6</text>
    <text x="236" y="325" fill="#f0dcc0" font-size="13.5" font-weight="600">验证与约束</text>
    <text x="236" y="341" fill="#b09a7c" font-size="11">是否通过校验？是否越权？是否触发护栏？</text>

    <rect x="200" y="364" width="280" height="42" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
    <text x="216" y="383" fill="#4dabf7" font-size="12" font-weight="700">7</text>
    <text x="236" y="383" fill="#dfe6ee" font-size="13.5" font-weight="600">更新状态</text>
    <text x="236" y="399" fill="#7d8b9c" font-size="11">中间结果、检查点、执行日志落盘</text>

    <rect x="200" y="422" width="280" height="42" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
    <text x="216" y="441" fill="#4dabf7" font-size="12" font-weight="700">8</text>
    <text x="236" y="441" fill="#dfe6ee" font-size="13.5" font-weight="600">决定下一步</text>
    <text x="236" y="457" fill="#7d9cbb" font-size="11">继续 / 重试 / 改计划 / 交接 / 求助人类 / 结束</text>

    <g stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar2)">
      <line x1="340" y1="58" x2="340" y2="72"/>
      <line x1="340" y1="116" x2="340" y2="130"/>
      <line x1="340" y1="174" x2="340" y2="188"/>
      <line x1="340" y1="232" x2="340" y2="246"/>
      <line x1="340" y1="290" x2="340" y2="304"/>
      <line x1="340" y1="348" x2="340" y2="362"/>
      <line x1="340" y1="406" x2="340" y2="420"/>
    </g>

    <!-- 回环 -->
    <path d="M480,443 L560,443 L560,95 L482,95" fill="none" stroke="#2dd4a7" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
    <text x="574" y="250" fill="#2dd4a7" font-size="11.5" font-family="sans-serif" transform="rotate(90 574 250)" text-anchor="middle">继续下一轮</text>

    <!-- 左侧注释 -->
    <path d="M200,95 L150,95" stroke="#3a4a5e" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="144" y="92" fill="#e8a34b" font-size="11" text-anchor="end">每一轮都可能重新装配</text>
    <text x="144" y="108" fill="#6b7a8d" font-size="10.5" text-anchor="end">不是一次性准备动作</text>

    <path d="M200,327 L150,327" stroke="#3a4a5e" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="144" y="324" fill="#e8a34b" font-size="11" text-anchor="end">Harness 的本质在这里</text>
    <text x="144" y="340" fill="#6b7a8d" font-size="10.5" text-anchor="end">先看结果，再决定是否放行</text>
  </g>
  <text x="340" y="493" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 5</text>
</svg>
