<svg viewBox="0 0 680 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="12 个组件在一轮 Agent Loop 中的落位">
  <rect x="0" y="0" width="680" height="364" fill="#111721"/>
  <rect x="18" y="12" width="104" height="42" rx="7" fill="#1b2532" stroke="#3a4a5e"/>
  <text x="70" y="30" fill="#4dabf7" font-size="10.5" font-weight="700" text-anchor="middle" font-family="sans-serif">Step 1</text>
  <text x="70" y="47" fill="#dfe6ee" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">组装 prompt</text>

  <rect x="126" y="12" width="104" height="42" rx="7" fill="#1b2532" stroke="#3a4a5e"/>
  <text x="178" y="30" fill="#4dabf7" font-size="10.5" font-weight="700" text-anchor="middle" font-family="sans-serif">Step 2</text>
  <text x="178" y="47" fill="#dfe6ee" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">模型推理</text>

  <rect x="234" y="12" width="104" height="42" rx="7" fill="#1b2532" stroke="#3a4a5e"/>
  <text x="286" y="30" fill="#4dabf7" font-size="10.5" font-weight="700" text-anchor="middle" font-family="sans-serif">Step 3</text>
  <text x="286" y="47" fill="#dfe6ee" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">输出解析</text>

  <rect x="342" y="12" width="104" height="42" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="394" y="30" fill="#e8a34b" font-size="10.5" font-weight="700" text-anchor="middle" font-family="sans-serif">Step 4</text>
  <text x="394" y="47" fill="#f0dcc0" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">工具执行</text>

  <rect x="450" y="12" width="104" height="42" rx="7" fill="#1b2532" stroke="#3a4a5e"/>
  <text x="502" y="30" fill="#4dabf7" font-size="10.5" font-weight="700" text-anchor="middle" font-family="sans-serif">Step 5</text>
  <text x="502" y="47" fill="#dfe6ee" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">结果封装</text>

  <rect x="558" y="12" width="104" height="42" rx="7" fill="#1b2532" stroke="#3a4a5e"/>
  <text x="610" y="30" fill="#4dabf7" font-size="10.5" font-weight="700" text-anchor="middle" font-family="sans-serif">Step 6</text>
  <text x="610" y="47" fill="#dfe6ee" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">上下文更新</text>

  <rect x="23" y="64" width="94" height="26" rx="6" fill="#151c26" stroke="#232d3b"/>
  <text x="70" y="81" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">⑤ Prompt 构造</text>
  <rect x="23" y="98" width="94" height="26" rx="6" fill="#151c26" stroke="#232d3b"/>
  <text x="70" y="115" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">④ 上下文管理</text>

  <rect x="131" y="64" width="94" height="26" rx="6" fill="#151c26" stroke="#232d3b"/>
  <text x="178" y="81" fill="#6b7a8d" font-size="10.5" text-anchor="middle" font-family="sans-serif">（模型本身）</text>

  <rect x="239" y="64" width="94" height="26" rx="6" fill="#151c26" stroke="#232d3b"/>
  <text x="286" y="81" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">⑥ 输出解析</text>

  <rect x="347" y="64" width="94" height="26" rx="6" fill="#151c26" stroke="#3d3223"/>
  <text x="394" y="81" fill="#c9a97a" font-size="10.5" text-anchor="middle" font-family="sans-serif">② 工具</text>
  <rect x="347" y="98" width="94" height="26" rx="6" fill="#151c26" stroke="#3d3223"/>
  <text x="394" y="115" fill="#c9a97a" font-size="10.5" text-anchor="middle" font-family="sans-serif">⑨ 护栏</text>

  <rect x="455" y="64" width="94" height="26" rx="6" fill="#151c26" stroke="#232d3b"/>
  <text x="502" y="81" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">⑧ 错误处理</text>

  <rect x="563" y="64" width="94" height="26" rx="6" fill="#151c26" stroke="#232d3b"/>
  <text x="610" y="81" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">⑦ 状态管理</text>
  <rect x="563" y="98" width="94" height="26" rx="6" fill="#151c26" stroke="#232d3b"/>
  <text x="610" y="115" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">④ 上下文管理</text>

  <rect x="18" y="138" width="644" height="30" rx="7" fill="#151c26" stroke="#232d3b"/>
  <text x="34" y="157" fill="#6b7a8d" font-size="11" font-family="sans-serif">① 编排循环：贯穿全程的骨架　·　⑫ 可观测性：横切全程（日志 / 追踪 / 成本与延迟计量）</text>

  <rect x="18" y="182" width="316" height="126" rx="9" fill="#151c26" stroke="#232d3b"/>
  <text x="34" y="204" fill="#dfe6ee" font-size="12" font-weight="650" font-family="sans-serif">Step 4 的细节（最关键的一步）</text>
  <text x="34" y="228" fill="#93a1b1" font-size="11" font-family="sans-serif">校验参数 → 检查权限 → 在沙箱中执行 → 捕获结果</text>
  <text x="34" y="250" fill="#93a1b1" font-size="11" font-family="sans-serif">只读操作可并行；会改状态的操作必须串行</text>
  <text x="34" y="272" fill="#e8a34b" font-size="11" font-family="sans-serif">错误在此捕获，作为 error result 回喂给模型</text>

  <rect x="346" y="182" width="316" height="126" rx="9" fill="#151c26" stroke="#232d3b"/>
  <text x="362" y="204" fill="#dfe6ee" font-size="12" font-weight="650" font-family="sans-serif">终止条件是分层的，任一层满足就停</text>
  <text x="362" y="228" fill="#93a1b1" font-size="11" font-family="sans-serif">· 模型生成了不含工具调用的响应</text>
  <text x="362" y="248" fill="#93a1b1" font-size="11" font-family="sans-serif">· 超过最大轮次 / token 预算耗尽</text>
  <text x="362" y="268" fill="#93a1b1" font-size="11" font-family="sans-serif">· 护栏 tripwire 被触发</text>
  <text x="362" y="288" fill="#93a1b1" font-size="11" font-family="sans-serif">· 用户中断 / 返回安全拒答</text>
  <text x="340" y="353" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 13</text>
</svg>
