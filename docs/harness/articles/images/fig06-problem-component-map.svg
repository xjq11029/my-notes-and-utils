<svg viewBox="0 0 680 434" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="五个必然问题与 12 个组件的映射：每一行是一个问题及其对冲机制，右侧方块是承载该机制的具体组件，最下方两个组件贯穿全程">
  <rect x="0" y="0" width="680" height="434" fill="#111721"/>
  <defs>
    <marker id="ar31" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4a5a6c"/>
    </marker>
  </defs>

  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">五个必然问题 → 各自的对冲机制 → 12 个组件的落点</text>
  <text x="340" y="42" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">每一行是一个必然问题，右侧方块是承载该机制的具体组件；方块里的数字与组件表的编号一致</text>

  <g font-family="sans-serif">
    <!-- ① 上下文膨胀与腐化 -->
    <rect x="24" y="62" width="210" height="40" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
    <text x="40" y="79" fill="#f0655f" font-size="12.5" font-weight="650">① 上下文膨胀与腐化</text>
    <text x="40" y="94" fill="#7fa89c" font-size="10.5">→ 上下文管理 + Prompt 构造</text>
    <line x1="238" y1="82" x2="256" y2="82" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar31)"/>
    <rect x="262" y="69" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="276" y="86" fill="#2dd4a7" font-size="11" font-weight="700">4</text>
    <text x="294" y="86" fill="#cfe3dc" font-size="11.5">上下文管理</text>
    <rect x="398" y="69" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="412" y="86" fill="#2dd4a7" font-size="11" font-weight="700">5</text>
    <text x="430" y="86" fill="#cfe3dc" font-size="11.5">Prompt 构造</text>
    <rect x="534" y="69" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="548" y="86" fill="#2dd4a7" font-size="11" font-weight="700">11</text>
    <text x="566" y="86" fill="#cfe3dc" font-size="11.5">子 Agent 编排</text>

    <!-- ② 错误累积 -->
    <rect x="24" y="108" width="210" height="40" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
    <text x="40" y="125" fill="#f0655f" font-size="12.5" font-weight="650">② 错误累积</text>
    <text x="40" y="140" fill="#7fa89c" font-size="10.5">→ 输出解析 + 错误处理</text>
    <line x1="238" y1="128" x2="256" y2="128" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar31)"/>
    <rect x="262" y="115" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="276" y="132" fill="#2dd4a7" font-size="11" font-weight="700">6</text>
    <text x="294" y="132" fill="#cfe3dc" font-size="11.5">输出解析</text>
    <rect x="398" y="115" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="412" y="132" fill="#2dd4a7" font-size="11" font-weight="700">8</text>
    <text x="430" y="132" fill="#cfe3dc" font-size="11.5">错误处理</text>

    <!-- ③ 跨会话失忆 -->
    <rect x="24" y="154" width="210" height="40" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
    <text x="40" y="171" fill="#f0655f" font-size="12.5" font-weight="650">③ 跨会话失忆</text>
    <text x="40" y="186" fill="#7fa89c" font-size="10.5">→ 记忆 + 状态管理</text>
    <line x1="238" y1="174" x2="256" y2="174" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar31)"/>
    <rect x="262" y="161" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="276" y="178" fill="#2dd4a7" font-size="11" font-weight="700">3</text>
    <text x="294" y="178" fill="#cfe3dc" font-size="11.5">记忆</text>
    <rect x="398" y="161" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="412" y="178" fill="#2dd4a7" font-size="11" font-weight="700">7</text>
    <text x="430" y="178" fill="#cfe3dc" font-size="11.5">状态管理</text>
    <rect x="534" y="161" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="548" y="178" fill="#2dd4a7" font-size="11" font-weight="700">11</text>
    <text x="566" y="178" fill="#cfe3dc" font-size="11.5">子 Agent 编排</text>

    <!-- ④ 权限越界 -->
    <rect x="24" y="200" width="210" height="40" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
    <text x="40" y="217" fill="#f0655f" font-size="12.5" font-weight="650">④ 权限越界</text>
    <text x="40" y="232" fill="#7fa89c" font-size="10.5">→ 工具 + 护栏与安全</text>
    <line x1="238" y1="220" x2="256" y2="220" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar31)"/>
    <rect x="262" y="207" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="276" y="224" fill="#2dd4a7" font-size="11" font-weight="700">2</text>
    <text x="294" y="224" fill="#cfe3dc" font-size="11.5">工具</text>
    <rect x="398" y="207" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="412" y="224" fill="#2dd4a7" font-size="11" font-weight="700">9</text>
    <text x="430" y="224" fill="#cfe3dc" font-size="11.5">护栏与安全</text>

    <!-- ⑤ 无法自验 -->
    <rect x="24" y="246" width="210" height="40" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
    <text x="40" y="263" fill="#f0655f" font-size="12.5" font-weight="650">⑤ 无法自验</text>
    <text x="40" y="278" fill="#7fa89c" font-size="10.5">→ 验证回路</text>
    <line x1="238" y1="266" x2="256" y2="266" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar31)"/>
    <rect x="262" y="253" width="122" height="26" rx="6" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="276" y="270" fill="#2dd4a7" font-size="11" font-weight="700">10</text>
    <text x="294" y="270" fill="#cfe3dc" font-size="11.5">验证回路</text>

    <line x1="24" y1="300" x2="656" y2="300" stroke="#2a3644" stroke-width="1"/>

    <!-- 贯穿全程 -->
    <rect x="24" y="312" width="210" height="40" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
    <text x="40" y="329" fill="#e8a34b" font-size="12.5" font-weight="650">贯穿全程：骨架与横切</text>
    <text x="40" y="344" fill="#b09a7c" font-size="10.5">不属于任何单一问题</text>
    <line x1="238" y1="332" x2="256" y2="332" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar31)"/>
    <rect x="262" y="319" width="190" height="26" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
    <text x="276" y="336" fill="#e8a34b" font-size="11" font-weight="700">1</text>
    <text x="294" y="336" fill="#f0dcc0" font-size="11.5">编排循环 · 骨架</text>
    <rect x="466" y="319" width="190" height="26" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
    <text x="480" y="336" fill="#e8a34b" font-size="11" font-weight="700">12</text>
    <text x="498" y="336" fill="#f0dcc0" font-size="11.5">可观测性 · 横切</text>

    <!-- 图例 -->
    <rect x="26" y="371" width="10" height="10" rx="2" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
    <text x="42" y="380" fill="#8b98a8" font-size="10.5">必然问题（源自模型结构属性）</text>
    <rect x="252" y="371" width="10" height="10" rx="2" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
    <text x="268" y="380" fill="#8b98a8" font-size="10.5">harness 组件（对冲手段）</text>
    <rect x="436" y="371" width="10" height="10" rx="2" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
    <text x="452" y="380" fill="#8b98a8" font-size="10.5">贯穿全程，不挂单一问题</text>
  </g>
  <text x="340" y="423" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 6</text>
</svg>
