<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830">
  <rect width="1200" height="830" fill="#FFFFFF"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">

    <!-- 标题 -->
    <text x="60" y="48" font-size="26" font-weight="700" fill="#1F2937">会话 → 提示词 → 深度思考：三级递进</text>
    <text x="60" y="78" font-size="15" fill="#6B7280">这三节串起来只讲一件事——怎么把上下文管住</text>

    <!-- ===== 会话 ===== -->
    <rect x="40" y="130" width="170" height="158" rx="10" fill="#EFF4FE" stroke="#2563EB" stroke-width="1.6"/>
    <text x="125" y="202" font-size="20" font-weight="700" fill="#1D4ED8" text-anchor="middle">会话</text>
    <text x="125" y="230" font-size="12" fill="#6B7280" text-anchor="middle">Conversation</text>

    <rect x="230" y="130" width="930" height="158" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.4"/>
    <text x="256" y="170" font-size="15" font-weight="700" fill="#1F2937">同一个会话里，每一次用户发消息都要把之前的所有历史消息内容全部带上</text>
    <rect x="256" y="192" width="140" height="30" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="326" y="212" font-size="13" fill="#475569" text-anchor="middle" font-family="Consolas,monospace">conversation</text>
    <rect x="406" y="192" width="106" height="30" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="459" y="212" font-size="13" fill="#475569" text-anchor="middle" font-family="Consolas,monospace">session</text>
    <rect x="522" y="192" width="98" height="30" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="571" y="212" font-size="13" fill="#475569" text-anchor="middle" font-family="Consolas,monospace">thread</text>
    <text x="644" y="212" font-size="13" fill="#6B7280">三个叫法，指的都是同一件事</text>
    <text x="256" y="262" font-size="13" fill="#6B7280">模型本身没有任何记忆——历史要么你自己带，要么服务商帮你带</text>

    <!-- ===== 提示词 ===== -->
    <rect x="40" y="306" width="170" height="158" rx="10" fill="#FEF6EC" stroke="#B45309" stroke-width="1.6"/>
    <text x="125" y="378" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">提示词</text>
    <text x="125" y="406" font-size="12" fill="#6B7280" text-anchor="middle">Prompt</text>

    <rect x="230" y="306" width="930" height="158" rx="10" fill="#FFFFFF" stroke="#FCD9A8" stroke-width="1.4"/>
    <text x="256" y="346" font-size="15" font-weight="700" fill="#1F2937">提示词分两级：全局对所有工程生效，工程只对本工程生效</text>
    <rect x="256" y="368" width="434" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="278" y="398" font-size="14" font-weight="700" fill="#334155">全局提示词</text>
    <text x="278" y="422" font-size="12.5" fill="#6B7280">用户主目录 · 所有工程 · 常常可以不写</text>
    <rect x="706" y="368" width="434" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
    <text x="728" y="398" font-size="14" font-weight="700" fill="#334155">工程提示词</text>
    <text x="728" y="422" font-size="12.5" fill="#6B7280">工程根目录 · 仅本工程 · 写「做什么 + 核心目录 + 文档位置」</text>

    <!-- ===== 深度思考 ===== -->
    <rect x="40" y="482" width="170" height="208" rx="10" fill="#F4F0FE" stroke="#6D28D9" stroke-width="1.6"/>
    <text x="125" y="578" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">深度思考</text>
    <text x="125" y="604" font-size="12" fill="#6B7280" text-anchor="middle">推理 / 思维链</text>

    <rect x="230" y="482" width="930" height="208" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.4"/>

    <text x="256" y="532" font-size="13" fill="#6B7280">普通回复：</text>
    <rect x="248" y="544" width="132" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/>
    <text x="314" y="569" font-size="13.5" fill="#334155" text-anchor="middle">用户问题</text>
    <path d="M380,564 H410" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
    <polygon points="410,559 410,569 420,564" fill="#94A3B8"/>
    <rect x="420" y="544" width="112" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/>
    <text x="476" y="569" font-size="13.5" fill="#334155" text-anchor="middle">模型</text>
    <path d="M532,564 H562" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
    <polygon points="562,559 562,569 572,564" fill="#94A3B8"/>
    <rect x="572" y="544" width="112" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/>
    <text x="628" y="569" font-size="13.5" fill="#334155" text-anchor="middle">回复</text>

    <text x="256" y="616" font-size="13" fill="#5B21B6">深度思考：</text>
    <rect x="248" y="628" width="132" height="40" rx="8" fill="#F4F0FE" stroke="#6D28D9" stroke-width="1.3"/>
    <text x="314" y="653" font-size="13.5" fill="#4C1D95" text-anchor="middle">用户问题</text>
    <path d="M380,648 H404" stroke="#6D28D9" stroke-width="1.6" fill="none"/>
    <polygon points="404,643 404,653 414,648" fill="#6D28D9"/>
    <rect x="414" y="628" width="104" height="40" rx="8" fill="#F4F0FE" stroke="#6D28D9" stroke-width="1.3"/>
    <text x="466" y="653" font-size="13.5" fill="#4C1D95" text-anchor="middle">模型</text>
    <path d="M518,648 H542" stroke="#6D28D9" stroke-width="1.6" fill="none"/>
    <polygon points="542,643 542,653 552,648" fill="#6D28D9"/>
    <rect x="552" y="628" width="132" height="40" rx="8" fill="#F4F0FE" stroke="#6D28D9" stroke-width="1.3"/>
    <text x="618" y="653" font-size="13.5" fill="#4C1D95" text-anchor="middle">思考过程</text>
    <path d="M684,648 H708" stroke="#6D28D9" stroke-width="1.6" fill="none"/>
    <polygon points="708,643 708,653 718,648" fill="#6D28D9"/>
    <rect x="718" y="628" width="104" height="40" rx="8" fill="#F4F0FE" stroke="#6D28D9" stroke-width="1.3"/>
    <text x="770" y="653" font-size="13.5" fill="#4C1D95" text-anchor="middle">模型</text>
    <path d="M822,648 H846" stroke="#6D28D9" stroke-width="1.6" fill="none"/>
    <polygon points="846,643 846,653 856,648" fill="#6D28D9"/>
    <rect x="856" y="628" width="220" height="40" rx="8" fill="#EDF7F5" stroke="#0F766E" stroke-width="1.3"/>
    <text x="966" y="653" font-size="13.5" fill="#0F766E" text-anchor="middle">确定性更高的回复</text>

    <!-- 底部要点 -->
    <rect x="40" y="726" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
    <text x="600" y="760" font-size="15" fill="#1F2937" text-anchor="middle">三级其实在做同一件事——用少量前置说明，换掉大量上下文消耗</text>

  </g>
</svg>
