<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>tool calling 裸流程：模型点菜，客户端做菜</title>
<desc>五步裸流程：定义函数、上报 Schema、模型返回 tool_calls、客户端执行、role=tool 回填后再调模型；右侧为点菜单与回填消息的契约形状。</desc>
<defs>
<marker id="ar4h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">tool calling 裸流程：模型点菜，客户端做菜</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">模型只下订单不下厨；执行、校验、回填，全部是客户端的事</text>

<!-- 左列：五步 -->
<rect x="34" y="88" width="240" height="44" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="154" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">① 定义普通函数</text>
<text x="154" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">模型看不见函数体，只看得见 Schema</text>

<rect x="34" y="146" width="240" height="44" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="154" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">② Schema 放进 tools 字段</text>
<text x="154" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">description 是选工具的唯一依据</text>

<path d="M154 132L154 142" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar4h)"/>

<rect x="34" y="204" width="240" height="52" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="154" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">③ 模型返回 tool_calls</text>
<text x="154" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">点菜：只下订单，不下厨</text>

<path d="M154 190L154 200" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar4h)"/>
<path d="M154 256L154 266" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar4h)"/>

<rect x="34" y="270" width="240" height="44" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="154" y="289" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">④ 客户端执行</text>
<text x="154" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">做菜：找到函数、校验参数、真正调用</text>

<rect x="34" y="328" width="240" height="44" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="154" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">⑤ role=tool 回填 → 再调模型</text>
<text x="154" y="363" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">tool_call_id 配对，content 为字符串</text>

<path d="M154 314L154 324" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar4h)"/>

<!-- 回环：不再请求工具 -->
<path d="M34 350L20 350L20 230L30 230" fill="none" stroke="#4dabf7" stroke-width="1.6" marker-end="url(#ar4h)"/>
<text x="16" y="290" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1" text-anchor="middle" transform="rotate(-90 16 290)">不再请求工具 → 结束</text>

<!-- 右上：点菜单（模型原始响应） -->
<rect x="320" y="88" width="326" height="116" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1"/>
<text x="336" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c9b8ff">③ 模型返回（实测点菜单）</text>
<text x="336" y="130" font-family="Consolas, monospace" font-size="10.5" fill="#c9b8ff">"finish_reason": "tool_calls"</text>
<text x="336" y="148" font-family="Consolas, monospace" font-size="10.5" fill="#c9b8ff">"name": "write_file"</text>
<text x="336" y="166" font-family="Consolas, monospace" font-size="10.5" fill="#c9b8ff">"arguments": "{\"filepath\": ...}"</text>
<text x="336" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">arguments 是 JSON 字符串，要先 json.loads</text>

<!-- 右中：回填消息 -->
<rect x="320" y="222" width="326" height="104" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="336" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3c47a">⑤ 回填（上菜）role=tool</text>
<text x="336" y="264" font-family="Consolas, monospace" font-size="10.5" fill="#f3c47a">{ "role": "tool",</text>
<text x="336" y="280" font-family="Consolas, monospace" font-size="10.5" fill="#f3c47a">  "tool_call_id": "call_1",</text>
<text x="336" y="296" font-family="Consolas, monospace" font-size="10.5" fill="#f3c47a">  "name": "write_file",</text>
<text x="336" y="312" font-family="Consolas, monospace" font-size="10.5" fill="#f3c47a">  "content": "已写入文件" }</text>

<!-- 右下：契约红线 -->
<rect x="320" y="344" width="326" height="56" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1"/>
<text x="336" y="366" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0655f">契约红线：漏回填 / id 配不上 → API 直接报错</text>
<text x="336" y="385" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">并行点菜时，每个 tool_call 都要一条配对的 tool 消息</text>
</svg>
