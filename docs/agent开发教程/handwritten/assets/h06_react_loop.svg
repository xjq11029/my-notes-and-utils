<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>ReAct 循环与三通道事件流</title>
<desc>左侧是 ReAct 循环：调模型、判断是否点菜、执行工具、回填、再来一轮，直到不再点菜；右侧是一次调用的事件流实测：思考通道与工具通道先后触发，没有 content 事件。</desc>
<defs>
<marker id="ar6h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">ReAct 循环与三通道事件流</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">循环的全部秘密就几行 while True；事件流让每一步可见</text>

<!-- 左：循环 -->
<rect x="60" y="88" width="170" height="46" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="145" y="107" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">① 调用模型</text>
<text x="145" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">model.invoke(stream)</text>

<path d="M145 134L145 150" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6h)"/>

<polygon points="145,154 229,190 145,226 61,190" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="145" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">点菜？</text>
<text x="145" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">tool_calls？</text>

<path d="M145 226L145 242" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6h)"/>
<text x="154" y="238" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">有</text>

<rect x="60" y="246" width="170" height="46" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="145" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">② 执行工具</text>
<text x="145" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">registry.invoke</text>

<path d="M145 292L145 308" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6h)"/>

<rect x="60" y="312" width="170" height="46" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="145" y="331" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">③ 回填</text>
<text x="145" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">role=tool 消息进上下文</text>

<path d="M60 335L28 335L28 111L56 111" fill="none" stroke="#4dabf7" stroke-width="1.6" marker-end="url(#ar6h)"/>
<text x="20" y="223" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1" text-anchor="middle" transform="rotate(-90 20 223)">再来一轮，直到不再点菜</text>

<path d="M229 190L246 190" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6h)"/>
<text x="237" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">None</text>

<rect x="250" y="167" width="110" height="46" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="305" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">结束 break</text>
<text x="305" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">任务完成</text>

<path d="M315 217L315 242" fill="none" stroke="#f0655f" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar6h)"/>
<rect x="250" y="246" width="140" height="46" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1"/>
<text x="320" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0655f">护栏：max_turns</text>
<text x="320" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">防死循环（S7 讲）</text>

<!-- 右：事件流面板 -->
<rect x="396" y="88" width="250" height="324" rx="8" fill="#141b28" stroke="#3a4a5e" stroke-width="1"/>
<text x="412" y="112" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">第 1 轮的事件流（实测）</text>

<circle cx="416" cy="130" r="4" fill="#a78bfa"/>
<text x="426" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">思考</text>
<circle cx="470" cy="130" r="4" fill="#e8a34b"/>
<text x="480" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">工具</text>
<circle cx="524" cy="130" r="4" fill="#4dabf7"/>
<text x="534" y="134" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">正文</text>

<rect x="430" y="148" width="160" height="20" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="1"/>
<text x="510" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#c9b8ff">reasoning_start</text>
<path d="M510 168L510 172" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar6h)"/>

<rect x="430" y="174" width="160" height="20" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="1"/>
<text x="510" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#c9b8ff">reasoning ×2</text>
<path d="M510 194L510 198" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar6h)"/>

<rect x="430" y="200" width="160" height="20" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="1"/>
<text x="510" y="214" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#c9b8ff">reasoning_end</text>
<path d="M510 220L510 224" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar6h)"/>

<rect x="430" y="226" width="160" height="20" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="510" y="240" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#f3c47a">tool_call_start</text>
<path d="M510 246L510 250" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar6h)"/>

<rect x="430" y="252" width="160" height="20" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="510" y="266" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#f3c47a">tool_call</text>
<path d="M510 272L510 276" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar6h)"/>

<rect x="430" y="278" width="160" height="20" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="510" y="292" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#f3c47a">tool_call_end</text>
<path d="M510 298L510 320" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar6h)"/>

<text x="412" y="314" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">没有 content 事件：只点菜，没说话</text>

<rect x="430" y="322" width="160" height="20" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="510" y="336" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#93a1b1">COMPLETE</text>

<text x="412" y="364" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">最终回答那轮：content 通道</text>
<text x="412" y="380" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">→ COMPLETE，循环到此结束</text>
</svg>
