<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>工具封装流水线：inspect → Pydantic → schema()，registry 双向调度</title>
<desc>左列是你写的工作量（函数、装饰器、注解），中列是自动生成的链路（inspect、Pydantic、JSON Schema），右列是运行时的三个部件（schema()、__call__、registry），底部是 registry 的双向调度与 S6 终止信号。</desc>
<defs>
<marker id="ar5h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">工具封装流水线：写一个函数，其余全自动</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">类型来自注解，必填/可选来自默认值，描述来自装饰器——Schema 白送</text>

<!-- 三列标题 -->
<text x="34" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">你写的（全部工作量）</text>
<text x="250" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">自动生成</text>
<text x="466" y="94" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">运行时</text>

<!-- 列 1：你写的 -->
<rect x="34" y="106" width="180" height="56" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="124" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">普通函数</text>
<text x="124" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">docstring 写用途</text>

<rect x="34" y="176" width="180" height="56" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="124" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">@tool(参数描述…)</text>
<text x="124" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">参数含义与定义待在一起</text>

<rect x="34" y="246" width="180" height="56" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="124" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">类型注解 + 默认值</text>
<text x="124" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">filepath: str → type: string</text>

<path d="M124 162L124 172" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar5h)"/>
<path d="M124 232L124 242" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar5h)"/>

<!-- 列 2：自动生成 -->
<rect x="250" y="106" width="180" height="56" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="340" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">inspect.signature</text>
<text x="340" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">解析函数签名</text>

<rect x="250" y="176" width="180" height="56" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="340" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">pydantic.create_model</text>
<text x="340" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">动态建参数模型</text>

<rect x="250" y="246" width="180" height="56" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="340" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">model_json_schema()</text>
<text x="340" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">JSON Schema 白送</text>

<path d="M340 162L340 172" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar5h)"/>
<path d="M340 232L340 242" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar5h)"/>

<path d="M218 134L246 134" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar5h)"/>
<path d="M218 204L246 204" fill="none" stroke="#6b7a8d" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar5h)"/>

<!-- 列 3：运行时 -->
<rect x="466" y="106" width="180" height="56" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="556" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">Tool.schema()</text>
<text x="556" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">OpenAI function 格式</text>

<rect x="466" y="176" width="180" height="56" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="556" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">Tool.__call__</text>
<text x="556" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">先校验再执行，异常转文本</text>

<rect x="466" y="246" width="180" height="56" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="556" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">ToolRegistry</text>
<text x="556" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">register / schemas / invoke</text>

<path d="M430 134L462 134" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar5h)"/>
<path d="M462 274L446 274L446 204L462 204" fill="none" stroke="#6b7a8d" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar5h)"/>

<!-- 底部：registry 双向调度 -->
<rect x="34" y="330" width="396" height="60" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="351" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">registry 双向调度</text>
<text x="50" y="369" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">schemas() 出：全部 Schema → session.tools → 请求的 tools 字段</text>
<text x="50" y="384" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">invoke() 进：查表执行 tool_calls → 包装成 role=tool 消息回填</text>

<!-- 底部右：终止信号 -->
<rect x="466" y="330" width="180" height="60" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1"/>
<text x="556" y="351" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0655f">没有 tool_calls → None</text>
<text x="556" y="369" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">这个 None 是 S6 ReAct</text>
<text x="556" y="384" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">循环的终止信号（伏笔）</text>
<path d="M556 302L556 326" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar5h)"/>
</svg>
