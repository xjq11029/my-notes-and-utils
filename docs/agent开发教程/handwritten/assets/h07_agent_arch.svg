<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>Agent 分层架构：编排层组装，事件总线解耦</title>
<desc>编排层 Agent 之下是模型层、会话层、工具层；模型层把调用过程发到 EventEmitter 事件总线，监听层从总线订阅事件，与模型层解耦。</desc>
<defs>
<marker id="ar7h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">Agent 分层架构：编排层组装，事件总线解耦</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">编排层向下依赖三个功能层；监听层经事件总线旁路挂载，模型层零感知</text>

<!-- 编排层 -->
<rect x="200" y="88" width="280" height="56" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
<text x="340" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#8ecbff">编排层 · Agent</text>
<text x="340" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">invoke 循环 + max_turns 安全阀</text>

<!-- 编排层 → 三个功能层 -->
<path d="M300 144L300 164L155 164L155 182" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar7h)"/>
<path d="M340 144L340 182" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar7h)"/>
<path d="M380 144L380 164L525 164L525 182" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar7h)"/>

<!-- 三个功能层 -->
<rect x="80" y="188" width="150" height="56" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="155" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">模型层 · Model</text>
<text x="155" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">流式调用 · 屏蔽厂商差异</text>

<rect x="265" y="188" width="150" height="56" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="340" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">会话层 · Session</text>
<text x="340" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">消息历史 + 工具清单</text>

<rect x="450" y="188" width="150" height="56" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="525" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">工具层 · registry</text>
<text x="525" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">schemas 导出 · 按名分发</text>

<!-- 模型层 → 事件总线 -->
<path d="M155 244L155 280" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar7h)"/>
<text x="165" y="268" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">emit：思考 / 正文 / 工具调用 / complete</text>

<!-- 事件总线 -->
<rect x="80" y="286" width="520" height="40" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
<text x="340" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#9fb0c0">底座 · EventEmitter 事件总线（发布-订阅）</text>
<text x="340" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">on(event, callback) · emit(event, **data)</text>

<!-- 事件总线 → 监听层 -->
<path d="M340 326L340 348" fill="none" stroke="#f0655f" stroke-width="1.5" marker-end="url(#ar7h)"/>
<text x="350" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">listen()：订阅全部事件</text>

<!-- 监听层 -->
<rect x="80" y="354" width="520" height="48" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="340" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ff9e97">监听层 · ModelListener 子类们</text>
<text x="340" y="392" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">打印（ModelPrinterListener）· 日志 · UI · 计费 —— 可插拔，模型层零改动</text>
</svg>
