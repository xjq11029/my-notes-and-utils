<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>会话对照：两个独立 Session vs 同一 Session 共享历史</title>
<desc>左侧两个独立 Session 各自只有一条 user 消息，第二次提问失忆；右侧同一 Session 历史滚动增长，每次调用重传全部消息，追问得以续答。底部是两条会话纪律。</desc>
<defs>
<marker id="ar3h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">会话：失忆 vs 记得</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">模型服务无状态；「记住」= 客户端每次重传完整历史</text>

<!-- 左侧：两个独立 Session -->
<text x="34" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">两个独立 Session —— 互不知情</text>

<rect x="34" y="102" width="252" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="48" y="119" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">Session a（第 1 次调用，1 条消息）</text>
<text x="48" y="137" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">user：uv 是什么？</text>

<path d="M160 146 L160 164" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3h)"/>

<rect x="34" y="164" width="252" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="48" y="181" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">assistant</text>
<text x="48" y="199" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">uv 是 Astral 用 Rust 写的…（正常回答）</text>

<rect x="34" y="230" width="252" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="48" y="247" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">Session b（全新会话，0 条历史）</text>
<text x="48" y="265" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">user：如何安装？</text>

<path d="M160 274 L160 292" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3h)"/>

<rect x="34" y="292" width="252" height="52" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="48" y="310" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f08a84">assistant —— 失忆</text>
<text x="48" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">抱歉，「如何安装」是指什么？</text>

<!-- 右侧：同一 Session -->
<text x="386" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">同一 Session —— 历史滚动增长</text>

<text x="386" y="110" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">第 1 次调用：重传 1 条消息</text>
<rect x="386" y="116" width="260" height="36" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="400" y="139" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">user：uv 是什么？</text>

<path d="M516 152 L516 168" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3h)"/>

<rect x="386" y="168" width="260" height="36" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="400" y="191" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">assistant：uv 是 Astral 用 Rust…</text>

<text x="386" y="224" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">第 2 次调用：重传 3 条消息（user+assistant+user）</text>

<path d="M600 204 L600 230" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3h)"/>

<rect x="386" y="230" width="260" height="36" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="400" y="253" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">user：如何安装？</text>

<path d="M516 266 L516 282" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3h)"/>

<rect x="386" y="282" width="260" height="48" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="400" y="301" font-family="system-ui, sans-serif" font-size="10" fill="#c9b8ff">assistant：接着上面的 —— Windows 用</text>
<text x="400" y="317" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">irm … install.ps1 | iex 安装</text>

<text x="386" y="346" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">每次调用都把上面所有消息重新发一遍 —— token 随轮次增长</text>

<!-- 底部纪律 -->
<rect x="34" y="358" width="300" height="48" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="48" y="377" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">纪律① 历史只追加、不修改</text>
<text x="48" y="394" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">改动历史会破坏服务商端 prompt cache 的前缀命中</text>

<rect x="346" y="358" width="300" height="48" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="360" y="377" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c9b8ff">纪律② 上下文里保留思维链</text>
<text x="360" y="394" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">丢掉 reasoning_content，推理模型后续轮次质量下降</text>
</svg>
