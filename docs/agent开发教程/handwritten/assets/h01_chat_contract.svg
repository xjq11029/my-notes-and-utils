<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>Chat Completions 契约：请求、响应与流式 chunk 流</title>
<desc>请求 JSON（model/messages/tools/stream）发给模型服务，返回响应 JSON（choices/usage/finish_reason）；stream=true 时响应被切成 chunk 流，正文藏在 delta 里，Model 层拼回与非流式一致的 message。</desc>
<defs>
<marker id="ar1h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">模型接口契约：一份 JSON 的请求与响应</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">OpenAI Chat Completions；stream=true 时响应被切成 chunk 流，正文藏在 delta 里</text>

<!-- 请求侧 -->
<rect x="34" y="86" width="190" height="150" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="48" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">① 请求 JSON</text>
<text x="48" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">model: "gpt-4o-mini"</text>
<text x="48" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">messages: [ {role, content} ]</text>
<text x="48" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">tools?: 工具 Schema（S4）</text>
<text x="48" y="176" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">stream?: 是否流式</text>
<text x="48" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">四种 role（框架线第 3 章四个类的底层）：</text>
<rect x="48" y="202" width="40" height="24" rx="5" fill="#14212f" stroke="#4dabf7" stroke-width="0.8"/>
<text x="68" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#93a1b1">system</text>
<rect x="90" y="202" width="40" height="24" rx="5" fill="#14212f" stroke="#4dabf7" stroke-width="0.8"/>
<text x="110" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#93a1b1">user</text>
<rect x="132" y="202" width="40" height="24" rx="5" fill="#14212f" stroke="#4dabf7" stroke-width="0.8"/>
<text x="152" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#93a1b1">assistant</text>
<rect x="174" y="202" width="40" height="24" rx="5" fill="#14212f" stroke="#4dabf7" stroke-width="0.8"/>
<text x="194" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#93a1b1">tool</text>

<!-- 模型服务 -->
<rect x="262" y="112" width="148" height="98" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="336" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#c9b8ff">模型服务</text>
<text x="336" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">OpenAI 兼容端点</text>
<text x="336" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">Ollama / vLLM / 云厂商</text>
<text x="336" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">POST /v1/chat/completions</text>

<!-- 响应侧 -->
<rect x="456" y="86" width="190" height="150" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="470" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3c47a">② 响应 JSON</text>
<text x="470" y="128" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">id / object / created / model</text>
<text x="470" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">choices[].message ← 正文</text>
<text x="470" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">choices[].finish_reason</text>
<text x="470" y="176" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">usage: prompt / completion / total</text>
<rect x="470" y="188" width="162" height="38" rx="6" fill="#2a1f24" stroke="#f0655f" stroke-width="1"/>
<text x="480" y="203" font-family="system-ui, sans-serif" font-size="9.5" fill="#f08a84">思考字段名不统一（S1 坑 3）：</text>
<text x="480" y="219" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">reasoning_content / reasoning</text>

<!-- 第一行箭头 -->
<path d="M226 150 L260 150" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar1h)"/>
<text x="243" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">POST</text>
<path d="M412 150 L454 150" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar1h)"/>
<text x="433" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">响应</text>

<!-- 分隔线 -->
<line x1="34" y1="252" x2="646" y2="252" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 4"/>
<text x="34" y="274" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">流式（stream = true）：响应被切成一串 chunk</text>

<!-- chunk 流 -->
<rect x="34" y="286" width="106" height="42" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="87" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">chunk 0</text>
<text x="87" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">delta='1、2'</text>

<rect x="150" y="286" width="106" height="42" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="203" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">chunk 1</text>
<text x="203" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">delta='、3、'</text>

<rect x="266" y="286" width="106" height="42" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="319" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">chunk 2</text>
<text x="319" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">delta='4、5'</text>

<rect x="382" y="286" width="106" height="42" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="435" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">chunk 3</text>
<text x="435" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">delta='。'</text>

<rect x="498" y="286" width="106" height="42" rx="6" fill="#1b2532" stroke="#e8a34b" stroke-width="1.2"/>
<text x="551" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">chunk 4（末尾）</text>
<text x="551" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f3c47a">finish='stop'</text>

<path d="M140 307 L148 307" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar1h)"/>
<path d="M256 307 L264 307" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar1h)"/>
<path d="M372 307 L380 307" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar1h)"/>
<path d="M488 307 L496 307" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar1h)"/>

<!-- 装配 -->
<path d="M340 328 L340 348" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar1h)"/>
<rect x="140" y="350" width="400" height="46" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="340" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">Model 层把 delta 逐片累积，拼回与非流式一致的 message</text>
<text x="340" y="387" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">finish_reason 出现在最后一个 chunk —— 它是流结束的标志</text>
</svg>
