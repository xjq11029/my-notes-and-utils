<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img">
<title>reducer 的三种归并语义：覆盖、追加与自定义</title>
<desc>同一个 State 里不同字段可以有不同的合并规则：没有 Annotated 时新值覆盖旧值；operator.add 追加；自定义函数按自己的规则合并，例如 add_messages 按 ID 替换。</desc>
<defs>
<marker id="ar112" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#e8a34b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="430" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">reducer：同一张图里，每个字段各有一套合并规则</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">公式：new = reducer(left = 当前状态值, right = 节点返回的更新)</text>

<!-- ① 覆盖 -->
<rect x="34" y="80" width="196" height="258" rx="9" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="48" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ff9d99">① 覆盖（默认）</text>
<text x="48" y="122" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">没写 Annotated → 新值顶掉旧值</text>

<text x="48" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">旧值</text>
<rect x="48" y="152" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="132" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">counter = 0</text>

<rect x="48" y="186" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="132" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">① A 返回 1</text>

<rect x="48" y="218" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="132" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">② B 返回 2</text>

<text x="126" y="262" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">reducer</text>
<path d="M142 245L142 267" fill="none" stroke="#e8a34b" stroke-width="1.8" marker-end="url(#ar112)"/>

<rect x="48" y="270" width="168" height="42" rx="7" fill="#111721" stroke="#f0655f" stroke-width="1.2"/>
<text x="132" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ff9d99">结果：2</text>
<text x="48" y="330" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">A 写过的值被冲掉了</text>

<!-- ② 追加 -->
<rect x="242" y="80" width="196" height="258" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="256" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">② 追加　operator.add</text>
<text x="256" y="122" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">Annotated[list, operator.add]</text>

<text x="256" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">旧值</text>
<rect x="256" y="152" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="340" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">log = []</text>

<rect x="256" y="186" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="340" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">① A 返回 ["a"]</text>

<rect x="256" y="218" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="340" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">② B 返回 ["b"]</text>

<text x="334" y="262" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">reducer</text>
<path d="M350 245L350 267" fill="none" stroke="#e8a34b" stroke-width="1.8" marker-end="url(#ar112)"/>

<rect x="256" y="270" width="168" height="42" rx="7" fill="#111721" stroke="#4dabf7" stroke-width="1.2"/>
<text x="340" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">结果：["a", "b"]</text>
<text x="256" y="330" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">两份都在，顺序是 A → B</text>

<!-- ③ 自定义 -->
<rect x="450" y="80" width="196" height="258" rx="9" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="464" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">③ 自定义函数</text>
<text x="464" y="122" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">add_messages　（自己写同规格）</text>

<text x="464" y="146" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">旧值</text>
<rect x="464" y="152" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="548" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">messages = [起点]</text>

<rect x="464" y="186" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="548" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">① id=m1 内容 "a"</text>

<rect x="464" y="218" width="168" height="26" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="548" y="235" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">② id=m1 内容 "b"</text>

<text x="542" y="262" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">reducer</text>
<path d="M558 245L558 267" fill="none" stroke="#e8a34b" stroke-width="1.8" marker-end="url(#ar112)"/>

<rect x="464" y="270" width="168" height="42" rx="7" fill="#111721" stroke="#a78bfa" stroke-width="1.2"/>
<text x="548" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c9b8ff">结果：只剩 id=m1</text>
<text x="464" y="330" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">同 id 替换，不重复追加</text>

<!-- 底注 -->
<rect x="34" y="354" width="612" height="60" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="50" y="376" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f3c47a">想清空追加型字段？返回 [] 会被拼上去，旧值还在 —— 必须 Overwrite([])</text>
<text x="50" y="397" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">没有 reducer 的字段本来就是覆盖，Overwrite 对它没有意义</text>
</svg>
