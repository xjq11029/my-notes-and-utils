<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img">
<title>模型初始化的三个角度</title>
<desc>同一个目标——造一个模型对象——有三条路径：自己选类、用 init_chat_model 让框架按前缀选类、连本地 Ollama。三条路径的失效方式各不相同。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="460" fill="#111721"/>

<text x="34" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">模型初始化的三个角度</text>
<text x="34" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">唯一会变的量：谁替你决定用哪个类。分类依据是三条路径的失效方式不同。</text>

<!-- ============ 列 1 ============ -->
<rect x="34" y="90" width="196" height="340" rx="10" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8ecbff">角度 1｜模型提供商库</text>
<line x1="50" y1="130" x2="214" y2="130" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">你自己选类</text>

<rect x="50" y="168" width="164" height="30" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="62" y="188" font-family="system-ui, sans-serif" font-size="12" fill="#dfe6ee">ChatOpenAI</text>
<rect x="50" y="206" width="164" height="30" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="62" y="226" font-family="system-ui, sans-serif" font-size="12" fill="#dfe6ee">ChatDeepSeek</text>
<rect x="50" y="244" width="164" height="30" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="62" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#dfe6ee">ChatOllama</text>

<text x="50" y="298" font-family="system-ui, sans-serif" font-size="11" fill="#6b7a8d">三个类各管一家，参数名随厂商走</text>

<line x1="50" y1="330" x2="214" y2="330" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="352" font-family="system-ui, sans-serif" font-size="10.5" fill="#f0655f">失效方式</text>
<text x="50" y="370" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">换平台要改代码：</text>
<text x="50" y="386" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">类名、参数名、环境变量</text>
<text x="50" y="402" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">全都跟着变</text>

<!-- ============ 列 2 ============ -->
<rect x="242" y="90" width="196" height="340" rx="10" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="258" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8ecbff">角度 2｜init_chat_model</text>
<line x1="258" y1="130" x2="422" y2="130" stroke="#3a4a5e" stroke-width="1"/>
<text x="258" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">框架替你选类</text>

<rect x="258" y="168" width="164" height="30" rx="6" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="270" y="188" font-family="system-ui, sans-serif" font-size="11.5" fill="#c9b8ff">"openai:gpt-4o"</text>

<path d="M340 198L340 212" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<rect x="258" y="216" width="164" height="30" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="270" y="236" font-family="system-ui, sans-serif" font-size="11.5" fill="#93a1b1">注册表：前缀 → 类</text>

<path d="M340 246L340 260" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<rect x="258" y="264" width="164" height="30" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="270" y="284" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">ChatOpenAI（结果）</text>

<text x="258" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#6b7a8d">换模型只改字符串</text>

<line x1="258" y1="330" x2="422" y2="330" stroke="#3a4a5e" stroke-width="1"/>
<text x="258" y="352" font-family="system-ui, sans-serif" font-size="10.5" fill="#f0655f">失效方式</text>
<text x="258" y="370" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">前缀拼错 → 构造期就报错，</text>
<text x="258" y="386" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">并把当前版本支持的</text>
<text x="258" y="402" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">provider 全表打给你</text>

<!-- ============ 列 3 ============ -->
<rect x="450" y="90" width="196" height="340" rx="10" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="466" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7fe3cd">角度 3｜本地 Ollama</text>
<line x1="466" y1="130" x2="630" y2="130" stroke="#3a4a5e" stroke-width="1"/>
<text x="466" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">模型不在云端</text>

<rect x="466" y="184" width="164" height="42" rx="6" fill="#142b28" stroke="#3fd0b0" stroke-width="1.2"/>
<text x="478" y="202" font-family="system-ui, sans-serif" font-size="11.5" fill="#7fe3cd">本机服务</text>
<text x="478" y="218" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">localhost:11434</text>

<path d="M548 226L548 240" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<rect x="466" y="244" width="164" height="30" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="478" y="264" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">ChatOllama</text>

<text x="466" y="298" font-family="system-ui, sans-serif" font-size="11" fill="#6b7a8d">构造时不发请求，模型要 pull</text>

<line x1="466" y1="330" x2="630" y2="330" stroke="#3a4a5e" stroke-width="1"/>
<text x="466" y="352" font-family="system-ui, sans-serif" font-size="10.5" fill="#f0655f">失效方式</text>
<text x="466" y="370" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">服务没起 / 模型没 pull：</text>
<text x="466" y="386" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">构造能过，一调用才</text>
<text x="466" y="402" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">连接失败</text>
</svg>
