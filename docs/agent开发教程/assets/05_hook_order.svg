<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img">
<title>六个钩子在一次工具调用轮次里的真实触发顺序</title>
<desc>实测顺序：before_agent、before_model、wrap_model_call、after_model、wrap_tool_call、工具执行、before_model、wrap_model_call、after_model、after_agent。</desc>

<rect x="0" y="0" width="680" height="470" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">一次工具调用轮次里，钩子按什么顺序触发</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">实测顺序（langchain 1.4.2 / 1.5.11），不是从文档推断的</text>

<!-- 泳道头 -->
<rect x="34" y="80" width="86" height="30" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="77" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">序号</text>
<rect x="128" y="80" width="180" height="30" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="218" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">触发的钩子</text>
<rect x="316" y="80" width="330" height="30" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="481" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">它在干什么</text>

<!-- 行 -->
<rect x="34" y="116" width="86" height="30" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="0.8"/>
<text x="77" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c9b8ff">1</text>
<text x="140" y="136" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">before_agent</text>
<text x="328" y="136" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">整个调用开始，注入一次性上下文</text>

<rect x="34" y="150" width="86" height="30" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.8"/>
<text x="77" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8ecbff">2</text>
<text x="140" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">before_model</text>
<text x="328" y="170" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">第 1 次模型调用前（压缩 / 裁剪 / 注入）</text>

<rect x="34" y="184" width="86" height="30" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.8"/>
<text x="77" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8ecbff">3</text>
<text x="140" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">wrap_model_call</text>
<text x="328" y="204" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">真正发请求（可换模型、改请求体）</text>

<rect x="34" y="218" width="86" height="30" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.8"/>
<text x="77" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8ecbff">4</text>
<text x="140" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">after_model</text>
<text x="328" y="238" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">拿到回复：里面是「请调用工具」</text>

<rect x="34" y="252" width="86" height="30" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="0.8"/>
<text x="77" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f3c47a">5</text>
<text x="140" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">wrap_tool_call</text>
<text x="328" y="272" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">包住工具执行（重试 / 兜错 / 拦截）</text>

<rect x="34" y="286" width="86" height="30" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="0.8"/>
<text x="77" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7fe3cd">6</text>
<text x="140" y="306" font-family="system-ui, sans-serif" font-size="11" fill="#7fe3cd">工具函数体执行</text>
<text x="328" y="306" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">真正干活的一步（不是钩子，是工具本身）</text>

<rect x="34" y="320" width="86" height="30" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.8"/>
<text x="77" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8ecbff">7</text>
<text x="140" y="340" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">before_model</text>
<text x="328" y="340" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">第 2 次模型调用前（带着工具结果）</text>

<rect x="34" y="354" width="86" height="30" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.8"/>
<text x="77" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8ecbff">8</text>
<text x="140" y="374" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">wrap_model_call</text>
<text x="328" y="374" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">第 2 次真正发请求</text>

<rect x="34" y="388" width="86" height="30" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.8"/>
<text x="77" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8ecbff">9</text>
<text x="140" y="408" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">after_model</text>
<text x="328" y="408" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">拿到最终答复（不再请求工具）</text>

<rect x="34" y="422" width="86" height="30" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="0.8"/>
<text x="77" y="442" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c9b8ff">10</text>
<text x="140" y="442" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">after_agent</text>
<text x="328" y="442" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">整个调用结束</text>

<!-- 底部标注 -->
<text x="34" y="466" font-family="system-ui, sans-serif" font-size="10" fill="#e8a34b">读法：1 与 10 只出现一次（包住整个调用）；2–4 与 7–9 各出现两次（因为一轮里模型被调了两次）</text>
</svg>
