<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>response_format 的两条策略路径</title>
<desc>create_agent 收到 response_format 后先包成 AutoStrategy。假模型没有 provider 能力标记，落到 ToolStrategy：把 schema 包成一个工具让模型调用。真实 provider 支持原生结构化输出时落到 ProviderStrategy：直接发 json_schema，不发 tool_call。</desc>
<defs>
<marker id="ar56a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">response_format 走了哪条路，决定了你看到什么</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">同一个参数，假模型和真实 provider 走的不是同一条道——这是误解最多的一处</text>

<rect x="220" y="88" width="240" height="46" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="340" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#dfe6ee">create_agent(response_format=Schema)</text>

<text x="340" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">先包成 AutoStrategy，再按模型能力选路</text>

<path d="M300 158L200 158L200 180" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar56a)"/>
<path d="M380 158L480 158L480 180" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar56a)"/>

<rect x="24" y="186" width="300" height="146" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="40" y="210" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">假模型 / 无 provider 标记</text>
<text x="40" y="232" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">→ ToolStrategy（工具策略）</text>
<text x="40" y="254" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">把 schema 包成一个工具，让模型去「调用」它</text>
<text x="40" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">参数不合法 → 写回一条错误 ToolMessage → 重试</text>
<text x="40" y="298" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">策略工具名：Python 取类名 / title</text>
<text x="40" y="316" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">JS 取 schema 的 title，缺省 extract-N</text>

<rect x="356" y="186" width="300" height="146" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="372" y="210" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">真实 provider 且支持原生</text>
<text x="372" y="232" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">→ ProviderStrategy（原生策略）</text>
<text x="372" y="254" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">直接发 response_format: json_schema</text>
<text x="372" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">strict:true，<tspan font-weight="700">不发 tool_call</tspan></text>
<text x="372" y="298" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">已实测：ChatOpenAI 缺省即走这条路</text>
<text x="372" y="316" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">与假模型基类的结果形态完全不同</text>

<rect x="24" y="348" width="632" height="54" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="340" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#9fb0c0">取结果：Python　result["structured_response"]（已校验的 Pydantic 实例，不用 json.loads）</text>
<text x="340" y="388" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#9fb0c0">JS　result.structuredResponse（策略没命中时是 undefined，框架不报错）</text>
</svg>
