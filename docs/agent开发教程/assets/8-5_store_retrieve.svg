<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>写入与召回：向量只是索引，原文才是产物</title>
<desc>写入侧：Document 短块交给 add_documents，内部调 embed_documents 批量嵌入，向量与原文、metadata 一起落库。召回侧：查询先 embed_query 嵌成向量，similarity_search 取最近 k 条，返回的是原始 Document 而不是向量。召回之后还有重排与生成，重排不在本章范围。</desc>
<defs>
<marker id="ar85" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="36" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">写入与召回：向量只是索引，原文才是产物</text>
<text x="34" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">同一个库的两端：写入离线跑，召回每次提问都跑</text>

<!-- 写入 -->
<text x="34" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c9b8ff">写入 · 离线</text>
<text x="106" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">文档变了才重跑</text>

<rect x="38" y="102" width="140" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="52" y="124" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">Document</text>
<text x="52" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">短块 + metadata</text>
<text x="52" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">Split 的产物</text>

<path d="M182 135L190 135" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar85)"/>

<rect x="192" y="102" width="140" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="206" y="124" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">add_documents</text>
<text x="206" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">逐条处理</text>
<text x="206" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">写入的唯一入口</text>

<path d="M336 135L344 135" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar85)"/>

<rect x="346" y="102" width="140" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="360" y="124" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">embed_documents</text>
<text x="360" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">批量嵌入</text>
<text x="360" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">短块 → 向量</text>

<path d="M490 135L498 135" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar85)"/>

<rect x="500" y="102" width="140" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="514" y="124" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">库</text>
<text x="514" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">向量 + 原文 + 出处</text>
<text x="514" y="160" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">三者一起落库</text>

<!-- 召回 -->
<text x="34" y="196" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">召回 · 在线</text>
<text x="106" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">每次提问都跑</text>

<rect x="38" y="206" width="140" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="52" y="228" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">查询</text>
<text x="52" y="248" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">用户的原话</text>
<text x="52" y="264" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">一次一跑</text>

<path d="M182 239L190 239" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar85)"/>

<rect x="192" y="206" width="140" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="206" y="228" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">embed_query</text>
<text x="206" y="248" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">单条嵌入</text>
<text x="206" y="264" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">必须是同一个模型</text>

<path d="M336 239L344 239" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar85)"/>

<rect x="346" y="206" width="140" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="360" y="228" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">相似度检索</text>
<text x="360" y="248" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">similarity_search</text>
<text x="360" y="264" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">比距离，取最近 k 条</text>

<path d="M490 239L498 239" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar85)"/>

<rect x="500" y="206" width="140" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="514" y="228" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">k 条 Document</text>
<text x="514" y="248" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">原文 + metadata</text>
<text x="514" y="264" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">不是向量</text>

<!-- 两段式 -->
<text x="34" y="288" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">召回之后还有两跳</text>

<rect x="38" y="300" width="206" height="42" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="52" y="318" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">① 召回　本章讲到这</text>
<text x="52" y="334" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">从库里取 k 条候选</text>

<rect x="248" y="300" width="196" height="42" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="262" y="318" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f3c47a">② 重排　本章不涉及</text>
<text x="262" y="334" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">把 k 条再筛成 n 条</text>

<rect x="448" y="300" width="198" height="42" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="462" y="318" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c9b8ff">③ 生成</text>
<text x="462" y="334" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">片段 + 问题 → 答案</text>

<text x="40" y="366" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">向量只是索引：召回拿回的永远是原文 + metadata，所以出处一路没丢。</text>
<text x="40" y="386" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">分数别跨库比：余弦 / 内积 / 欧氏下，同一个数字含义不同。</text>
<text x="40" y="406" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">换库不改业务代码：接口一样，换的只是构造函数那一行。</text>
</svg>
