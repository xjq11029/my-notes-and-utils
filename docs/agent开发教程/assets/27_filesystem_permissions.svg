<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>虚拟文件系统的工具集、后端与权限判定</title>
<desc>文件工具挂在后端上，权限规则按声明顺序首次匹配即生效；未命中默认放行，递归 delete 例外。</desc>
<defs>
<marker id="ar21" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">虚拟文件系统：工具、后端、权限</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">「文件」到底存在哪由后端决定；工具只是接口，换后端不换用法</text>

<!-- 工具 -->
<rect x="34" y="82" width="612" height="72" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#dfe6ee">文件工具集（模型看到的接口）</text>
<rect x="50" y="114" width="76" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.9"/>
<text x="88" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">ls</text>
<rect x="134" y="114" width="86" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.9"/>
<text x="177" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">read_file</text>
<rect x="228" y="114" width="90" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.9"/>
<text x="273" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">write_file</text>
<rect x="326" y="114" width="86" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.9"/>
<text x="369" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">edit_file</text>
<rect x="420" y="114" width="72" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.9"/>
<text x="456" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">delete</text>
<rect x="500" y="114" width="66" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.9"/>
<text x="533" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">glob</text>
<rect x="574" y="114" width="58" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="0.9"/>
<text x="603" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">grep</text>

<path d="M340 154L340 176" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar21)"/>

<!-- 后端 -->
<rect x="34" y="180" width="380" height="128" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.3"/>
<text x="50" y="202" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#7fe3cd">后端：文件真正落在哪</text>

<rect x="50" y="212" width="176" height="40" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="138" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#dfe6ee">StateBackend（默认）</text>
<text x="138" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">存在图状态里，随线程走</text>

<rect x="238" y="212" width="164" height="40" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="320" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#dfe6ee">StoreBackend</text>
<text x="320" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">跨线程持久（记忆用）</text>

<rect x="50" y="258" width="176" height="40" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="138" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#dfe6ee">FilesystemBackend</text>
<text x="138" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">真实磁盘（小心权限）</text>

<rect x="238" y="258" width="164" height="40" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="320" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#dfe6ee">CompositeBackend</text>
<text x="320" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">按路径分流到不同后端</text>

<!-- 权限 -->
<rect x="430" y="180" width="216" height="128" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="446" y="202" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">权限：首次匹配即生效</text>

<text x="446" y="224" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">1. deny /secrets/**</text>
<path d="M446 230L646 230" fill="none" stroke="#3a4a5e" stroke-width="1"/>
<text x="446" y="248" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">2. allow /workspace/**</text>
<path d="M446 254L646 254" fill="none" stroke="#3a4a5e" stroke-width="1"/>
<text x="446" y="272" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">3. 其余路径 → 默认 allow（放行）</text>

<text x="446" y="294" font-family="system-ui, sans-serif" font-size="9" fill="#f0655f">顺序写反 → 后一条永远不生效</text>

<!-- 底部 -->
<rect x="34" y="322" width="612" height="92" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="342" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">三个容易忽略的点</text>
<text x="50" y="361" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">① mode 有 'allow' / 'deny' / 'interrupt' 三档——'interrupt' 是「暂停问人」，不是拒绝</text>
<text x="50" y="378" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">② 权限是声明式清单，按顺序判定：具体规则在前；未命中默认放行，且递归 delete 不吃这一套</text>
<text x="50" y="395" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">③ 默认 StateBackend 让文件享受检查点（可回放），但换个 thread_id 就是白纸</text>
</svg>
