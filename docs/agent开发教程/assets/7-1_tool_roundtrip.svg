<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img">
<title>一次工具调用的五步往返</title>
<desc>模型输出 tool_calls，框架按 name 找工具并校验参数，工具执行后返回值被包成 ToolMessage，tool_call_id 填回原来的 id，消息再次进入模型决定下一步。接缝是 id 与 tool_call_id。</desc>
<defs>
<marker id="ar71" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="540" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">一次工具调用的五步往返</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">模型只在第 1 步和第 5 步出现；中间三步全由框架和工具完成</text>

<line x1="58" y1="146" x2="58" y2="442" stroke="#3a4a5e" stroke-width="1.4" stroke-dasharray="3 4"/>

<rect x="34" y="92" width="5" height="54" rx="2" fill="#4dabf7"/>
<rect x="34" y="92" width="612" height="54" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<circle cx="58" cy="119" r="11" fill="#111721" stroke="#4dabf7" stroke-width="1.2"/>
<text x="58" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8ecbff">1</text>
<text x="82" y="114" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">模型　输出 tool_calls：{name, args, id}</text>
<text x="82" y="133" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">只有意图，一个函数都没有执行</text>

<path d="M58 146L58 164" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar71)"/>

<rect x="34" y="166" width="5" height="54" rx="2" fill="#a78bfa"/>
<rect x="34" y="166" width="612" height="54" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<circle cx="58" cy="193" r="11" fill="#111721" stroke="#a78bfa" stroke-width="1.2"/>
<text x="58" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c9b8ff">2</text>
<text x="82" y="188" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">框架 tools 节点　按 name 找到工具</text>
<text x="82" y="207" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">用参数 schema 校验 args，校验不过就抛错</text>

<path d="M58 220L58 238" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar71)"/>

<rect x="34" y="240" width="5" height="54" rx="2" fill="#e8a34b"/>
<rect x="34" y="240" width="612" height="54" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<circle cx="58" cy="267" r="11" fill="#111721" stroke="#e8a34b" stroke-width="1.2"/>
<text x="58" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f3c47a">3</text>
<text x="82" y="262" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">工具函数　真正执行</text>
<text x="82" y="281" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">读参数、跑函数体、return 一个值</text>

<path d="M58 294L58 312" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar71)"/>

<rect x="34" y="314" width="5" height="54" rx="2" fill="#a78bfa"/>
<rect x="34" y="314" width="612" height="54" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<circle cx="58" cy="341" r="11" fill="#111721" stroke="#a78bfa" stroke-width="1.2"/>
<text x="58" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c9b8ff">4</text>
<text x="82" y="336" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">框架 tools 节点　包成 ToolMessage</text>
<text x="82" y="355" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">tool_call_id 填回第 1 步的 id，追加进历史</text>

<path d="M58 368L58 386" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar71)"/>

<rect x="34" y="388" width="5" height="54" rx="2" fill="#4dabf7"/>
<rect x="34" y="388" width="612" height="54" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<circle cx="58" cy="415" r="11" fill="#111721" stroke="#4dabf7" stroke-width="1.2"/>
<text x="58" y="419" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#8ecbff">5</text>
<text x="82" y="410" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">模型　看 ToolMessage 再决定</text>
<text x="82" y="429" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">继续调工具 → 回到第 1 步；不想调了就给最终答案</text>

<rect x="34" y="466" width="612" height="50" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="50" y="487" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">整条链路的接缝：id ↔ tool_call_id</text>
<text x="50" y="506" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">2.6 的 Command 坑、2.7 的错误处理坑，本质都是这条接缝没对上</text>
</svg>
