<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img">
<title>中间件的六大能力域与预置实现</title>
<desc>执行环境、上下文管理、规划与委派、容错、护栏、引导六个能力域，以及各自的预置中间件。</desc>

<rect x="0" y="0" width="680" height="440" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">六大能力域与它们的预置中间件</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">中间件不是「一堆零散功能」，而是按「解决什么问题」分组的</text>

<!-- 域 1 -->
<rect x="34" y="82" width="300" height="102" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">① 执行环境</text>
<text x="50" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">让模型能碰到世界</text>
<text x="50" y="143" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">FilesystemMiddleware</text>
<text x="50" y="159" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">FilesystemFileSearchMiddleware</text>
<text x="50" y="175" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ShellToolMiddleware</text>

<!-- 域 2 -->
<rect x="346" y="82" width="300" height="102" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.3"/>
<text x="362" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fe3cd">② 上下文管理</text>
<text x="362" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">对抗窗口涨满与腐化</text>
<text x="362" y="143" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">SummarizationMiddleware</text>
<text x="362" y="159" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ContextEditingMiddleware</text>
<text x="362" y="175" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">LLMToolSelectorMiddleware</text>

<!-- 域 3 -->
<rect x="34" y="194" width="300" height="102" rx="9" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="50" y="216" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c9b8ff">③ 规划与委派</text>
<text x="50" y="234" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">拆任务、分上下文</text>
<text x="50" y="255" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">TodoListMiddleware（write_todos）</text>
<text x="50" y="271" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">SubAgentMiddleware（task）</text>
<text x="50" y="287" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">RubricMiddleware（Beta）</text>

<!-- 域 4 -->
<rect x="346" y="194" width="300" height="102" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="362" y="216" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3c47a">④ 容错</text>
<text x="362" y="234" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">外部服务一定会抖</text>
<text x="362" y="255" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ModelRetryMiddleware</text>
<text x="362" y="271" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ToolRetryMiddleware</text>
<text x="362" y="287" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ModelFallbackMiddleware · ToolErrorMiddleware</text>

<!-- 域 5 -->
<rect x="34" y="306" width="300" height="102" rx="9" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="50" y="328" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff9d99">⑤ 护栏</text>
<text x="50" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">别让不该出去的出去</text>
<text x="50" y="367" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">PIIMiddleware</text>
<text x="50" y="383" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ModelCallLimitMiddleware</text>
<text x="50" y="399" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ToolCallLimitMiddleware</text>

<!-- 域 6 -->
<rect x="346" y="306" width="300" height="102" rx="9" fill="#1b2532" stroke="#93a1b1" stroke-width="1.3"/>
<text x="362" y="328" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">⑥ 引导（人在回路）</text>
<text x="362" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">高风险动作前先问人</text>
<text x="362" y="367" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">HumanInTheLoopMiddleware</text>
<text x="362" y="383" font-family="system-ui, sans-serif" font-size="10" fill="#6b7a8d">需要 checkpointer 才能跨中断保持状态</text>

<!-- 底部 -->
<rect x="34" y="418" width="612" height="0" rx="0" fill="none"/>
<text x="340" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9c">这六个域与 docs/harness 里「五个必然问题 → 12 组件」的映射是同一套逻辑，只是换了分组口径</text>
</svg>
