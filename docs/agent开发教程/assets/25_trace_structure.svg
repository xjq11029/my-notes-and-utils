<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>一次 agent 调用产生的 trace 树</title>
<desc>整次调用是一个 chain，内部包含 model 与 tools 两个 chain，各自下面挂 llm 与 tool 的叶子节点。</desc>
<defs>
<marker id="ar25" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">一次 agent 调用产生的 trace 树</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">实测 7 个 run。能逐层下钻，才可能查清「agent 为什么走了这一步」</text>

<!-- 树 -->
<rect x="34" y="82" width="612" height="216" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>

<rect x="50" y="98" width="250" height="26" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="1"/>
<text x="64" y="115" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c9b8ff">chain　price_lookup（整次调用）</text>
<text x="316" y="115" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">= LangSmith 里的一个 trace</text>

<rect x="76" y="132" width="224" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="90" y="149" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">chain　model（第 1 次）</text>
<rect x="102" y="166" width="198" height="26" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="116" y="183" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">llm　ScriptedChatModel</text>
<text x="316" y="183" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">真正那次模型请求</text>

<rect x="76" y="200" width="224" height="26" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="90" y="217" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">chain　tools</text>
<rect x="102" y="234" width="198" height="26" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="116" y="251" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">tool　get_price</text>
<text x="316" y="251" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">真正那次工具执行</text>

<rect x="76" y="268" width="224" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="90" y="285" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">chain　model（第 2 次）</text>
<text x="316" y="285" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">带着工具结果再问一次</text>

<path d="M62 124L62 145L74 145" fill="none" stroke="#3a4a5e" stroke-width="1.2"/>
<path d="M62 124L62 213L74 213" fill="none" stroke="#3a4a5e" stroke-width="1.2"/>
<path d="M62 124L62 281L74 281" fill="none" stroke="#3a4a5e" stroke-width="1.2"/>
<path d="M88 158L88 179L100 179" fill="none" stroke="#3a4a5e" stroke-width="1.2"/>
<path d="M88 226L88 247L100 247" fill="none" stroke="#3a4a5e" stroke-width="1.2"/>

<!-- 三个层次 -->
<rect x="34" y="312" width="200" height="76" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="50" y="332" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">第一层：结果对不对</text>
<text x="50" y="351" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">最终答案是否满足预期</text>
<text x="50" y="369" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">字符串匹配 / 规则判定</text>
<text x="50" y="383" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">容易做，但不够</text>

<rect x="240" y="312" width="200" height="76" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="256" y="332" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f3c47a">第二层：过程对不对</text>
<text x="256" y="351" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">工具选得对不对、调了几次</text>
<text x="256" y="369" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">这才是 agent 评测的分水岭</text>
<text x="256" y="383" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">答案碰对了但过程全错 → 换个输入就崩</text>

<rect x="446" y="312" width="200" height="76" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="462" y="332" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ff9d99">判定器本身也要评测</text>
<text x="462" y="351" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">用 LLM 当裁判会引入四类偏差</text>
<text x="462" y="369" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">位置 / 冗长 / 自我偏好 / 风格</text>
<text x="462" y="383" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">别把裁判当成 ground truth</text>
</svg>
