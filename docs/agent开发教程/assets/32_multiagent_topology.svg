<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img">
<title>三种多智能体拓扑：supervisor、handoff、swarm</title>
<desc>supervisor 有调度者且可收回控制权；handoff 交棒后不回来；swarm 由各 agent 之间互相转移。</desc>
<defs>
<marker id="ar26" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="430" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">三种多智能体拓扑：控制权怎么走</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">区别不在「有几个 agent」，而在「谁决定下一步交给谁、交出去还要不要回来」</text>

<!-- supervisor -->
<rect x="34" y="82" width="196" height="180" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="132" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">supervisor</text>
<text x="132" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">有调度者，可收回控制权</text>

<rect x="102" y="134" width="60" height="26" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="1"/>
<text x="132" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#c9b8ff">调度者</text>

<rect x="50" y="186" width="60" height="26" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="80" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7fe3cd">agent A</text>
<rect x="154" y="186" width="60" height="26" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="184" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7fe3cd">agent B</text>

<path d="M120 160L84 184" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar26)"/>
<path d="M146 160L182 184" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar26)"/>
<path d="M86 186L126 162" fill="none" stroke="#3fd0b0" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar26)"/>
<path d="M180 186L140 162" fill="none" stroke="#3fd0b0" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar26)"/>

<text x="132" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7fe3cd">虚线 = 交回结果继续调度</text>
<text x="132" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">适合：多轮协调的任务</text>

<!-- handoff -->
<rect x="242" y="82" width="196" height="180" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="340" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">handoff</text>
<text x="340" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">交棒后不回来</text>

<rect x="258" y="138" width="70" height="26" rx="5" fill="#241f38" stroke="#a78bfa" stroke-width="1"/>
<text x="293" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#c9b8ff">triage</text>
<rect x="356" y="138" width="70" height="26" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="391" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7fe3cd">接手方</text>

<path d="M328 151L354 151" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar26)"/>

<rect x="258" y="188" width="168" height="26" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="342" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#dfe6ee">Command(goto="接手方")</text>

<text x="340" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f3c47a">控制权一次性交出，像「转人工」</text>
<text x="340" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">适合：一次分流就结束</text>

<!-- swarm -->
<rect x="450" y="82" width="196" height="180" rx="9" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="548" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">swarm</text>
<text x="548" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">agent 之间直接互相转移</text>

<rect x="474" y="138" width="66" height="26" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="507" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7fe3cd">agent A</text>
<rect x="556" y="138" width="66" height="26" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="589" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7fe3cd">agent B</text>

<path d="M540 146L554 146" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar26)"/>
<path d="M556 160L542 160" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar26)"/>

<rect x="474" y="188" width="148" height="26" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="548" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#dfe6ee">谁都能把控制权递给谁</text>

<text x="548" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#c9b8ff">没有中心，最容易失控</text>
<text x="548" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">需要严格的状态设计</text>

<!-- 实现要点 -->
<rect x="34" y="278" width="612" height="60" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="298" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">落地要点（两个语言各有小坑）</text>
<text x="50" y="316" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">Python：create_agent 返回的就是已编译图，可直接 add_node；JS：要取 agent.graph，且返回 Command 的节点必须声明 ends</text>
<text x="50" y="332" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">agent 当节点后会变成子图 → 流式输出需要 subgraphs；记得给每个 agent 起 name，否则 trace 里分不清是谁在跑</text>

<!-- 迁移 -->
<rect x="34" y="350" width="612" height="66" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="50" y="370" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f3c47a">从旧版迁移：不是换函数名，是换表达方式</text>
<text x="50" y="388" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">旧版：agent 是一个组件，用 LCEL 串进链里　→　v1：agent 是一张图，用节点和边定义控制流</text>
<text x="50" y="405" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">建议顺序：① AgentExecutor → createAgent　② LCEL → StateGraph　③ 自定义逻辑收进 middleware（一次全改会分不清哪步引入的问题）</text>
</svg>
