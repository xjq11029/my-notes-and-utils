<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 405" width="680" height="405" role="img">
<title>ChatPromptTemplate 的三个出口</title>
<desc>同一份模板填同一套变量后有三个出口：invoke 返回 ChatPromptValue 可直接喂模型，format_messages 返回 list[BaseMessage] 还能继续拼，format 返回 str 只是带角色标签的文本，不要拿去调模型。</desc>
<defs>
<marker id="ar35" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#93a1b1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar35r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#f0655f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="405" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">一个模板，三个出口</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">填的是同一套变量，交出去的东西完全不一样</text>

<!-- 变量 -->
<rect x="24" y="177" width="130" height="64" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="38" y="201" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">变量</text>
<text x="38" y="221" font-family="ui-monospace, monospace" font-size="9" fill="#93a1b1">{name}　{q}</text>

<path d="M156 209L186 209" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar35)"/>

<!-- 模板 -->
<rect x="190" y="149" width="150" height="120" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="204" y="174" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f3c47a">ChatPromptTemplate</text>
<text x="204" y="194" font-family="ui-monospace, monospace" font-size="8.5" fill="#93a1b1">from_messages([...])</text>
<text x="204" y="220" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">填入变量</text>
<text x="204" y="238" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">→ 一组消息</text>

<!-- 总线 -->
<path d="M342 209L358 209" fill="none" stroke="#6b7a8d" stroke-width="1.5"/>
<path d="M358 129L358 289" fill="none" stroke="#6b7a8d" stroke-width="1.5"/>
<path d="M358 129L378 129" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar35)"/>
<path d="M358 209L378 209" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar35)"/>
<path d="M358 289L378 289" fill="none" stroke="#f0655f" stroke-width="1.5" marker-end="url(#ar35r)"/>

<!-- 出口 1 -->
<rect x="380" y="96" width="276" height="66" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="396" y="122" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#8ecbff">invoke() → ChatPromptValue</text>
<text x="396" y="144" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">可直接喂模型，走 Runnable 链</text>

<!-- 出口 2 -->
<rect x="380" y="176" width="276" height="66" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="396" y="202" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#c9b8ff">format_messages() → list[BaseMessage]</text>
<text x="396" y="224" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">消息列表，还能再拼别的东西</text>

<!-- 出口 3 -->
<rect x="380" y="256" width="276" height="66" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="396" y="282" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#ff9d99">format() → str</text>
<text x="396" y="304" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff9d99">只是标签行文本，别再拿去调模型</text>

<line x1="24" y1="344" x2="656" y2="344" stroke="#3a4a5e" stroke-width="1"/>
<text x="24" y="366" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">三者同源：先填同一套变量，区别只在出口形态。</text>
<text x="24" y="386" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">前两个出口交的是消息对象，第三个交的是被压平的字符串——角色信息只剩一行标签。</text>
</svg>
