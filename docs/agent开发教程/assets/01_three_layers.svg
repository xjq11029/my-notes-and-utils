<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img">
<title>LangChain / LangGraph / Deep Agents 的三层分工</title>
<desc>Deep Agents 建立在 LangChain 的 create_agent 之上，LangChain 建立在 LangGraph 的图运行时之上。左侧是三层，右侧是对应的定位。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="430" fill="#111721"/>

<text x="34" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">三层分工：构建块 → 运行时 → 成品 harness</text>
<text x="34" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">下层的每一层，都是上层的地基；箭头方向 = 「建立在谁之上」</text>

<!-- Deep Agents -->
<rect x="34" y="90" width="360" height="86" rx="10" fill="#241f38" stroke="#a78bfa" stroke-width="1.6"/>
<text x="54" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#c9b8ff">Deep Agents　成品 harness</text>
<text x="54" y="141" font-family="system-ui, sans-serif" font-size="11.5" fill="#93a1b1">create_deep_agent：预装规划、虚拟文件系统、</text>
<text x="54" y="159" font-family="system-ui, sans-serif" font-size="11.5" fill="#93a1b1">子代理、记忆。开箱即用，也能用 HarnessProfile 裁。</text>

<!-- LangChain -->
<rect x="34" y="196" width="360" height="86" rx="10" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.6"/>
<text x="54" y="224" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8ecbff">LangChain v1　构建块 + 默认 harness</text>
<text x="54" y="247" font-family="system-ui, sans-serif" font-size="11.5" fill="#93a1b1">create_agent 给你循环与状态，middleware 给你</text>
<text x="54" y="265" font-family="system-ui, sans-serif" font-size="11.5" fill="#93a1b1">六个钩子。自己组装：要什么装什么。</text>

<!-- LangGraph -->
<rect x="34" y="302" width="360" height="86" rx="10" fill="#142b28" stroke="#3fd0b0" stroke-width="1.6"/>
<text x="54" y="330" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7fe3cd">LangGraph v1　运行时</text>
<text x="54" y="353" font-family="system-ui, sans-serif" font-size="11.5" fill="#93a1b1">图、状态与 reducer、检查点、持久执行、</text>
<text x="54" y="371" font-family="system-ui, sans-serif" font-size="11.5" fill="#93a1b1">中断与恢复、流式。管的是「怎么跑得住」。</text>

<!-- 向上箭头 -->
<path d="M214 302L214 288" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M214 196L214 182" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- 右侧：对应 harness 的哪部分 -->
<rect x="424" y="90" width="222" height="298" rx="10" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="444" y="116" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#dfe6ee">对应 docs/harness 里的</text>

<text x="444" y="146" font-family="system-ui, sans-serif" font-size="11.5" fill="#c9b8ff">Deep Agents</text>
<text x="444" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">= 12 组件的「整包」</text>
<text x="444" y="181" font-family="system-ui, sans-serif" font-size="11" fill="#6b7a8d">规划 / 记忆 / 文件 / 子代理</text>

<text x="444" y="216" font-family="system-ui, sans-serif" font-size="11.5" fill="#8ecbff">LangChain</text>
<text x="444" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">= 12 组件的「按需自组装」</text>
<text x="444" y="251" font-family="system-ui, sans-serif" font-size="11" fill="#6b7a8d">中间件 = 插槽</text>

<text x="444" y="286" font-family="system-ui, sans-serif" font-size="11.5" fill="#7fe3cd">LangGraph</text>
<text x="444" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">= 组件 1 编排循环 / 7 状态管理</text>
<text x="444" y="321" font-family="system-ui, sans-serif" font-size="11" fill="#6b7a8d">/ 10 故障恢复的底座</text>

<line x1="444" y1="340" x2="626" y2="340" stroke="#3a4a5e" stroke-width="1"/>
<text x="444" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#7d8b9c">那篇回答「为什么需要 harness」，</text>
<text x="444" y="379" font-family="system-ui, sans-serif" font-size="11" fill="#7d8b9c">本教程回答「用现成框架怎么搭」。</text>

<!-- 底部结论 -->
<rect x="34" y="400" width="612" height="24" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="340" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#f3c47a">三层不是三个竞品，而是同一条链上的三个抽象层级——按需选层，可以混用</text>
</svg>
