<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img">
<title>中间件的六大能力域与预置实现</title>
<desc>上下文治理、模型调用治理、工具执行治理、人在回路、规划与委派、文件系统与记忆六个能力域，以及各自的预置中间件。</desc>

<rect x="0" y="0" width="680" height="440" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">六大能力域与它们的预置中间件</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">中间件不是「一堆零散功能」，而是按「解决什么问题」分组的</text>

<!-- 域 1 -->
<rect x="34" y="82" width="300" height="102" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">① 上下文治理</text>
<text x="50" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">压缩、裁剪、卸载</text>
<text x="50" y="143" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">SummarizationMiddleware</text>
<text x="50" y="159" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ContextEditingMiddleware</text>
<text x="50" y="175" font-family="system-ui, sans-serif" font-size="10" fill="#6b7a8d">（配合 ClearToolUsesEdit）</text>

<!-- 域 2 -->
<rect x="346" y="82" width="300" height="102" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.3"/>
<text x="362" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fe3cd">② 模型调用治理</text>
<text x="362" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">改请求、补工具调用</text>
<text x="362" y="143" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">PatchToolCallsMiddleware</text>
<text x="362" y="159" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">deepagents 默认装入</text>
<text x="362" y="175" font-family="system-ui, sans-serif" font-size="10" fill="#6b7a8d">（第 14 章）</text>

<!-- 域 3 -->
<rect x="34" y="194" width="300" height="102" rx="9" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="50" y="216" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c9b8ff">③ 工具执行治理</text>
<text x="50" y="234" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">错误兜底、可读 ToolMessage</text>
<text x="50" y="255" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">ToolErrorMiddleware</text>
<text x="50" y="271" font-family="system-ui, sans-serif" font-size="10" fill="#6b7a8d">（第 7 章）</text>

<!-- 域 4 -->
<rect x="346" y="194" width="300" height="102" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="362" y="216" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3c47a">④ 人在回路</text>
<text x="362" y="234" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">高风险动作前先问人</text>
<text x="362" y="255" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">HumanInTheLoopMiddleware</text>
<text x="362" y="271" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">需要 checkpointer</text>
<text x="362" y="287" font-family="system-ui, sans-serif" font-size="10" fill="#6b7a8d">（§2.5 展开）</text>

<!-- 域 5 -->
<rect x="34" y="306" width="300" height="102" rx="9" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="50" y="328" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff9d99">⑤ 规划与委派</text>
<text x="50" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">拆任务、分上下文</text>
<text x="50" y="367" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">TodoListMiddleware（write_todos）</text>
<text x="50" y="383" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">SubAgentMiddleware（task）</text>

<!-- 域 6 -->
<rect x="346" y="306" width="300" height="102" rx="9" fill="#1b2532" stroke="#93a1b1" stroke-width="1.3"/>
<text x="362" y="328" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">⑥ 文件系统与记忆</text>
<text x="362" y="346" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">文件、记忆、技能</text>
<text x="362" y="367" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">FilesystemMiddleware</text>
<text x="362" y="383" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">MemoryMiddleware</text>
<text x="362" y="399" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">SkillsMiddleware</text>

<!-- 底部 -->
<rect x="34" y="418" width="612" height="0" rx="0" fill="none"/>
<text x="340" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9c">这六个域按「解决什么问题」分组；与 docs/harness 的五问题 / 12 组件可对照阅读。</text>
</svg>
