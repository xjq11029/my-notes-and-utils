<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>durability 三档的写入时机</title>
<desc>同一张两节点图、同一输入。sync 在每个超步同步落盘，async 异步落盘并在 invoke 返回前补齐，exit 只在图结束时写一次。三档实测快照数分别是 4、4、1。</desc>
<defs>
<marker id="m124" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">durability 三档：写在哪，就丢在哪</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">同一张两节点图、同一输入；差别只在「什么时候写」</text>

<!-- 图例 -->
<rect x="430" y="76" width="9" height="9" rx="1.5" fill="#4dabf7"/>
<text x="444" y="85" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">已落盘</text>
<circle cx="502" cy="80.5" r="4.5" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<text x="511" y="85" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">未落盘</text>

<!-- sync -->
<rect x="34" y="100" width="86" height="50" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="77" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">sync</text>
<text x="77" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">每步同步</text>

<line x1="140" y1="125" x2="520" y2="125" stroke="#3a4a5e" stroke-width="1.4"/>
<rect x="172" y="120" width="10" height="10" rx="2" fill="#4dabf7"/>
<rect x="268" y="120" width="10" height="10" rx="2" fill="#4dabf7"/>
<rect x="364" y="120" width="10" height="10" rx="2" fill="#4dabf7"/>
<rect x="460" y="120" width="10" height="10" rx="2" fill="#4dabf7"/>
<text x="177" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₁</text>
<text x="273" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₂</text>
<text x="369" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₃</text>
<text x="465" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₄</text>

<text x="556" y="126" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">4 份</text>
<text x="556" y="142" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">崩溃丢当前一步</text>

<!-- async -->
<rect x="34" y="176" width="86" height="50" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="77" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">async</text>
<text x="77" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">异步补写</text>

<line x1="140" y1="201" x2="520" y2="201" stroke="#3a4a5e" stroke-width="1.4"/>
<rect x="172" y="196" width="10" height="10" rx="2" fill="#a78bfa"/>
<rect x="268" y="196" width="10" height="10" rx="2" fill="#a78bfa"/>
<rect x="364" y="196" width="10" height="10" rx="2" fill="#a78bfa"/>
<rect x="460" y="196" width="10" height="10" rx="2" fill="#a78bfa"/>
<text x="177" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₁</text>
<text x="273" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₂</text>
<text x="369" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₃</text>
<text x="465" y="224" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">cp₄</text>

<text x="556" y="202" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">4 份</text>
<text x="556" y="218" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">返回前补齐</text>

<!-- exit -->
<rect x="34" y="252" width="86" height="50" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="77" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">exit</text>
<text x="77" y="291" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">只在结束写</text>

<line x1="140" y1="277" x2="520" y2="277" stroke="#3a4a5e" stroke-width="1.4"/>
<circle cx="177" cy="277" r="4.5" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<circle cx="273" cy="277" r="4.5" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<circle cx="369" cy="277" r="4.5" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<rect x="460" y="272" width="10" height="10" rx="2" fill="#e8a34b"/>
<text x="177" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">无</text>
<text x="273" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">无</text>
<text x="369" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">无</text>
<text x="465" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">写 1 次</text>

<text x="556" y="278" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">1 份</text>
<text x="556" y="294" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">崩了丢整段</text>

<text x="34" y="344" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">崩溃落在第 2 与第 3 步之间：sync / async 丢 1 步，exit 全丢。</text>
<text x="34" y="364" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">同一张两节点图实测快照数：sync 4 / async 4 / exit 1。</text>
<text x="34" y="382" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">本机 langgraph 1.2.12 默认 async（源码核对）。三档都要求已经配了 checkpointer。</text>
</svg>
