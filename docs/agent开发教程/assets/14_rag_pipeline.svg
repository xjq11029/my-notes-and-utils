<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>RAG 检索链路：从文档到上下文</title>
<desc>离线阶段切分与嵌入；在线阶段检索、拼进提示词、由模型生成答案。检索只是「给模型喂料」的一种手段。</desc>
<defs>
<marker id="ar9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">RAG 检索链路：离线建库，在线取用</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">本质是「把可能相关的资料，在提问时塞进上下文」——所以它也是上下文工程的一部分</text>

<!-- 离线阶段 -->
<rect x="34" y="82" width="612" height="112" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#93a1b1">离线阶段（只跑一次 / 定期跑）</text>

<rect x="50" y="116" width="118" height="60" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="109" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">① 切分</text>
<text x="109" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">长文档 → 片段</text>

<rect x="190" y="116" width="118" height="60" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="249" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">② 嵌入</text>
<text x="249" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">文本 → 向量</text>

<rect x="330" y="116" width="118" height="60" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="389" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">③ 入库</text>
<text x="389" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">向量库 + 原文</text>

<rect x="470" y="116" width="160" height="60" rx="7" fill="#142b28" stroke="#3fd0b0" stroke-width="1.1"/>
<text x="550" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7fe3cd">可复用资产</text>
<text x="550" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">和 agent 解耦，可单独迭代</text>

<path d="M168 146L188 146" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar9)"/>
<path d="M308 146L328 146" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar9)"/>
<path d="M448 146L468 146" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar9)"/>

<!-- 在线阶段 -->
<rect x="34" y="208" width="612" height="112" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="230" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#93a1b1">在线阶段（每次提问都跑）</text>

<rect x="50" y="242" width="118" height="60" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="109" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">④ 检索</text>
<text x="109" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">问题 → 相似片段</text>

<rect x="190" y="242" width="118" height="60" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="249" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">⑤ 拼提示词</text>
<text x="249" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">片段进上下文</text>

<rect x="330" y="242" width="118" height="60" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.1"/>
<text x="389" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c9b8ff">⑥ 生成</text>
<text x="389" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">模型据片段作答</text>

<rect x="470" y="242" width="160" height="60" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="550" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ff9d99">风险点</text>
<text x="550" y="284" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">检索错了，后面全错</text>

<path d="M168 272L188 272" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar9)"/>
<path d="M308 272L328 272" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar9)"/>
<path d="M448 272L468 272" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar9)"/>

<!-- 结论 -->
<rect x="34" y="336" width="612" height="52" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="50" y="356" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">在 agent 语境下，检索有两种用法</text>
<text x="50" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">① 预检索：先把片段拼进系统提示（简单，但每次都查、且可能不相关）</text>
<text x="50" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">② 做成工具：让模型自己决定查不查、查什么（推荐——检索也是「能力」，不是「前置步骤」）</text>
</svg>
