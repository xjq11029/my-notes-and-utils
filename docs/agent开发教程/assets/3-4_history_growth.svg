<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img">
<title>多轮历史怎么生长，又怎么裁剪</title>
<desc>第一轮两条，第二轮四条，第三轮六条，每轮都要把 AI 回复存回同一个列表。裁剪时保留 system 加最近两轮，7 条变 5 条，加新问题后模型收到 6 条。按条数硬切可能切断一次工具往返。</desc>
<defs>
<marker id="ar34" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#93a1b1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="430" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">历史只增不减：2 条 → 4 条 → 6 条</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">每轮只做两件事：把上一轮全部带上，把 AI 的回复存回列表</text>

<!-- 第 1 轮 -->
<rect x="24" y="82" width="190" height="176" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="38" y="102" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">第 1 轮　2 条</text>
<rect x="38" y="112" width="162" height="18" rx="4" fill="#111721" stroke="#6b7a8d" stroke-width="0.8"/>
<text x="48" y="125" font-family="ui-monospace, monospace" font-size="9" fill="#93a1b1">system</text>
<rect x="38" y="134" width="162" height="18" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.8"/>
<text x="48" y="147" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">user</text>

<!-- 第 2 轮 -->
<rect x="240" y="82" width="190" height="176" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="254" y="102" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">第 2 轮　4 条</text>
<rect x="254" y="112" width="162" height="18" rx="4" fill="#111721" stroke="#6b7a8d" stroke-width="0.8"/>
<text x="264" y="125" font-family="ui-monospace, monospace" font-size="9" fill="#93a1b1">system</text>
<rect x="254" y="134" width="162" height="18" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.8"/>
<text x="264" y="147" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">user</text>
<rect x="254" y="156" width="162" height="18" rx="4" fill="#111721" stroke="#e8a34b" stroke-width="0.8"/>
<text x="264" y="169" font-family="ui-monospace, monospace" font-size="9" fill="#f3c47a">AI　← 回复存回</text>
<rect x="254" y="178" width="162" height="18" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.8"/>
<text x="264" y="191" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">user</text>

<!-- 第 3 轮 -->
<rect x="456" y="82" width="190" height="176" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="470" y="102" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">第 3 轮　6 条</text>
<rect x="470" y="112" width="162" height="18" rx="4" fill="#111721" stroke="#6b7a8d" stroke-width="0.8"/>
<text x="480" y="125" font-family="ui-monospace, monospace" font-size="9" fill="#93a1b1">system</text>
<rect x="470" y="134" width="162" height="18" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.8"/>
<text x="480" y="147" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">user</text>
<rect x="470" y="156" width="162" height="18" rx="4" fill="#111721" stroke="#e8a34b" stroke-width="0.8"/>
<text x="480" y="169" font-family="ui-monospace, monospace" font-size="9" fill="#f3c47a">AI</text>
<rect x="470" y="178" width="162" height="18" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.8"/>
<text x="480" y="191" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">user</text>
<rect x="470" y="200" width="162" height="18" rx="4" fill="#111721" stroke="#e8a34b" stroke-width="0.8"/>
<text x="480" y="213" font-family="ui-monospace, monospace" font-size="9" fill="#f3c47a">AI</text>
<rect x="470" y="222" width="162" height="18" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.8"/>
<text x="480" y="235" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">user</text>

<!-- 轮次箭头 -->
<path d="M216 170L237 170" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar34)"/>
<path d="M432 170L453 170" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar34)"/>

<text x="24" y="282" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">琥珀色是 AI 的回复，必须存回列表；不存，下一轮它就不记得自己说过什么。</text>

<line x1="24" y1="296" x2="656" y2="296" stroke="#3a4a5e" stroke-width="1"/>

<!-- 裁剪链 -->
<rect x="24" y="308" width="150" height="52" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="38" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">原始历史</text>
<text x="38" y="346" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">7 条</text>

<path d="M176 334L190 334" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar34)"/>

<rect x="192" y="308" width="292" height="52" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="206" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#f3c47a">保留 system + 最近 2 轮</text>
<text x="206" y="346" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">5 条（system 是角色设定，不能丢）</text>

<path d="M486 334L500 334" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar34)"/>

<rect x="502" y="308" width="154" height="52" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="516" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">模型收到</text>
<text x="516" y="346" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">5 条 + 新问题 = 6 条</text>

<!-- 红标 -->
<rect x="24" y="372" width="632" height="44" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="40" y="391" font-family="system-ui, sans-serif" font-size="10" fill="#ff9d99">× 按条数硬切，可能切掉 AIMessage(tool_calls) 却留下它的 ToolMessage</text>
<text x="40" y="407" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">模型会收到一条「找不到对应调用」的工具结果。按「轮」切，不按「条」切。</text>
</svg>
