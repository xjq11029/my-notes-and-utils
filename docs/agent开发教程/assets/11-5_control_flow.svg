<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img">
<title>控制流原语：顺序、扇出、静态扇入与循环</title>
<desc>add_sequence 补中间的顺序边；同一起点多条边形成并行扇出；add_edge 传列表是静态扇入，等所有起点完成；条件边绕回自己构成循环，必须显式设 recursion_limit。</desc>
<defs>
<marker id="ar115" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4dabf7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar115a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#e8a34b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="460" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">控制流原语：四种固定形状，四个写法</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">先看形状，再决定用哪一行代码</text>

<!-- ① 顺序 -->
<rect x="34" y="80" width="300" height="160" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="48" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">顺序：add_sequence([a, b, c])</text>

<rect x="54" y="122" width="56" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="82" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">a</text>
<rect x="142" y="122" width="56" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="170" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">b</text>
<rect x="230" y="122" width="56" height="28" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="258" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">c</text>

<path d="M110 136L138 136" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar115)"/>
<path d="M198 136L226 136" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar115)"/>

<text x="48" y="180" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">只补中间的顺序边，省掉两条 add_edge</text>
<text x="48" y="198" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">START → 首节点、末节点 → END 仍要自己接</text>
<text x="48" y="220" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">节点顺序固定时最省事</text>

<!-- ② 扇出 -->
<rect x="346" y="80" width="300" height="160" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="360" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">扇出：同一起点多条边</text>

<rect x="360" y="140" width="56" height="28" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="388" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">START</text>
<rect x="466" y="118" width="60" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="496" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">a</text>
<rect x="466" y="164" width="60" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="496" y="181" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">b</text>

<path d="M416 152L462 133" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar115)"/>
<path d="M416 156L462 175" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar115)"/>

<text x="360" y="208" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">按数据长度动态派发 → 用 Send</text>
<text x="360" y="226" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">两支同属一个超步，同时执行</text>

<!-- ③ 静态扇入 -->
<rect x="34" y="254" width="300" height="160" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="48" y="278" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">静态扇入：add_edge([a, b], "join")</text>

<rect x="54" y="290" width="58" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="83" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">left</text>
<rect x="54" y="326" width="58" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="83" y="343" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">right</text>
<rect x="200" y="300" width="64" height="28" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="232" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f3c47a">join</text>

<path d="M112 303L160 303L196 312" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar115)"/>
<path d="M112 339L160 339L196 320" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar115)"/>

<text x="48" y="378" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">等 left、right 都完成才跑 join</text>
<text x="48" y="396" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">起点编译期写死，和 Send 的动态派发不同</text>

<!-- ④ 循环 -->
<rect x="346" y="254" width="300" height="160" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="360" y="278" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">循环：条件边绕回自己</text>

<rect x="380" y="296" width="76" height="30" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="418" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">inc</text>

<path d="M456 306H482Q494 306 494 318V348Q494 360 482 360H402Q390 360 390 348V332" fill="none" stroke="#e8a34b" stroke-width="1.4" marker-end="url(#ar115a)"/>
<text x="508" y="330" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">还不到 3 → 再走</text>
<text x="508" y="348" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">条件边一次只走一条</text>

<text x="360" y="384" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">必须显式设 recursion_limit</text>
<text x="360" y="402" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">超限抛 GraphRecursionError（本机默认 10007）</text>

<!-- 底注 -->
<rect x="34" y="428" width="612" height="26" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="340" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">图里没有「重试」原语：循环是业务写法，重试是节点级策略（下一节）</text>
</svg>
