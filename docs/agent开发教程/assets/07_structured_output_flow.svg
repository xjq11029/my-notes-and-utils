<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img">
<title>with_structured_output 的两种策略</title>
<desc>schema 声明之后分两条路：工具策略把 schema 包成工具、取模型回传的 tool_call 参数；原生策略把 schema 交给 response_format、解析模型吐出的 JSON 文本。两条路都汇到校验一步。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="460" fill="#111721"/>

<text x="34" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">with_structured_output 的两种策略</text>
<text x="34" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">同一步「拿到结构化结果」，两条路走到校验才汇合</text>

<!-- schema -->
<rect x="250" y="88" width="180" height="40" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.4"/>
<text x="268" y="113" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c9b8ff">schema 声明</text>

<path d="M290 128L290 142L160 142L160 158" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M390 128L390 142L520 142L520 158" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- 左支 -->
<text x="60" y="150" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">工具策略 function_calling</text>
<rect x="60" y="160" width="220" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="72" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">schema 包成工具（bind_tools）</text>
<rect x="60" y="206" width="220" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="72" y="228" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">模型回一条 tool_call</text>
<rect x="60" y="252" width="220" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="72" y="274" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">取 tool_call.args</text>
<path d="M170 194L170 202" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M170 240L170 248" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- 右支 -->
<text x="400" y="150" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e8a34b">原生策略 json_schema</text>
<rect x="400" y="160" width="220" height="34" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="412" y="182" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">schema 进 response_format</text>
<rect x="400" y="206" width="220" height="34" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="412" y="228" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">模型吐 JSON 文本</text>
<rect x="400" y="252" width="220" height="34" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="412" y="274" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">解析 content</text>
<path d="M510 194L510 202" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M510 240L510 248" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- 汇合 -->
<path d="M170 286L170 310L320 310L320 324" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M510 286L510 310L360 310L360 324" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<rect x="250" y="328" width="180" height="40" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.4"/>
<text x="268" y="353" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f0655f">校验</text>

<path d="M340 368L340 388" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<rect x="250" y="392" width="180" height="40" rx="8" fill="#142b28" stroke="#3fd0b0" stroke-width="1.4"/>
<text x="268" y="417" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fe3cd">Pydantic 实例</text>

<text x="34" y="430" font-family="system-ui, sans-serif" font-size="10.5" fill="#f0655f">只有 Pydantic 模式在 Python 侧校验并抛 ValidationError</text>
<text x="34" y="448" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b7a8d">JS 基类只走工具策略且不校验；TypedDict / JSON Schema / dataclass 一律返回 dict</text>
</svg>
