<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img">
<title>Reducer 的合并语义与同一线程再次 invoke 的行为</title>
<desc>默认 reducer 是覆盖，Annotated 可指定合并。输入字典里出现的字段按各自 reducer 合并，没出现的保留检查点值。</desc>
<defs>
<marker id="ar13" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="440" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">Reducer：同一个 State 里，不同字段规则可以完全不同</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">公式：new_value = reducer(left=当前状态值, right=节点返回的更新)</text>

<!-- 默认 reducer -->
<rect x="34" y="82" width="300" height="96" rx="9" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff9d99">默认 reducer = 覆盖</text>
<text x="50" y="124" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">counter: int　（没写 Annotated）</text>
<text x="50" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">节点 A 返回 1，节点 B 返回 2</text>
<text x="50" y="162" font-family="system-ui, sans-serif" font-size="10" fill="#ff9d99">结果：counter = 2（A 的值被冲掉了）</text>

<!-- 合并 reducer -->
<rect x="346" y="82" width="300" height="96" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.3"/>
<text x="362" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fe3cd">Annotated 指定合并</text>
<text x="362" y="124" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">log: Annotated[list, operator.add]</text>
<text x="362" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">节点 A 返回 ["a"]，节点 B 返回 ["b"]</text>
<text x="362" y="162" font-family="system-ui, sans-serif" font-size="10" fill="#7fe3cd">结果：log = ["a", "b"]（两份都在）</text>

<!-- 同一线程再次 invoke -->
<text x="34" y="204" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#dfe6ee">同一线程再次 invoke 时，输入值也走同一套 reducer（实测）</text>

<rect x="34" y="216" width="612" height="24" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="46" y="232" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">场景</text>
<text x="250" y="232" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">n（默认覆盖）</text>
<text x="440" y="232" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">trail（Annotated 追加）</text>
<text x="600" y="232" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">说明</text>

<rect x="34" y="242" width="612" height="22" rx="4" fill="#111721" stroke="#3a4a5e" stroke-width="0.5"/>
<text x="46" y="257" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">第 1 次　{n:0, trail:["起点"]}</text>
<text x="250" y="257" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">1</text>
<text x="440" y="257" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">["起点","→1"]</text>
<text x="600" y="257" font-family="system-ui, sans-serif" font-size="9" fill="#6b7a8d">首次</text>

<rect x="34" y="266" width="612" height="22" rx="4" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.5"/>
<text x="46" y="281" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">第 2 次　null</text>
<text x="250" y="281" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff9d99">1（没变）</text>
<text x="440" y="281" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff9d99">没变</text>
<text x="600" y="281" font-family="system-ui, sans-serif" font-size="9" fill="#f0655f">空操作</text>

<rect x="34" y="290" width="612" height="22" rx="4" fill="#111721" stroke="#3a4a5e" stroke-width="0.5"/>
<text x="46" y="305" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">第 3 次　{}</text>
<text x="250" y="305" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">2</text>
<text x="440" y="305" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">+["→2"]</text>
<text x="600" y="305" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">从检查点续跑</text>

<rect x="34" y="314" width="612" height="22" rx="4" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.5"/>
<text x="46" y="329" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">第 4 次　{n:100}</text>
<text x="250" y="329" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">101</text>
<text x="440" y="329" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">+["→101"]</text>
<text x="600" y="329" font-family="system-ui, sans-serif" font-size="9" fill="#e8a34b">输入覆盖 n</text>

<rect x="34" y="338" width="612" height="22" rx="4" fill="#111721" stroke="#3a4a5e" stroke-width="0.5"/>
<text x="46" y="353" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">第 5 次　{trail:["插一条"]}</text>
<text x="250" y="353" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">102</text>
<text x="440" y="353" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">+["插一条","→102"]</text>
<text x="600" y="353" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">n 沿用检查点</text>

<!-- 结论 -->
<rect x="34" y="370" width="612" height="58" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="50" y="390" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f3c47a">三条实测结论（Python 与 JS 一致）</text>
<text x="50" y="406" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">① 输入里出现的字段 → 按该字段的 reducer 合并　　② 输入里没出现的字段 → 保留检查点里的值</text>
<text x="50" y="421" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">③ invoke(null) 是空操作；invoke({}) 才是「从检查点续跑」——这两个容易搞混</text>
</svg>
