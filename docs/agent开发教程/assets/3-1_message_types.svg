<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>四种消息类型与角色到载荷的绑定</title>
<desc>SystemMessage 只有 content 定规则，HumanMessage 带 content 与 name，AIMessage 带 content 与 tool_calls，ToolMessage 带 content、tool_call_id 与 name。AIMessage.tool_calls[].id 必须等于 ToolMessage.tool_call_id，对不上框架就配不回这次调用，直接报错。</desc>
<defs>
<marker id="ar31" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#f0655f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">四种消息类型：角色锁住自己的载荷</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">不是一个大而全的通用对象——每种类型只带自己那组字段</text>

<!-- SystemMessage -->
<rect x="24" y="96" width="150" height="140" rx="9" fill="#1b2532" stroke="#6b7a8d" stroke-width="1.3"/>
<text x="38" y="119" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c3cfdd">SystemMessage</text>
<line x1="38" y1="127" x2="160" y2="127" stroke="#3a4a5e" stroke-width="1"/>
<text x="38" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">开发者写的</text>
<text x="38" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">content</text>
<text x="38" y="205" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">只有它，定规则</text>
<text x="38" y="221" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">角色 / 边界 / 语气</text>

<!-- HumanMessage -->
<rect x="182" y="96" width="150" height="140" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="196" y="119" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">HumanMessage</text>
<line x1="196" y1="127" x2="318" y2="127" stroke="#3a4a5e" stroke-width="1"/>
<text x="196" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">用户 / 你写的</text>
<text x="196" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">content</text>
<text x="196" y="194" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">name</text>
<text x="196" y="221" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">透传看供应商</text>

<!-- AIMessage -->
<rect x="340" y="96" width="150" height="140" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="354" y="119" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">AIMessage</text>
<line x1="354" y1="127" x2="476" y2="127" stroke="#3a4a5e" stroke-width="1"/>
<text x="354" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">模型写的</text>
<text x="354" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">content</text>
<text x="354" y="194" font-family="system-ui, sans-serif" font-size="10" fill="#f0b45f">tool_calls</text>
<text x="354" y="221" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">id 在这一项里</text>

<!-- ToolMessage -->
<rect x="498" y="96" width="150" height="140" rx="9" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="512" y="119" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">ToolMessage</text>
<line x1="512" y1="127" x2="634" y2="127" stroke="#3a4a5e" stroke-width="1"/>
<text x="512" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">框架的工具节点写</text>
<text x="512" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">content</text>
<text x="512" y="194" font-family="system-ui, sans-serif" font-size="10" fill="#c9b8ff">tool_call_id</text>
<text x="512" y="214" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">name</text>

<!-- 配对线：AI 卡底 -> 红字 -> Tool 卡底 -->
<path d="M415 238L415 264L573 264L573 238" fill="none" stroke="#f0655f" stroke-width="2" marker-start="url(#ar31)" marker-end="url(#ar31)"/>

<rect x="322" y="274" width="330" height="44" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="487" y="293" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff9d99">tool_calls[].id　↔　tool_call_id</text>
<text x="487" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">对不上就报错：框架认不出这是哪次调用的结果</text>

<line x1="24" y1="334" x2="656" y2="334" stroke="#3a4a5e" stroke-width="1"/>
<text x="24" y="356" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">一条消息列表 = 一次请求的全部输入。顺序即语义：system 最前，工具结果紧跟对应的 AI 请求。</text>
<text x="24" y="378" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">谁写的决定你能不能改：ToolMessage 由框架写入，不是你拼的。</text>
</svg>
