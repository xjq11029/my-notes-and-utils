<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
<title>thread_id 与 context 两类作用域</title>
<desc>thread_id 决定对话历史与检查点归属，会被持久化；context 是单次运行的随身数据，不写进检查点。</desc>
<defs>
<marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="380" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">两类作用域：thread_id 与 context</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">同一个 invoke 里两个参数，命运完全不同——这是最容易搞混的一处</text>

<!-- 左：thread_id -->
<rect x="34" y="84" width="290" height="252" rx="10" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
<text x="54" y="112" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#8ecbff">thread_id　对话作用域</text>
<text x="54" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">「这段历史属于哪次对话」</text>

<rect x="54" y="150" width="250" height="70" rx="7" fill="#142b28" stroke="#3fd0b0" stroke-width="1.1"/>
<text x="68" y="170" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7fe3cd">会写进检查点（持久化）</text>
<text x="68" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">消息历史、状态字段、检查点链</text>
<text x="68" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">换一个 id = 换一个全新线程（白纸）</text>

<text x="54" y="242" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9c">典型用途</text>
<text x="54" y="260" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">· 多轮对话延续</text>
<text x="54" y="277" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">· 人在回路（中断后要按同一 id 恢复）</text>
<text x="54" y="294" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">· 时间旅行与故障恢复</text>
<text x="54" y="318" font-family="system-ui, sans-serif" font-size="10.5" fill="#8ecbff">config = {"configurable": {"thread_id": "..."}}</text>

<!-- 右：context -->
<rect x="356" y="84" width="290" height="252" rx="10" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
<text x="376" y="112" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#f3c47a">context　单次运行作用域</text>
<text x="376" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">「这一次运行」的随身数据</text>

<rect x="376" y="150" width="250" height="70" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="390" y="170" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ff9d99">不写进检查点（不持久化）</text>
<text x="390" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">也不进消息历史，模型看不到</text>
<text x="390" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">只在工具 / 中间件里读得到</text>

<text x="376" y="242" font-family="system-ui, sans-serif" font-size="10.5" fill="#7d8b9c">典型用途</text>
<text x="376" y="260" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">· user_id / tenant_id 这类身份</text>
<text x="376" y="277" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">· feature flag、模型档位开关</text>
<text x="376" y="294" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">· 每次请求都不同的配置</text>
<text x="376" y="318" font-family="system-ui, sans-serif" font-size="10.5" fill="#f3c47a">context={"user_id": "u-42"}</text>

<!-- 底部 -->
<rect x="34" y="348" width="612" height="22" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="340" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">判断口径：需要「下次还记得」的 → thread_id；只服务「这一次」的 → context</text>
</svg>
