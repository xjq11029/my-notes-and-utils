<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" width="680" height="448" role="img">
<title>MessagesPlaceholder 留槽，partial 派生模板变体</title>
<desc>上半部分：MessagesPlaceholder 在模板里留一个 history 槽，三条历史消息整段插入，不拼成文本。下半部分：partial 把 role 与 audience 两个变量钉死，返回新模板变体，变量只剩 history 与 task，同一套模板由此派生出客服版和销售版。</desc>
<defs>
<marker id="ar37" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#93a1b1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="448" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">一个留槽，一个钉值</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">MessagesPlaceholder 插整段历史；partial 把固定变量提前钉死</text>

<!-- ① -->
<text x="24" y="92" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#f3c47a">① MessagesPlaceholder：模板里留一个槽</text>

<rect x="24" y="104" width="240" height="112" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="36" y="126" font-family="ui-monospace, monospace" font-size="8" fill="#93a1b1">("system", "你是一个{role}，…")</text>
<rect x="36" y="136" width="216" height="30" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="44" y="155" font-family="ui-monospace, monospace" font-size="8.5" fill="#f3c47a">MessagesPlaceholder("history")</text>
<text x="36" y="192" font-family="ui-monospace, monospace" font-size="8" fill="#93a1b1">("human", "{task}")</text>
<text x="36" y="208" font-family="system-ui, sans-serif" font-size="8.5" fill="#7d8b9c">虚线框就是那个槽</text>

<!-- 历史消息 -->
<rect x="440" y="110" width="216" height="22" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.9"/>
<text x="450" y="125" font-family="system-ui, sans-serif" font-size="8.5" fill="#8ecbff">HumanMessage　我买的东西坏了</text>
<rect x="440" y="136" width="216" height="22" rx="4" fill="#111721" stroke="#e8a34b" stroke-width="0.9"/>
<text x="450" y="151" font-family="system-ui, sans-serif" font-size="8.5" fill="#f3c47a">AIMessage　很抱歉，我帮您处理。</text>
<rect x="440" y="162" width="216" height="22" rx="4" fill="#111721" stroke="#4dabf7" stroke-width="0.9"/>
<text x="450" y="177" font-family="system-ui, sans-serif" font-size="8.5" fill="#8ecbff">HumanMessage　解释退款政策</text>

<path d="M436 153L258 153" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar37)"/>
<text x="336" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">整段插入</text>

<text x="24" y="238" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">进去的是三条消息，出来还是三条消息：角色、顺序、条数都不变，不会被拼成一段文本。</text>

<!-- ② -->
<text x="24" y="270" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c9b8ff">② partial()：把固定变量钉死</text>

<rect x="24" y="284" width="180" height="86" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="38" y="306" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">原模板</text>
<text x="38" y="324" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">4 个变量</text>
<text x="38" y="342" font-family="ui-monospace, monospace" font-size="8.5" fill="#93a1b1">role · audience</text>
<text x="38" y="360" font-family="ui-monospace, monospace" font-size="8.5" fill="#93a1b1">history · task</text>

<path d="M206 327L232 327" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar37)"/>

<rect x="236" y="284" width="168" height="86" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="250" y="306" font-family="ui-monospace, monospace" font-size="9" fill="#f3c47a">partial(</text>
<text x="250" y="323" font-family="ui-monospace, monospace" font-size="9" fill="#f3c47a">  role=…,</text>
<text x="250" y="340" font-family="ui-monospace, monospace" font-size="9" fill="#f3c47a">  audience=…)</text>
<text x="250" y="360" font-family="system-ui, sans-serif" font-size="8.5" fill="#93a1b1">返回新变体</text>

<path d="M406 327L424 327L424 308L444 308" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar37)"/>
<path d="M406 327L424 327L424 376L444 376" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar37)"/>

<rect x="448" y="278" width="208" height="60" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="462" y="297" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">客服版</text>
<text x="462" y="315" font-family="ui-monospace, monospace" font-size="8.5" fill="#dfe6ee">role=客服专员</text>
<text x="462" y="331" font-family="ui-monospace, monospace" font-size="8.5" fill="#93a1b1">audience=普通用户</text>

<rect x="448" y="346" width="208" height="60" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="462" y="365" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c9b8ff">销售版</text>
<text x="462" y="383" font-family="ui-monospace, monospace" font-size="8.5" fill="#dfe6ee">role=销售经理</text>
<text x="462" y="399" font-family="ui-monospace, monospace" font-size="8.5" fill="#93a1b1">audience=潜在客户</text>

<line x1="24" y1="414" x2="656" y2="414" stroke="#3a4a5e" stroke-width="1"/>
<text x="24" y="436" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">原模板没被改：两个变体的变量表都只剩 history / task，换一组值就是一个新版本。</text>
</svg>
