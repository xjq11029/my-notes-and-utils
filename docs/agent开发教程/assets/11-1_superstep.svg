<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img">
<title>图的执行模型：超步推进与轮末归并</title>
<desc>图按超级步推进：每一轮里所有就绪节点同时执行，轮末由 reducer 把各自的更新包并入共享状态，再进入下一轮。</desc>
<defs>
<marker id="ar111" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar111p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="410" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">图怎么跑：一轮一个超步，轮末统一结算</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">节点改不动状态——它只返回一份更新包，由 reducer 在轮末并入</text>

<!-- 超步列 1 -->
<rect x="34" y="80" width="190" height="24" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="46" y="96" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">超步 1　执行 a</text>

<rect x="54" y="112" width="150" height="44" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="129" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">节点 a</text>
<text x="129" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">读 state，返回更新</text>

<path d="M129 156L129 180" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar111)"/>

<rect x="54" y="182" width="150" height="42" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="129" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">reducer 合并</text>
<text x="129" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">按字段各自规则</text>

<!-- 超步列 2 -->
<rect x="240" y="80" width="190" height="24" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="252" y="96" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">超步 2　执行 b</text>

<rect x="260" y="112" width="150" height="44" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="335" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">节点 b</text>
<text x="335" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">读 state，返回更新</text>

<path d="M335 156L335 180" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar111)"/>

<rect x="260" y="182" width="150" height="42" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="335" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">reducer 合并</text>
<text x="335" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">按字段各自规则</text>

<!-- 超步列 3 -->
<rect x="446" y="80" width="190" height="24" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="458" y="96" font-family="system-ui, sans-serif" font-size="10.5" fill="#93a1b1">超步 3　无节点就绪</text>

<rect x="466" y="112" width="150" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="541" y="131" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#dfe6ee">END</text>
<text x="541" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">没有待跑的节点</text>

<rect x="466" y="182" width="150" height="42" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="541" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#dfe6ee">运行结束</text>
<text x="541" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">返回完整 state</text>

<!-- 合并入状态 -->
<path d="M129 224L129 254" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#ar111p)"/>
<path d="M335 224L335 254" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#ar111p)"/>

<rect x="34" y="258" width="612" height="82" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
<text x="50" y="280" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">State　共享数据</text>
<text x="630" y="280" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">只有 reducer 能写进来</text>

<rect x="50" y="294" width="180" height="30" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="140" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">counter: int → 覆盖</text>

<rect x="244" y="294" width="204" height="30" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="346" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">log: Annotated[list, add] → 追加</text>

<rect x="462" y="294" width="170" height="30" rx="5" fill="#111721" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="547" y="313" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">messages: add_messages</text>

<!-- 底注 -->
<rect x="34" y="352" width="612" height="52" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="50" y="372" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">一个超步 = 一轮：本轮所有就绪节点同时跑，轮末统一结算，再进下一轮</text>
<text x="50" y="390" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">两件事靠它才讲得通：Send 的并行分支同属一个超步；检查点逐超步落盘（第 12 章）</text>
</svg>
