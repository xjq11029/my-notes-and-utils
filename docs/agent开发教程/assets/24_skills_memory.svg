<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>技能渐进式披露与记忆的时间尺度</title>
<desc>技能只在需要时读正文，记忆每次会话都全量加载；两者时间尺度与写入方都不同。</desc>
<defs>
<marker id="ar24" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">技能与记忆：一个按需加载，一个每次全量</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">两者都靠文件承载，但时间尺度完全相反——这决定了内容该放哪边</text>

<!-- Skills -->
<rect x="34" y="82" width="612" height="152" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">Skills　渐进式披露：目录常驻，正文按需</text>

<rect x="50" y="118" width="180" height="60" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="140" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">会话开始</text>
<text x="140" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">系统提示里只有</text>
<text x="140" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#8ecbff">name + description</text>

<path d="M234 148L276 148" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar24)"/>
<text x="255" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#93a1b1">匹配上</text>

<rect x="282" y="118" width="180" height="60" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="372" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">模型调 read_file</text>
<text x="372" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">去读 SKILL.md 正文</text>
<text x="372" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f3c47a">提示里还给了 limit=1000</text>

<path d="M466 148L508 148" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar24)"/>

<rect x="514" y="118" width="114" height="60" rx="7" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="571" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7fe3cd">按步骤执行</text>
<text x="571" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">不读的技能</text>
<text x="571" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">一个字都不花</text>

<text x="50" y="204" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">省 token 的原理：技能再多，会话开始也只付出「每个技能两行」的代价</text>
<text x="50" y="222" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">代价：模型得「想起来去读」——所以 description 要写清「什么时候该用我」</text>

<!-- Memory -->
<rect x="34" y="248" width="612" height="122" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.3"/>
<text x="50" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fe3cd">Memory　每次会话全量加载</text>

<rect x="50" y="284" width="150" height="46" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="125" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">AGENTS.md</text>
<text x="125" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">跨会话持久</text>

<path d="M204 307L246 307" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar24)"/>

<rect x="252" y="284" width="180" height="46" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="342" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">每次会话开始注入</text>
<text x="342" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f0655f">所以膨胀 = 每轮都多付 token</text>

<path d="M436 307L478 307" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar24)"/>

<rect x="484" y="284" width="144" height="46" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="556" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#f3c47a">信任与验证条款</text>
<text x="556" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#93a1b1">记忆是文件数据，不是系统指令</text>

<text x="50" y="352" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff9d99">安全要点：记忆文件是用户可写的 → 天然是一条提示注入通道；默认提示里已明确「不当隐藏指令执行」</text>

<!-- 对比 -->
<rect x="34" y="382" width="612" height="30" rx="7" fill="#1b2320" stroke="#3a4a5e" stroke-width="1"/>
<text x="340" y="401" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">判断口径：稳定的「怎么做」→ Skills；会变的「关于谁 / 什么」→ Memory；两者都别写成大段长文</text>
</svg>
