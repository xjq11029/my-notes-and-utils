<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>StateGraph 的基本构件</title>
<desc>State 是共享数据结构，Node 是函数，Edge 是流转规则；START 与 END 是特殊节点。编译后才能运行。</desc>
<defs>
<marker id="ar12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">StateGraph 的四个基本构件</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">图 = State（共享数据） + Node（函数） + Edge（流转规则） + 编译</text>

<!-- State 面板 -->
<rect x="34" y="84" width="612" height="88" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.4"/>
<text x="50" y="106" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fe3cd">State　共享数据结构</text>
<text x="50" y="126" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">每个 key 独立拥有一个 reducer，决定「节点返回的更新如何合并进来」</text>
<rect x="50" y="136" width="180" height="26" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="140" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">schema：TypedDict / dataclass / Pydantic</text>
<rect x="244" y="136" width="180" height="26" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="334" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">reducer：Annotated[type, fn]</text>
<rect x="438" y="136" width="192" height="26" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="0.8"/>
<text x="534" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">内置：add_messages（消息专用）</text>

<!-- 流程图 -->
<rect x="34" y="196" width="612" height="120" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="218" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">Node 与 Edge　函数与流转规则</text>

<circle cx="96" cy="272" r="18" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="96" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c9b8ff">START</text>

<rect x="164" y="250" width="110" height="44" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="219" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">节点 A</text>
<text x="219" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">读 state → 返回更新</text>

<rect x="330" y="250" width="110" height="44" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="385" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">节点 B</text>
<text x="385" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">异步也可以</text>

<circle cx="512" cy="272" r="18" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="512" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#c9b8ff">END</text>

<path d="M114 272L162 272" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar12)"/>
<path d="M274 272L328 272" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar12)"/>
<path d="M440 272L492 272" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar12)"/>

<text x="302" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">普通边</text>
<text x="468" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">普通边</text>

<rect x="552" y="248" width="78" height="48" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="591" y="267" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#f3c47a">条件边</text>
<text x="591" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#93a1b1">路由函数决定</text>

<!-- 编译 -->
<rect x="34" y="328" width="612" height="76" rx="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="50" y="350" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3c47a">编译　compile()</text>
<text x="50" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">构造图只是「画图纸」，必须 compile() 之后才能运行；结构错误在这一步就会被发现</text>
<text x="50" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">checkpointer / store / interrupt 等运行时参数，也都在这一步传入</text>
</svg>
