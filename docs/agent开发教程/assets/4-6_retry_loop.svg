<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img">
<title>工具策略的一次成功与一次失败：校验错误写回后重试</title>
<desc>时序图。模型先回一条 tool_calls，参数 age='三十'；框架校验失败，把 Error: Failed to parse structured output 写成 ToolMessage 交回模型；模型再回一条合法 tool_calls；框架返回 Returning structured response，循环结束。全程模型被调用两次。handle_errors=False 时不再重试，直接抛 StructuredOutputValidationError。</desc>
<defs>
<marker id="ar44b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4dabf7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar44r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#f0655f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar44g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3fd0b0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="500" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">重试的真相：把错误原文写回对话</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">一次失败、一次成功，模型被调用两次——重试不是框架替模型改，是让模型自己改</text>

<rect x="86" y="86" width="126" height="34" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="149" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">模型</text>

<rect x="468" y="86" width="126" height="34" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="531" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">框架（工具策略）</text>

<line x1="149" y1="120" x2="149" y2="382" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="531" y1="120" x2="531" y2="382" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="3 4"/>

<path d="M149 152L525 152" fill="none" stroke="#4dabf7" stroke-width="1.6" marker-end="url(#ar44b)"/>
<text x="337" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">AIMessage  tool_calls=[Person, age='三十']</text>

<rect x="384" y="166" width="212" height="24" rx="5" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="490" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f0908b">校验失败：age 不是 int</text>

<path d="M531 210L155 210" fill="none" stroke="#f0655f" stroke-width="1.6" marker-end="url(#ar44r)"/>
<text x="337" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f0908b">ToolMessage  Error: Failed to parse structured output for tool 'Person...</text>

<path d="M149 272L525 272" fill="none" stroke="#4dabf7" stroke-width="1.6" marker-end="url(#ar44b)"/>
<text x="337" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">AIMessage  tool_calls=[Person, age=30, ...]</text>

<path d="M531 332L155 332" fill="none" stroke="#3fd0b0" stroke-width="1.6" marker-end="url(#ar44g)"/>
<text x="337" y="323" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">ToolMessage  Returning structured response: name='张三' age=30 ...</text>

<rect x="386" y="346" width="208" height="24" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="1.1"/>
<text x="490" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">解析成功，循环结束</text>

<rect x="24" y="394" width="632" height="34" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="40" y="415" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">result["structured_response"] = Person(name='张三', age=30, occupation='软件工程师')</text>

<rect x="24" y="440" width="304" height="44" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="40" y="459" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">模型被调用 2 次</text>
<text x="40" y="475" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">第 1 次参数非法，第 2 次自己改对</text>

<rect x="344" y="440" width="312" height="44" rx="6" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="360" y="459" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f0908b">handle_errors=False 时没有第二次</text>
<text x="360" y="475" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">直接抛 StructuredOutputValidationError</text>
</svg>
