<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img">
<title>Store 与 Checkpointer 的分层：线程内 vs 跨线程</title>
<desc>Checkpointer 按线程保存图状态，Store 保存跨线程的键值数据，两者协同工作。</desc>
<defs>
<marker id="ar17" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="410" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">两套持久化系统：一个管线程，一个跨线程</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">大多数应用两个都要用：checkpointer 管「这段对话」，store 管「这个人」</text>

<!-- 线程 -->
<rect x="34" y="82" width="612" height="130" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">Checkpointer　按线程（thread）保存图状态</text>

<rect x="50" y="116" width="180" height="82" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="140" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">thread A</text>
<text x="140" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">消息历史 + 状态字段</text>
<text x="140" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">检查点链（可回放）</text>
<text x="140" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7a8d">thread_id = "chat-1"</text>

<rect x="250" y="116" width="180" height="82" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="340" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">thread B</text>
<text x="340" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">另一段独立对话</text>
<text x="340" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">互相看不到对方的状态</text>
<text x="340" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7a8d">thread_id = "chat-2"</text>

<rect x="450" y="116" width="180" height="82" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1"/>
<text x="540" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ff9d99">线程隔离的代价</text>
<text x="540" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">A 里学到的东西</text>
<text x="540" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">B 完全不知道</text>
<text x="540" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6b7a8d">→ 需要 Store</text>

<!-- Store -->
<rect x="34" y="228" width="612" height="122" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.3"/>
<text x="50" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7fe3cd">Store　跨线程的键值数据</text>

<rect x="50" y="262" width="200" height="74" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="150" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">namespace ("alice", "memories")</text>
<text x="150" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">pref-food → 喜欢川菜</text>
<text x="150" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">pref-city → 住在杭州</text>
<text x="150" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#6b7a8d">namespace 任意层数，不限于用户维度</text>

<rect x="266" y="262" width="180" height="74" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="356" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dfe6ee">访问方式</text>
<text x="356" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">节点里：runtime.store</text>
<text x="356" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">put / get / search / delete</text>
<text x="356" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#6b7a8d">search 是前缀匹配，不是精确匹配</text>

<rect x="462" y="262" width="168" height="74" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="546" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f3c47a">语义检索（可选）</text>
<text x="546" y="301" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">配 embed + dims + fields</text>
<text x="546" y="318" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">search(query="…") 按相似度</text>
<text x="546" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" fill="#6b7a8d">要额外配嵌入模型与维度</text>

<!-- 底部 -->
<rect x="34" y="362" width="612" height="34" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="340" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">判断口径：需要「这次对话内记得」→ checkpointer；需要「换个人 / 换次会话还记得」→ store</text>
</svg>
