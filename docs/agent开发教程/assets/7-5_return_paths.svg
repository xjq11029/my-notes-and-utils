<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 414" width="680" height="414" role="img">
<title>工具返回值的四条去向</title>
<desc>字符串、对象、多模态内容块最终都变成一条 ToolMessage，不改图状态；Command 不会被转成 ToolMessage，会直接改状态，且必须自带 tool_call_id 匹配的 ToolMessage。</desc>
<defs>
<marker id="ar75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="414" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">返回值有四个归宿，只有一个改状态</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">前三条最后都落在一条 ToolMessage 上；第四条绕开了这个转换</text>

<rect x="270" y="84" width="140" height="42" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="340" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">工具 return</text>
<text x="340" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">函数体交出的东西</text>

<path d="M340 126L340 158" fill="none" stroke="#3a4a5e" stroke-width="1.4"/>
<path d="M104 158L572 158" fill="none" stroke="#3a4a5e" stroke-width="1.4"/>
<path d="M104 158L104 186" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar75)"/>
<path d="M260 158L260 186" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar75)"/>
<path d="M416 158L416 186" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar75)"/>
<path d="M572 158L572 186" fill="none" stroke="#3a4a5e" stroke-width="1.4" marker-end="url(#ar75)"/>

<rect x="34" y="190" width="140" height="92" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="48" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">字符串</text>
<text x="48" y="236" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">直接转成</text>
<text x="48" y="252" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">ToolMessage</text>
<text x="48" y="272" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">不改状态</text>

<rect x="190" y="190" width="140" height="92" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="204" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">对象（dict 等）</text>
<text x="204" y="236" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">序列化后放进</text>
<text x="204" y="252" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">ToolMessage</text>
<text x="204" y="272" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">不改状态</text>

<rect x="346" y="190" width="140" height="92" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="360" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c9b8ff">多模态块列表</text>
<text x="360" y="236" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">content 为多模态块</text>
<text x="360" y="252" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">的 ToolMessage</text>
<text x="360" y="272" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">需模型支持该模态</text>

<rect x="502" y="190" width="140" height="92" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="516" y="214" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">Command</text>
<text x="516" y="236" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">不转 ToolMessage</text>
<text x="516" y="252" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">走 update 合并</text>
<text x="516" y="272" font-family="system-ui, sans-serif" font-size="9" fill="#f3c47a">直接改图状态</text>

<rect x="34" y="302" width="608" height="86" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="50" y="324" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">只有 Command 会改状态，代价是一条硬约束</text>
<text x="50" y="345" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">必须自带一条 tool_call_id 匹配的 ToolMessage，否则 ToolNode 找不到对应关系，直接抛 ValueError。</text>
<text x="50" y="365" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">例外：Command 的 graph 指向父图时解除。return_direct 要「整批工具都设」才短路循环。</text>
</svg>
