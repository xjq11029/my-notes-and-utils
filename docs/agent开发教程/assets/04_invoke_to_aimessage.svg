<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>invoke 的三种入参到 AIMessage 结构</title>
<desc>字符串、字典列表、消息对象列表三种入参经归一化后都变成消息序列；模型返回的 AIMessage 分两组字段：模型说了什么，以及这次调用花了什么代价。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">三种入参 → 消息序列 → AIMessage</text>
<text x="34" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">模型侧只认消息对象；返回值里装的是「说了什么」与「花了什么」</text>

<!-- 左：三种入参 -->
<text x="34" y="100" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">你传进去的</text>
<rect x="34" y="112" width="140" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="46" y="134" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">"你好"</text>
<rect x="34" y="160" width="140" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="46" y="182" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">[{"role": ...}]</text>
<rect x="34" y="208" width="140" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="46" y="230" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">[HumanMessage(...)]</text>

<!-- 中：归一化漏斗 -->
<polygon points="206,112 334,112 300,240 240,240" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="248" y="182" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93a1b1">归一化</text>

<path d="M174 129L204 129" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M174 177L209 177" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M174 225L214 225" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<rect x="200" y="256" width="140" height="48" rx="6" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="212" y="276" font-family="system-ui, sans-serif" font-size="11" fill="#c9b8ff">[SystemMessage,</text>
<text x="212" y="293" font-family="system-ui, sans-serif" font-size="11" fill="#c9b8ff"> HumanMessage]</text>

<path d="M270 240L270 252" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>
<path d="M340 280L366 280" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<text x="200" y="326" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b7a8d">模型侧只认消息对象</text>

<!-- 右：AIMessage -->
<rect x="370" y="96" width="276" height="294" rx="10" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.4"/>
<text x="388" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dfe6ee">AIMessage</text>

<text x="388" y="150" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">组 1　模型说了什么</text>
<rect x="388" y="160" width="240" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="400" y="178" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">content</text>
<rect x="388" y="192" width="240" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="400" y="210" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">tool_calls</text>
<rect x="388" y="224" width="240" height="26" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<text x="400" y="242" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfe6ee">invalid_tool_calls</text>

<line x1="388" y1="266" x2="628" y2="266" stroke="#3a4a5e" stroke-width="1"/>

<text x="388" y="290" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e8a34b">组 2　花了什么代价</text>
<text x="388" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">response_metadata　usage_metadata</text>
<text x="388" y="332" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">additional_kwargs　id</text>
<text x="388" y="360" font-family="system-ui, sans-serif" font-size="10.5" fill="#6b7a8d">由 provider 填充；假模型为空</text>
</svg>
