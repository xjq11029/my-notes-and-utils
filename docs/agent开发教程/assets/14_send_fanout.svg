<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>条件边与 Send 的并行派发</title>
<desc>条件边按路由函数选择一个后继；Send 从一条边派发 N 个并行任务，结果由 reducer 汇总。</desc>
<defs>
<marker id="ar14" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">两种「决定下一步去哪」的方式</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">条件边是「选一条路」，Send 是「同时走多条路」——后者才是 map-reduce</text>

<!-- 条件边 -->
<rect x="34" y="82" width="612" height="128" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">条件边：路由函数返回一个节点名</text>

<rect x="50" y="118" width="96" height="40" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="98" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">classify</text>

<rect x="240" y="114" width="120" height="22" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="0.9"/>
<text x="300" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">路由函数 → "weather"</text>
<rect x="240" y="140" width="120" height="22" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="0.9"/>
<text x="300" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">路由函数 → "math"</text>

<rect x="470" y="114" width="110" height="22" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="0.9"/>
<text x="525" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">weather 节点</text>
<rect x="470" y="140" width="110" height="22" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="0.9"/>
<text x="525" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">math 节点</text>

<path d="M146 138L238 125" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M146 138L238 151" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M360 125L468 125" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M360 151L468 151" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>

<text x="50" y="196" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">一次只走一条：路由函数返回哪个名字，就走哪个分支。适合分类、分流、按条件重试。</text>

<!-- Send -->
<rect x="34" y="222" width="612" height="128" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3c47a">Send：路由函数返回一个 Send 列表 → 并行执行</text>

<rect x="50" y="258" width="96" height="40" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="98" y="283" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">split</text>

<rect x="240" y="254" width="120" height="22" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="0.9"/>
<text x="300" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">Send("worker", {item:"a"})</text>
<rect x="240" y="280" width="120" height="22" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="0.9"/>
<text x="300" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">Send("worker", {item:"b"})</text>
<rect x="240" y="306" width="120" height="22" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="0.9"/>
<text x="300" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">Send("worker", {item:"c"})</text>

<rect x="470" y="254" width="110" height="22" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="0.9"/>
<text x="525" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">worker（同一 super-step）</text>
<rect x="470" y="280" width="110" height="22" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="0.9"/>
<text x="525" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">worker</text>
<rect x="470" y="306" width="110" height="22" rx="5" fill="#142b28" stroke="#3fd0b0" stroke-width="0.9"/>
<text x="525" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">worker</text>

<path d="M146 278L238 265" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M146 278L238 291" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M146 278L238 317" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M360 265L468 265" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M360 291L468 291" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>
<path d="M360 317L468 317" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar14)"/>

<!-- 汇总 -->
<rect x="34" y="362" width="612" height="30" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="340" y="381" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#f3c47a">三个 worker 并行跑，结果靠 Annotated[list, operator.add] 汇总 —— 这就是 map-reduce</text>
</svg>
