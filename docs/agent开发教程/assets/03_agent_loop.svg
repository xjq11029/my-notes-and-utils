<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>Agent Loop 与中间件的挂载点</title>
<desc>五步循环：组装 prompt、调用模型、解析输出、执行工具、结果回灌。中间件钩子挂在每一步的前后。</desc>
<defs>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">Agent Loop 与中间件的挂载点</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">循环本身只有五步；中间件的价值在于「在正确的时机插进正确的钩子」</text>

<!-- 五步 -->
<rect x="34" y="96" width="112" height="52" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="90" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">① 组装 prompt</text>
<text x="90" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">系统指令 + 历史</text>

<rect x="166" y="96" width="112" height="52" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="222" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">② 调用模型</text>
<text x="222" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">推理 → 产出</text>

<rect x="298" y="96" width="112" height="52" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="354" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">③ 解析输出</text>
<text x="354" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">要调工具？还是答复？</text>

<rect x="430" y="96" width="112" height="52" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="486" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">④ 执行工具</text>
<text x="486" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">真正落地的一步</text>

<rect x="562" y="96" width="84" height="52" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="604" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">⑤ 回灌</text>
<text x="604" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">结果进上下文</text>

<!-- 步骤间箭头 -->
<path d="M146 122L164 122" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3)"/>
<path d="M278 122L296 122" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3)"/>
<path d="M410 122L428 122" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3)"/>
<path d="M542 122L560 122" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3)"/>

<!-- 回环 -->
<path d="M604 148L604 176L90 176L90 150" fill="none" stroke="#3fd0b0" stroke-width="1.8" marker-end="url(#ar3)"/>
<rect x="300" y="164" width="132" height="22" rx="6" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="366" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#7fe3cd">回到 ① 再来一轮</text>

<!-- 出口 -->
<path d="M354 148L354 216" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar3)"/>
<rect x="246" y="216" width="216" height="34" rx="8" fill="#142b28" stroke="#3fd0b0" stroke-width="1.3"/>
<text x="354" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#7fe3cd">没有工具调用 → 结束本轮</text>

<!-- 钩子区 -->
<line x1="34" y1="272" x2="646" y2="272" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 4"/>
<text x="34" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">中间件钩子挂在哪</text>

<rect x="34" y="304" width="200" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="48" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">before_agent / after_agent</text>
<text x="48" y="339" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">包住整个调用，各只触发一次</text>

<rect x="246" y="304" width="200" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="260" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">before_model / after_model</text>
<text x="260" y="339" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">每次模型调用前后都走一遍</text>

<rect x="458" y="304" width="188" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="472" y="322" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">wrap_model_call</text>
<text x="472" y="339" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">可改写请求、拦截响应</text>

<rect x="34" y="358" width="200" height="44" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="48" y="376" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">wrap_tool_call</text>
<text x="48" y="393" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">包住工具执行，可重试 / 兜错</text>

<rect x="246" y="358" width="400" height="44" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="260" y="376" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">关键：钩子是「每次模型调用」级的，不是「每轮对话」级的</text>
<text x="260" y="393" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">一轮里模型被调两次（先决定调工具、再给答案），所以 before_model 会触发两次</text>
</svg>
