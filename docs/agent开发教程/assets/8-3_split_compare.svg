<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img">
<title>同一段文本，两种切分器的实测产出</title>
<desc>93 字、含一个空行的原文，chunk_size 设为 30。CharacterTextSplitter 只认空行，切出 2 块且都超过 30 字，超长只发一条默认不可见的 logging 警告；RecursiveCharacterTextSplitter 逐级回退，切出 4 块且都不超过 30 字，代价是可能断在句子中间。</desc>
<rect x="0" y="0" width="680" height="440" fill="#111721"/>

<text x="34" y="36" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">同一段文本，两种切分器的实测产出</text>
<text x="34" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">chunk_size = 30，两个参数一样，只有实现不同</text>

<!-- 原文 -->
<rect x="34" y="80" width="612" height="88" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="50" y="102" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">原文 93 字 · 一个空行分两段</text>
<text x="50" y="126" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">检索增强生成的第一步，是把私有文档切成语义完整的片段。切得太碎会丢失上下文。</text>
<text x="50" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">切得太大会稀释关键词，所以 chunk_size 与 chunk_overlap 这两个参数要按语料来调。</text>

<!-- 左：CharacterTextSplitter -->
<rect x="34" y="186" width="290" height="166" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="48" y="210" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ff9e97">CharacterTextSplitter</text>
<text x="48" y="228" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">separator='\n\n'　只认这一个分隔符</text>
<text x="48" y="256" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">① 38 字　→ 超过 30</text>
<text x="48" y="278" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">② 53 字　→ 超过 30</text>
<text x="48" y="304" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">超长只发一条 WARNING，走 logging</text>
<text x="48" y="322" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">控制台默认不显示</text>
<text x="48" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ff9e97">→ 2 块，两块都超标</text>

<!-- 右：RecursiveCharacterTextSplitter -->
<rect x="356" y="186" width="290" height="166" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="370" y="210" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">RecursiveCharacterTextSplitter</text>
<text x="370" y="228" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">回退 ['\n\n', '\n', ' ', '']</text>
<text x="370" y="256" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">① 30 字　② 8 字</text>
<text x="370" y="278" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">③ 26 字　④ 26 字</text>
<text x="370" y="304" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">保证不超 chunk_size</text>
<text x="370" y="322" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">代价：可能断在句中（「切得太」）</text>
<text x="370" y="344" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">→ 4 块，块块不超</text>

<!-- overlap -->
<line x1="34" y1="368" x2="646" y2="368" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 4"/>
<text x="48" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">chunk_overlap：让相邻块共享一段尾巴</text>
<text x="646" y="390" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">答案落在边界时，至少有一块是完整的</text>

<rect x="48" y="400" width="240" height="16" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1"/>
<rect x="216" y="400" width="240" height="16" rx="3" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<rect x="216" y="400" width="72" height="16" fill="#e8a34b" opacity="0.4"/>
<text x="60" y="412" font-family="system-ui, sans-serif" font-size="9" fill="#8ecbff">块 1</text>
<text x="252" y="412" font-family="system-ui, sans-serif" font-size="9" fill="#111721" font-weight="700">重叠</text>
<text x="400" y="412" font-family="system-ui, sans-serif" font-size="9" fill="#f3c47a">块 2</text>
</svg>
