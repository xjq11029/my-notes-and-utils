<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>三种入参在归一化处并成一份消息列表</title>
<desc>字符串、list[dict]、list[Message] 三种写法的差别只在客户端；过了归一化这道关口，模型侧收到的都是同一份消息对象列表。字符串只产生一条 HumanMessage；单条 dict 直接报错，Python 是 ValueError，JS 是 TypeError。</desc>
<defs>
<marker id="ar23" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7a8d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">三种入参，一道关口</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">写法三种，模型侧只看到一种：消息对象列表</text>

<rect x="24" y="104" width="200" height="52" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="40" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">str</text>
<text x="40" y="144" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">一条 HumanMessage</text>

<rect x="24" y="176" width="200" height="52" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="40" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">list[dict]</text>
<text x="40" y="216" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">逐条转成对应消息对象</text>

<rect x="24" y="248" width="200" height="52" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="40" y="270" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">list[Message]</text>
<text x="40" y="288" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">原样，不动</text>

<!-- 汇流 -->
<path d="M224 130L252 130L252 274L224 274" fill="none" stroke="#6b7a8d" stroke-width="1.4"/>
<path d="M224 202L264 202" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar23)"/>

<!-- 归一化 -->
<rect x="272" y="160" width="136" height="84" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.4"/>
<text x="340" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c9b8ff">归一化</text>
<text x="340" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">统一成同一种结构</text>
<text x="340" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">转成消息对象列表</text>

<path d="M412 202L444 202" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar23)"/>

<rect x="448" y="160" width="208" height="84" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
<text x="464" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">模型（ChatXxx）</text>
<text x="464" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">只看到这一份消息列表</text>
<text x="464" y="230" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">字符串那条 = 1 条 HumanMessage</text>

<!-- 红框：单条 dict -->
<rect x="448" y="264" width="208" height="72" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="464" y="288" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0655f">单条 dict：直接报错</text>
<text x="464" y="310" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">Python：ValueError</text>
<text x="464" y="328" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">JS：TypeError（信息看不出问题）</text>

<text x="340" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">两种列表写法归一化后逐条一致；差别只在客户端封装，不在模型侧</text>
</svg>
