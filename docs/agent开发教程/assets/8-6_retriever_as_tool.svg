<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>检索器包成工具：模型只看见 schema</title>
<desc>上一行是你写的包装：retriever 被 @tool 包一层，对外只剩名字、描述与参数 schema。下一行是运行时的四步：模型决定要不要查、输出 tool_call、框架执行检索并写成 ToolMessage、模型据此作答。模型全程没有接触向量库。</desc>
<defs>
<marker id="ar86" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="36" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">检索器包成工具：模型只看见 schema</text>
<text x="34" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">包装只做一件事：把「查库」换成「调一个函数」</text>

<text x="34" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">你写的包装</text>

<rect x="38" y="96" width="176" height="76" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="52" y="120" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">检索器 retriever</text>
<text x="52" y="140" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">store.as_retriever(k=2)</text>
<text x="52" y="158" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">invoke(query) → 一组 Document</text>

<path d="M216 134L250 134" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar86)"/>

<rect x="254" y="96" width="176" height="76" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="268" y="120" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">@tool 包一层</text>
<text x="268" y="140" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">def search_docs(query)</text>
<text x="268" y="158" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">返回拼好的字符串</text>

<path d="M432 134L466 134" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar86)"/>

<rect x="470" y="96" width="176" height="76" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="484" y="120" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">模型看到的</text>
<text x="484" y="140" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">name / description</text>
<text x="484" y="158" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">参数 schema</text>

<line x1="34" y1="200" x2="646" y2="200" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 4"/>
<text x="34" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">运行时：模型只在这四步里活动</text>

<rect x="38" y="212" width="140" height="70" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="52" y="236" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">① 模型决定</text>
<text x="52" y="256" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">要不要查</text>
<text x="52" y="272" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">看工具描述</text>

<path d="M180 247L190 247" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar86)"/>

<rect x="192" y="212" width="140" height="70" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="206" y="236" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">② tool_call</text>
<text x="206" y="256" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">search_docs</text>
<text x="206" y="272" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">只输出意图</text>

<path d="M334 247L344 247" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar86)"/>

<rect x="346" y="212" width="140" height="70" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="360" y="236" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">③ 框架执行</text>
<text x="360" y="256" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">跑检索、拼成文本</text>
<text x="360" y="272" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">写成 ToolMessage</text>

<path d="M488 247L498 247" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar86)"/>

<rect x="500" y="212" width="140" height="70" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="514" y="236" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">④ 模型作答</text>
<text x="514" y="256" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">据片段生成</text>
<text x="514" y="272" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">可能仍会编</text>

<text x="40" y="312" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">模型看不到向量库、也看不到 retriever——它只看到这个工具的 name / description / schema。</text>
<text x="40" y="334" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">检索器给什么，模型就只能看什么；检索不到时，它更常说不知道，或者直接编。</text>
<text x="40" y="360" font-family="system-ui, sans-serif" font-size="10" fill="#f0655f">所以排查 RAG 的第一顺位是检索：切分粒度、检索策略、查询改写，不是换更大的模型。</text>
</svg>
