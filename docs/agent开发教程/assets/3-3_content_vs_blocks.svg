<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img">
<title>content 与 content_blocks：字段随供应商变，还是统一口径</title>
<desc>content 是弱类型，多模态时图片字段随供应商不同：OpenAI 用 image_url，另一家用 image 加 source，换模型就要改代码。content_blocks 用统一的 type 字段区分 text、image、audio、video、tool_call、reasoning 六种块，跨供应商只换模型不改代码。</desc>
<defs>
<marker id="ar33" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#93a1b1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">content 与 content_blocks：谁的字段更稳</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">同一个「发张图给模型」，两家供应商的写法可以完全不一样</text>

<!-- 左：content -->
<rect x="24" y="96" width="300" height="234" rx="9" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="40" y="120" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ff9d99">content：弱类型</text>
<text x="40" y="140" font-family="ui-monospace, monospace" font-size="9.5" fill="#93a1b1">str　或　list[dict]</text>

<rect x="38" y="150" width="272" height="56" rx="6" fill="#111721" stroke="#3a4a5e" stroke-width="0.9"/>
<text x="48" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">OpenAI 的写法</text>
<text x="48" y="182" font-family="ui-monospace, monospace" font-size="9" fill="#dfe6ee">{"type": "image_url",</text>
<text x="48" y="197" font-family="ui-monospace, monospace" font-size="9" fill="#dfe6ee"> "image_url": {...}}</text>

<rect x="38" y="214" width="272" height="56" rx="6" fill="#111721" stroke="#3a4a5e" stroke-width="0.9"/>
<text x="48" y="230" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">另一家的写法</text>
<text x="48" y="246" font-family="ui-monospace, monospace" font-size="9" fill="#dfe6ee">{"type": "image",</text>
<text x="48" y="261" font-family="ui-monospace, monospace" font-size="9" fill="#dfe6ee"> "source": {...}}</text>

<text x="40" y="296" font-family="system-ui, sans-serif" font-size="10" fill="#ff9d99">× 字段名随供应商</text>
<text x="40" y="316" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">换模型就得改代码，改一处漏一处</text>

<!-- 右：content_blocks -->
<rect x="356" y="96" width="300" height="234" rx="9" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="372" y="120" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">content_blocks：统一口径</text>
<text x="372" y="140" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">每个块都有 type 字段</text>

<rect x="372" y="152" width="132" height="24" rx="5" fill="#111721" stroke="#4dabf7" stroke-width="0.9"/>
<text x="382" y="168" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">{"type": "text"}</text>
<rect x="512" y="152" width="132" height="24" rx="5" fill="#111721" stroke="#4dabf7" stroke-width="0.9"/>
<text x="522" y="168" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">{"type": "image"}</text>

<rect x="372" y="184" width="132" height="24" rx="5" fill="#111721" stroke="#4dabf7" stroke-width="0.9"/>
<text x="382" y="200" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">{"type": "audio"}</text>
<rect x="512" y="184" width="132" height="24" rx="5" fill="#111721" stroke="#4dabf7" stroke-width="0.9"/>
<text x="522" y="200" font-family="ui-monospace, monospace" font-size="9" fill="#8ecbff">{"type": "video"}</text>

<rect x="372" y="216" width="132" height="24" rx="5" fill="#111721" stroke="#a78bfa" stroke-width="0.9"/>
<text x="382" y="232" font-family="ui-monospace, monospace" font-size="9" fill="#c9b8ff">{"type": "tool_call"}</text>
<rect x="512" y="216" width="132" height="24" rx="5" fill="#111721" stroke="#a78bfa" stroke-width="0.9"/>
<text x="522" y="232" font-family="ui-monospace, monospace" font-size="9" fill="#c9b8ff">{"type": "reasoning"}</text>

<text x="372" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">✓ 跨供应商统一</text>
<text x="372" y="292" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">换模型不用改代码</text>
<text x="372" y="314" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">读思维链 / 引用也读同一套</text>

<!-- 结论 -->
<rect x="24" y="346" width="632" height="52" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="40" y="368" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">左边认供应商，右边认 type</text>
<text x="40" y="386" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">要发多模态、读推理内容，先想 content_blocks，别在 content 的字段名上打补丁</text>
</svg>
