<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" height="490" role="img">
<title>节点级治理：重试与降级、超时、缓存</title>
<desc>RetryPolicy 在失败后重试，重试耗尽交给 error_handler 降级；timeout 只支持 async 节点；CachePolicy 让同输入的纯节点直接复用上次结果。</desc>
<defs>
<marker id="ar116" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar116r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#f0655f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar116b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4dabf7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="490" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">节点级治理：失败重试、太慢超时、重复缓存</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">三件事都挂在 add_node 上，图的结构和节点代码都不用改</text>

<!-- ① 重试 -->
<rect x="34" y="80" width="612" height="152" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="102" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">① 重试与降级：RetryPolicy + error_handler</text>

<rect x="50" y="120" width="90" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="95" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">节点执行</text>

<rect x="180" y="120" width="104" height="34" rx="6" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="232" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ff9d99">抛 ValueError</text>

<rect x="318" y="120" width="120" height="34" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="378" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f3c47a">重试，最多 3 次</text>

<rect x="470" y="106" width="160" height="28" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="550" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">第三次成功 → 正常返回</text>

<rect x="470" y="150" width="160" height="28" rx="6" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="550" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff9d99">耗尽 → error_handler 降级</text>

<path d="M140 137L176 137" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar116)"/>
<path d="M284 137L314 137" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar116)"/>
<path d="M438 137L452 137L452 120L466 120" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar116b)"/>
<path d="M438 137L452 137L452 164L466 164" fill="none" stroke="#f0655f" stroke-width="1.4" marker-end="url(#ar116r)"/>

<text x="50" y="198" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">前两次抛 ValueError，第三次成功 → 节点总共执行 3 次（示例实测）</text>
<text x="50" y="218" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">error_handler 在重试耗尽后接管（源码核对；示例未构造耗尽用例）</text>

<!-- ② 超时 -->
<rect x="34" y="244" width="612" height="102" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="266" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">② 超时：timeout=0.05 秒（JS 侧 50 毫秒）</text>

<rect x="50" y="284" width="100" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="100" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">async 节点</text>

<rect x="190" y="284" width="110" height="34" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="245" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f3c47a">超过 timeout</text>

<rect x="340" y="284" width="130" height="34" rx="6" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="405" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ff9d99">NodeTimeoutError</text>

<path d="M150 301L186 301" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar116)"/>
<path d="M300 301L336 301" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar116)"/>

<text x="486" y="296" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">只支持 async 节点</text>
<text x="486" y="314" font-family="system-ui, sans-serif" font-size="9.5" fill="#ff9d99">同步节点 compile() 抛 ValueError</text>

<text x="50" y="338" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">不是配置问题：Python 没法安全取消同步执行</text>

<!-- ③ 缓存 -->
<rect x="34" y="358" width="612" height="94" rx="9" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="380" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">③ 缓存：CachePolicy(ttl=60) + InMemoryCache</text>

<rect x="50" y="396" width="120" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="110" y="417" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">同输入再来一次</text>

<rect x="200" y="396" width="96" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="248" y="417" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">缓存命中</text>

<rect x="326" y="396" width="140" height="34" rx="6" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="396" y="417" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">跳过执行，直接返回</text>

<path d="M170 413L196 413" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar116b)"/>
<path d="M296 413L322 413" fill="none" stroke="#4dabf7" stroke-width="1.4" marker-end="url(#ar116b)"/>

<text x="486" y="409" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">只给纯节点</text>
<text x="486" y="427" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">写库 / 发消息 / 扣款别开</text>

<!-- 底注 -->
<rect x="34" y="458" width="612" height="26" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1"/>
<text x="340" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f3c47a">JS 的 InMemoryCache 在 @langchain/langgraph-checkpoint 包里，不在顶层（本机核对）</text>
</svg>
