<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>文档切分与向量化</title>
<desc>一篇长文档经切分器变成多个短块，每块单独嵌入成向量，向量连同原文与 metadata 一起写入向量库；检索时只比对向量，返回的仍是原文。</desc>
<defs>
<marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">切分与向量化：一篇文档变成一排向量</text>
<text x="34" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">向量只是索引；检索命中后带回来的仍是原文与 metadata</text>

<!-- 长文档 -->
<rect x="34" y="104" width="130" height="180" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
<text x="46" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dfe6ee">一篇长文档</text>
<line x1="46" y1="142" x2="152" y2="142" stroke="#6b7a8d" stroke-width="2" stroke-linecap="round"/>
<line x1="46" y1="158" x2="152" y2="158" stroke="#6b7a8d" stroke-width="2" stroke-linecap="round"/>
<line x1="46" y1="174" x2="140" y2="174" stroke="#6b7a8d" stroke-width="2" stroke-linecap="round"/>
<line x1="46" y1="198" x2="152" y2="198" stroke="#6b7a8d" stroke-width="2" stroke-linecap="round"/>
<line x1="46" y1="214" x2="146" y2="214" stroke="#6b7a8d" stroke-width="2" stroke-linecap="round"/>
<line x1="46" y1="238" x2="152" y2="238" stroke="#6b7a8d" stroke-width="2" stroke-linecap="round"/>
<line x1="46" y1="254" x2="134" y2="254" stroke="#6b7a8d" stroke-width="2" stroke-linecap="round"/>
<text x="46" y="276" font-family="system-ui, sans-serif" font-size="10" fill="#6b7a8d">整文件一条 Document</text>

<path d="M166 194L196 194" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- 切分器 -->
<rect x="200" y="164" width="72" height="60" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="214" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">切分</text>
<text x="214" y="208" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">Splitter</text>

<path d="M274 194L300 194" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- chunks -->
<rect x="304" y="100" width="150" height="40" rx="6" fill="#142b28" stroke="#3fd0b0" stroke-width="1.1"/>
<text x="316" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#7fe3cd">chunk 1</text>
<text x="316" y="132" font-family="system-ui, sans-serif" font-size="9.5" fill="#6b7a8d">metadata: source / page</text>

<rect x="304" y="152" width="150" height="40" rx="6" fill="#142b28" stroke="#3fd0b0" stroke-width="1.1"/>
<text x="316" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#7fe3cd">chunk 2</text>
<text x="316" y="184" font-family="system-ui, sans-serif" font-size="9.5" fill="#6b7a8d">与上一块共享一段尾巴</text>

<rect x="304" y="204" width="150" height="40" rx="6" fill="#142b28" stroke="#3fd0b0" stroke-width="1.1"/>
<text x="316" y="222" font-family="system-ui, sans-serif" font-size="10" fill="#7fe3cd">chunk 3</text>
<text x="316" y="236" font-family="system-ui, sans-serif" font-size="9.5" fill="#6b7a8d">chunk_overlap 产生</text>

<rect x="304" y="256" width="150" height="40" rx="6" fill="#142b28" stroke="#3fd0b0" stroke-width="1.1"/>
<text x="316" y="274" font-family="system-ui, sans-serif" font-size="10" fill="#7fe3cd">chunk 4</text>
<text x="316" y="288" font-family="system-ui, sans-serif" font-size="9.5" fill="#6b7a8d">每块都是一条 Document</text>

<path d="M456 198L482 198" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- 嵌入 -->
<rect x="486" y="164" width="66" height="60" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="498" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e8a34b">嵌入</text>
<text x="498" y="208" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">Embed</text>

<path d="M554 198L578 198" fill="none" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar1)"/>

<!-- 向量库 -->
<rect x="582" y="120" width="64" height="150" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="592" y="146" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c9b8ff">向量库</text>
<line x1="592" y1="158" x2="636" y2="158" stroke="#3a4a5e" stroke-width="1"/>
<text x="592" y="178" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">向量</text>
<text x="592" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">原文</text>
<text x="592" y="214" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">metadata</text>
<text x="592" y="244" font-family="system-ui, sans-serif" font-size="9" fill="#6b7a8d">检索只比</text>
<text x="592" y="257" font-family="system-ui, sans-serif" font-size="9" fill="#6b7a8d">向量</text>

<line x1="34" y1="320" x2="646" y2="320" stroke="#3a4a5e" stroke-width="1"/>
<text x="34" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#93a1b1">入库用 embed_documents（批量），检索用 embed_query（单条）——两个方法分开是因为部分模型对两者编码不同。</text>
<text x="34" y="366" font-family="system-ui, sans-serif" font-size="11" fill="#f0655f">换嵌入模型等于换坐标系，旧向量全部作废，必须重建索引。</text>
</svg>
