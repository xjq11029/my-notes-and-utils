<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>检查点落盘与故障恢复</title>
<desc>每一步把状态落盘到进程之外；崩溃后从最近检查点继续，只丢最后一步，而不是从头再来。</desc>
<defs>
<marker id="ar15" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">检查点：把状态放到「进程之外」</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">关键不是「保存了状态」，而是「保存到了进程重启也还在的地方」</text>

<!-- 上：进程内存 -->
<rect x="34" y="82" width="612" height="66" rx="9" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="50" y="104" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ff9d99">进程内存（InMemorySaver / MemorySaver）</text>
<text x="50" y="124" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">进程一退出，全部检查点消失；重启后同一 thread_id 打开是一张白纸</text>
<text x="50" y="140" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">只适合开发与测试——生产环境用它是「会话随机丢失」的常见根因</text>

<path d="M340 152L340 172" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar15)"/>

<!-- 下：持久化存储 -->
<rect x="34" y="176" width="612" height="152" rx="9" fill="#142b28" stroke="#3fd0b0" stroke-width="1.4"/>
<text x="50" y="198" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#7fe3cd">持久化存储（SqliteSaver / PostgresSaver 等）</text>

<!-- 时间线 -->
<line x1="70" y1="252" x2="620" y2="252" stroke="#3a4a5e" stroke-width="1.6"/>

<circle cx="110" cy="252" r="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="110" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">step 1</text>
<circle cx="230" cy="252" r="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="230" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">step 2</text>
<circle cx="350" cy="252" r="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="350" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#8ecbff">step 3</text>
<circle cx="470" cy="252" r="9" fill="#2a2320" stroke="#e8a34b" stroke-width="1.5"/>
<text x="470" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">step 4</text>
<text x="470" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f0655f">崩溃</text>
<circle cx="590" cy="252" r="7" fill="#142b28" stroke="#3fd0b0" stroke-width="1.5"/>
<text x="590" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">step 5</text>

<!-- 恢复箭头 -->
<path d="M350 264L350 300L590 300L590 266" fill="none" stroke="#3fd0b0" stroke-width="1.8" marker-end="url(#ar15)"/>
<rect x="392" y="289" width="156" height="22" rx="6" fill="#142b28" stroke="#3fd0b0" stroke-width="1"/>
<text x="470" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7fe3cd">从最近检查点续跑（只丢 1 步）</text>

<text x="50" y="322" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">检查点不只是崩溃恢复：它同时是「跨上下文窗口接力」的前提——这是长任务能跑下去的基础</text>

<!-- 底部 -->
<rect x="34" y="344" width="612" height="44" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="50" y="364" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">换存储的一个硬约束</text>
<text x="50" y="381" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">中途从内存版换到数据库版，历史检查点搬不过去——所以「用哪种持久化」最好一开始就定下来</text>
</svg>
