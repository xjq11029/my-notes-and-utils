<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="680" height="450" role="img">
<title>两个 API 的分工：一次模型调用 vs agent 循环的最后一步</title>
<desc>model.with_structured_output(schema) 管一次模型调用，返回值就是结果本身；agent 侧的 response_format 管循环的最后一步，结构化结果一落地循环就终止。下方列出三条差异：结果取法、是否重试、策略参数，并标出 JS 的 providerStrategy() 不重试。</desc>
<defs>
<marker id="ar46a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="450" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">两个 API 的分工：界画在循环的哪一段</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">不是替代关系——一个包住一次调用，一个只包住最后一步</text>

<rect x="24" y="88" width="300" height="166" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="40" y="112" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">model.with_structured_output(schema)</text>

<rect x="40" y="126" width="268" height="66" rx="6" fill="#14232f" stroke="#4dabf7" stroke-width="1" stroke-dasharray="4 3"/>
<text x="56" y="148" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">圈住的是一整次模型调用</text>
<text x="56" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">模型 → 解析 → 校验 → 返回</text>

<text x="40" y="214" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">结果就在 invoke() 的返回值里</text>
<text x="40" y="232" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">没有循环，也没有第二次机会（除非 include_raw）</text>

<rect x="356" y="88" width="300" height="166" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="372" y="112" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">response_format / responseFormat</text>

<rect x="372" y="126" width="86" height="30" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="415" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">模型</text>
<rect x="470" y="126" width="86" height="30" rx="5" fill="#1b2532" stroke="#3a4a5e" stroke-width="1"/>
<text x="513" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">工具</text>
<rect x="568" y="126" width="80" height="30" rx="5" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="608" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">最后一步</text>

<path d="M458 141L468 141" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar46a)"/>
<path d="M556 141L566 141" fill="none" stroke="#6b7a8d" stroke-width="1.3" marker-end="url(#ar46a)"/>

<text x="372" y="180" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">结构化结果一落地，循环立即终止</text>
<text x="372" y="202" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">取结果：result["structured_response"]</text>
<text x="372" y="220" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">JS 侧：result.structuredResponse</text>
<text x="372" y="238" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">策略没命中时是 undefined，框架不报错</text>

<text x="24" y="278" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#dfe6ee">三条差异</text>

<rect x="24" y="290" width="200" height="82" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="40" y="312" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">① 结果取法</text>
<text x="40" y="334" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">前者：返回值本身</text>
<text x="40" y="352" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">后者：structured_response</text>

<rect x="240" y="290" width="200" height="82" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="256" y="312" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">② 是否重试</text>
<text x="256" y="334" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">前者：失败即抛</text>
<text x="256" y="352" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">后者：工具策略自动重试</text>

<rect x="456" y="290" width="200" height="82" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="472" y="312" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dfe6ee">③ 策略参数</text>
<text x="472" y="334" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">前者：method=...</text>
<text x="472" y="352" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">后者：Tool / Provider / Auto</text>

<rect x="24" y="386" width="632" height="44" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.1"/>
<text x="40" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#f0908b">JS 的 providerStrategy() 走原生路径，校验失败不重试，直接抛 StructuredOutputParsingError。</text>
<text x="40" y="421" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">源码核对；假模型没有 provider 原生能力，这条从未跑通过。</text>
</svg>
