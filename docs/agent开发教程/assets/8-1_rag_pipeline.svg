<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>RAG 五步：每一步换一次产物形态</title>
<desc>上半程离线：Load 把文件变成 Document、Split 把它切成短块、Embed 把短块换成向量、Store 把向量与原文一起入库，文档变了才重跑。下半程在线：提问先用 embed_query 嵌成向量，再 Retrieve 取回 k 条原文，最后交给模型生成。</desc>
<defs>
<marker id="ar81" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="36" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">RAG 五步：每一步换一次产物形态</text>
<text x="34" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">五步只做一件事——把上一步的产物换成下一种形态</text>

<!-- 离线半程 -->
<text x="34" y="92" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#c9b8ff">离线半程</text>
<text x="106" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">文档变了才重跑一次</text>

<rect x="38" y="104" width="132" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="52" y="126" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">① Load</text>
<text x="52" y="146" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">文件 → Document</text>
<text x="52" y="162" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">一条或几条</text>

<path d="M172 137L190 137" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar81)"/>

<rect x="192" y="104" width="132" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="206" y="126" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">② Split</text>
<text x="206" y="146" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">长文档 → 短块</text>
<text x="206" y="162" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">chunk_size 定大小</text>

<path d="M326 137L344 137" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar81)"/>

<rect x="346" y="104" width="132" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="360" y="126" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">③ Embed</text>
<text x="360" y="146" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">短块 → 向量</text>
<text x="360" y="162" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">embed_documents</text>

<path d="M480 137L498 137" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar81)"/>

<rect x="500" y="104" width="132" height="66" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="514" y="126" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">④ Store</text>
<text x="514" y="146" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">向量 + 原文 → 库</text>
<text x="514" y="162" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">可检索</text>

<!-- 在线半程 -->
<text x="34" y="204" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8ecbff">在线半程</text>
<text x="106" y="204" font-family="system-ui, sans-serif" font-size="10" fill="#7d8b9c">每次提问都要跑，含一次查询嵌入</text>

<rect x="38" y="216" width="106" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="50" y="238" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">查询文本</text>
<text x="50" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">用户的原话</text>
<text x="50" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">一次一跑</text>

<path d="M146 249L158 249" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar81)"/>

<rect x="160" y="216" width="106" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="172" y="238" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">查询嵌入</text>
<text x="172" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">问题 → 向量</text>
<text x="172" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">embed_query</text>

<path d="M268 249L280 249" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar81)"/>

<rect x="282" y="216" width="122" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="294" y="238" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">⑤ Retrieve</text>
<text x="294" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">取最近的 k 条</text>
<text x="294" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">返回原文</text>

<path d="M406 249L418 249" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar81)"/>

<rect x="420" y="216" width="106" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="432" y="238" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">片段</text>
<text x="432" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">原文 + metadata</text>
<text x="432" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">带出处</text>

<path d="M528 249L540 249" fill="none" stroke="#6b7a8d" stroke-width="1.4" marker-end="url(#ar81)"/>

<rect x="542" y="216" width="110" height="66" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
<text x="554" y="238" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">模型生成</text>
<text x="554" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#dfe6ee">片段 + 问题</text>
<text x="554" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">→ 答案</text>

<!-- 底部说明 -->
<rect x="24" y="306" width="632" height="76" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="40" y="330" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">Embed 出现两次：入库走 embed_documents（批量），提问走 embed_query（单条）——同一个模型。</text>
<text x="40" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#9fb0c0">换模型等于换坐标系，旧向量全部作废；两边的维度必须一致。</text>
<text x="40" y="372" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">排查：检索不准 → 先看 Split 与 Retrieve；答案编造 → 先看 Load 的源文件里有没有这段</text>
</svg>
