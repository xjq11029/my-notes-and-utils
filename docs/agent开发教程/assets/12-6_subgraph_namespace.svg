<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>子图与父图的检查点命名空间</title>
<desc>父图在顶层命名空间里，子图在自己的 checkpoint_ns 里。子图在 interrupt 处暂停时，父图看到停在 child 节点、values 为 x=0，下钻 tasks[0].state 才看到子图停在 child_pause、values 为 x=1。</desc>
<defs>
<marker id="m126" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">子图在父图里的检查点命名空间</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">一条线程，两层快照；先看父图，再下钻</text>

<!-- 父图 -->
<rect x="34" y="86" width="612" height="150" rx="10" fill="#1b2532" stroke="#4dabf7" stroke-width="1.2"/>
<text x="50" y="108" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">父图　thread: sub-demo　checkpoint_ns = ""</text>

<rect x="50" y="145" width="68" height="36" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="84" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">START</text>

<rect x="132" y="118" width="330" height="96" rx="9" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="144" y="138" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c9b8ff">子图　checkpoint_ns = child:&lt;uuid&gt;</text>

<rect x="144" y="146" width="140" height="34" rx="6" fill="#1b2532" stroke="#a78bfa" stroke-width="1"/>
<text x="214" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">child_change</text>

<rect x="300" y="146" width="146" height="34" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.1"/>
<text x="373" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#f3c47a">child_pause（暂停）</text>

<rect x="478" y="145" width="68" height="36" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="512" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8ecbff">END</text>

<path d="M118 163L130 163" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#m126)"/>
<path d="M284 163L298 163" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#m126)"/>
<path d="M462 163L476 163" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#m126)"/>

<text x="50" y="228" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">父图这一个超步里，子图整体只是一个 task</text>

<!-- 两层读法 -->
<text x="34" y="252" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">get_state(cfg, subgraphs=True)：一个返回值里装着两层快照</text>

<rect x="34" y="262" width="300" height="86" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.1"/>
<text x="48" y="282" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8ecbff">父图这一层看到</text>
<text x="48" y="303" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">values = {'x': 0}</text>
<text x="48" y="321" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">next = ('child',)</text>
<text x="48" y="339" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">tasks 里 1 个 task</text>

<rect x="346" y="262" width="300" height="86" rx="8" fill="#241f38" stroke="#a78bfa" stroke-width="1.1"/>
<text x="360" y="282" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#c9b8ff">下钻到 tasks[0].state</text>
<text x="360" y="303" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">values = {'x': 1}</text>
<text x="360" y="321" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">next = ('child_pause',)</text>
<text x="360" y="339" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">checkpoint_ns = child:&lt;uuid&gt;</text>

<text x="34" y="374" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">跑完后 tasks 为空，只剩父图这一层；get_state_history 没有 subgraphs 参数（源码核对）</text>
</svg>
