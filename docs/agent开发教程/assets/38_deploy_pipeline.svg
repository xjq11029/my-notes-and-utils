<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img">
<title>从部署清单到本地 Agent Server</title>
<desc>langgraph.json 经 langgraph dev 起本地 Agent Server，再连接 Studio 与 AgentChatUI。</desc>

<rect x="0" y="0" width="680" height="400" fill="#111721"/>
<text x="34" y="38" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">从部署清单到本地 Agent Server</text>
<text x="34" y="62" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#7d8b9c">清单负责「加载什么」，dev 负责「把服务跑起来」，Studio 只是前端</text>

<!-- config -->
<rect x="30" y="96" width="190" height="200" rx="8" fill="#1d2b3d" stroke="#4dabf7"/>
<text x="125" y="122" text-anchor="middle" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#8ecbff">langgraph.json</text>
<text x="48" y="152" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">dependencies: ["."]</text>
<text x="48" y="174" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">graphs: agent → .py:graph</text>
<text x="48" y="196" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">env: {} / .env</text>
<text x="48" y="218" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">python_version: 3.11–3.13</text>
<text x="48" y="246" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#6b7a8d">validate -c langgraph.json</text>
<text x="48" y="266" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#6b7a8d">→ 1 graph found</text>

<!-- server -->
<rect x="260" y="96" width="190" height="200" rx="8" fill="#2a2320" stroke="#e8a34b"/>
<text x="355" y="122" text-anchor="middle" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f3c47a">Agent Server</text>
<text x="278" y="152" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">langgraph dev</text>
<text x="278" y="174" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">--config langgraph.json</text>
<text x="278" y="196" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">--port 2025</text>
<text x="278" y="224" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#93a1b1">in-memory runtime</text>
<text x="278" y="244" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#93a1b1">/ok → {"ok": true}</text>
<text x="278" y="272" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#ffb3ae">Windows 需 colorama</text>

<!-- UIs -->
<rect x="490" y="96" width="160" height="76" rx="8" fill="#1b2532" stroke="#3a4a5e"/>
<text x="570" y="124" text-anchor="middle" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">Studio UI</text>
<text x="570" y="146" text-anchor="middle" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="9.5" fill="#93a1b1">浏览器 + 账号（未实测）</text>

<rect x="490" y="200" width="160" height="76" rx="8" fill="#1b2532" stroke="#3a4a5e"/>
<text x="570" y="228" text-anchor="middle" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dfe6ee">AgentChatUI</text>
<text x="570" y="250" text-anchor="middle" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="9.5" fill="#93a1b1">独立前端（未实测）</text>

<!-- arrows -->
<path d="M220 196 L256 196" stroke="#4dabf7" stroke-width="1.3"/><path d="M250 192 L258 196 L250 200" fill="#4dabf7"/>
<text x="238" y="186" text-anchor="middle" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="9.5" fill="#8ecbff">加载</text>

<path d="M450 170 L486 140" stroke="#e8a34b" stroke-width="1.2"/><path d="M480 136 L488 138 L483 144" fill="#e8a34b"/>
<path d="M450 222 L486 238" stroke="#e8a34b" stroke-width="1.2"/><path d="M480 233 L488 238 L480 242" fill="#e8a34b"/>
<text x="468" y="164" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="9.5" fill="#f3c47a">baseUrl</text>
<text x="468" y="258" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="9.5" fill="#f3c47a">baseUrl</text>

<text x="34" y="334" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#93a1b1">本机实测到 /ok 与图导入为止；Docker build、云端 deploy、Studio 页面均未实测。</text>
<text x="34" y="356" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10.5" fill="#ffb3ae">部署不是原样上传：持久化后端、密钥来源、审批 UI 都会换。</text>
<text x="34" y="380" font-family="Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#6b7a8d">Python-only 样例：19_deploy_agent.py + langgraph.json。</text>
</svg>
