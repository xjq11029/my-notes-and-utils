<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img">
<title>手动四环链路与 with_structured_output 一次调用的对比</title>
<desc>左侧是手动解析的四个环节：提示词要求 JSON、json.loads、手动校验、手动建对象，每一环旁边标出它的典型失败。右侧是 model.with_structured_output(Person) 的一次调用，解析与校验由框架完成，字段 description 直接成为提示词的一部分。结论是失败点从业务代码挪到了框架边界。</desc>
<defs>
<marker id="ar41a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="460" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">手动四环 vs 一次调用</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">左边四步都靠代码自觉，右边一次调用把解析与校验交给框架</text>

<text x="24" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93a1b1">手动链路：四个环节，四种断法</text>
<text x="352" y="96" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#93a1b1">结构化输出：一次调用</text>

<line x1="336" y1="88" x2="336" y2="372" stroke="#3a4a5e" stroke-width="1" stroke-dasharray="4 4"/>

<rect x="24" y="108" width="296" height="58" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="40" y="129" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f0908b">① 提示词要求 JSON</text>
<text x="40" y="149" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">模型先来一句「好的，以下是结果：」→ 解析崩</text>

<rect x="24" y="176" width="296" height="58" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="40" y="197" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f0908b">② json.loads 解析</text>
<text x="40" y="217" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">字段名写成 title1 → 解析照过，下游 KeyError</text>

<rect x="24" y="244" width="296" height="58" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="40" y="265" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f0908b">③ 手动校验</text>
<text x="40" y="285" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">忘了 isinstance → 错值一路流进数据库</text>

<rect x="24" y="312" width="296" height="58" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.2"/>
<text x="40" y="333" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f0908b">④ 手动建对象</text>
<text x="40" y="353" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">少一个字段 → TypeError 落在业务代码里</text>

<rect x="352" y="108" width="304" height="262" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>

<rect x="368" y="126" width="272" height="38" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="504" y="149" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">model.with_structured_output(Person)</text>

<path d="M504 164L504 180" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar41a)"/>

<rect x="368" y="182" width="272" height="38" rx="6" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="504" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">.invoke("张三是一名 30 岁的软件工程师")</text>

<path d="M504 220L504 236" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar41a)"/>

<rect x="368" y="238" width="272" height="44" rx="6" fill="#14232f" stroke="#4dabf7" stroke-width="1.3"/>
<text x="504" y="257" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">Person 实例</text>
<text x="504" y="273" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">name / age / occupation 已校验</text>

<text x="368" y="306" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">· 解析与校验由框架完成</text>
<text x="368" y="324" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">· description 就是提示词的一部分</text>
<text x="368" y="342" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">· 类型不对时抛 ValidationError</text>

<rect x="24" y="386" width="632" height="58" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="40" y="409" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">省掉的是四行胶水代码；真正变的是失败点——从你的业务代码，挪到了框架的边界。</text>
<text x="40" y="429" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">description 写清楚，等于把提示词写进了 schema：模型看到的结构描述就是它。</text>
</svg>
