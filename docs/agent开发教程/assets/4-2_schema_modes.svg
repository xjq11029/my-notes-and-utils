<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img">
<title>四种 schema 模式走同一个入口，出口分两档</title>
<desc>Pydantic、TypedDict、@dataclass、JSON Schema 四种写法都进 model.with_structured_output 这一个入口。出口分两档：Pydantic 那条路上有运行时校验，返回 P 实例；另外三条只有门框，返回未经校验的 dict。分界线是运行时有没有一个会自己校验的对象。</desc>
<defs>
<marker id="ar42a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#6b7a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="430" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">四种 schema 模式：一道门，两档出口</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">四种写法都能绑上模型；只有一种在运行时会把坏数据拦下来</text>

<rect x="24" y="92" width="152" height="32" rx="6" fill="#241f38" stroke="#a78bfa" stroke-width="1.2"/>
<text x="100" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#c9b8ff">Pydantic</text>

<rect x="184" y="92" width="152" height="32" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="260" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#f3c47a">TypedDict</text>

<rect x="344" y="92" width="152" height="32" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="420" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#f3c47a">@dataclass</text>

<rect x="504" y="92" width="152" height="32" rx="6" fill="#2a2320" stroke="#e8a34b" stroke-width="1.2"/>
<text x="580" y="113" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#f3c47a">JSON Schema</text>

<path d="M100 124L100 146" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<path d="M260 124L260 146" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<path d="M420 124L420 146" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<path d="M580 124L580 146" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<path d="M100 146L580 146" fill="none" stroke="#6b7a8d" stroke-width="1.3"/>
<path d="M340 146L340 158" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar42a)"/>

<rect x="240" y="160" width="200" height="38" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="340" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">with_structured_output(schema)</text>

<path d="M340 198L190 198L190 226" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar42a)"/>
<path d="M340 198L490 198L490 226" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar42a)"/>

<rect x="24" y="232" width="300" height="118" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="40" y="256" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">Pydantic：门口有检票员</text>
<text x="40" y="278" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">model_validate 在客户端校验；类型不对当场抛</text>
<text x="40" y="296" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">出口：P 实例（name、age 都已转成声明类型）</text>
<text x="40" y="320" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">约束 / 嵌套 / 枚举 / 默认值，四者里能力最全</text>
<text x="40" y="338" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">age="三十" → ValidationError，不进下游</text>

<rect x="356" y="232" width="300" height="118" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="372" y="256" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f3c47a">另外三道：只画了门框</text>
<text x="372" y="278" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfe6ee">TypedDict / @dataclass 只是类型声明，运行时无校验</text>
<text x="372" y="296" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">JSON Schema 是一段纯数据，连 Python 类型都不是</text>
<text x="372" y="320" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">出口：未经校验的 dict，字段名错了也照收</text>
<text x="372" y="338" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">age="三十" → 原样返回给你</text>

<rect x="24" y="366" width="632" height="46" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="340" y="386" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfe6ee">分界线只有一条：运行时有没有一个会自己校验的对象。</text>
<text x="340" y="403" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">有 → Pydantic 那档；没有 → 另外三道，能力不同，但都不拦人</text>
</svg>
