<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img">
<title>五种智能体范式：从"可枚举"到"开放"的光谱</title>
<desc>四种构建模式按任务确定性排成一条光谱：标准模式管稳定问答，单工作流模式管固定流程，Multi-Agent 管多角色分工，Claw 管开放任务。右侧另标智能工作台不是第五种模式，而是创建入口。</desc>
<defs>
<marker id="ar2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="380" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">五种范式：一条从「可枚举」到「开放」的光谱</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">选模式不是挑功能，是判断这件事「能不能提前写死」</text>

<rect x="44" y="92" width="132" height="96" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="58" y="116" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">标准模式</text>
<text x="58" y="136" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">稳定问答</text>
<text x="58" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">如：客户问</text>
<text x="58" y="175" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">「退货几天到账」</text>

<rect x="196" y="92" width="132" height="96" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="210" y="116" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#8ecbff">单工作流模式</text>
<text x="210" y="136" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">固定流程</text>
<text x="210" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">如：报销单按</text>
<text x="210" y="175" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">顺序走五个节点</text>

<rect x="348" y="92" width="132" height="96" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="362" y="116" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#c9b8ff">Multi-Agent</text>
<text x="362" y="136" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">多角色分工</text>
<text x="362" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">如：一份尽调</text>
<text x="362" y="175" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">分给四个角色查</text>

<rect x="500" y="92" width="132" height="96" rx="7" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
<text x="514" y="116" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ff9e97">Claw 模式</text>
<text x="514" y="136" font-family="system-ui, sans-serif" font-size="9.5" fill="#93a1b1">开放任务</text>
<text x="514" y="160" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">如：自己上网找</text>
<text x="514" y="175" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">资料并写成表格</text>

<path d="M60 216L392 216" fill="none" stroke="#3a4a5e" stroke-width="2"/>
<path d="M392 216L628 216" fill="none" stroke="#3a4a5e" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M626 216L640 216" fill="none" stroke="#6b7a8d" stroke-width="2" marker-end="url(#ar2a)"/>

<path d="M110 188L110 208" fill="none" stroke="#4dabf7" stroke-width="1.4"/>
<path d="M262 188L262 208" fill="none" stroke="#4dabf7" stroke-width="1.4"/>
<path d="M414 188L414 208" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
<path d="M566 188L566 208" fill="none" stroke="#f0655f" stroke-width="1.4"/>

<circle cx="110" cy="216" r="5" fill="#4dabf7"/>
<circle cx="262" cy="216" r="5" fill="#4dabf7"/>
<circle cx="414" cy="216" r="5" fill="#a78bfa"/>
<circle cx="566" cy="216" r="5" fill="#f0655f"/>

<text x="44" y="242" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">任务可枚举 · 结果可验收</text>
<text x="636" y="242" text-anchor="end" font-family="system-ui, sans-serif" font-size="9.5" fill="#7d8b9c">步骤不可预知 · 结果开放</text>

<rect x="392" y="252" width="244" height="52" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.1"/>
<text x="406" y="272" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#9fb0c0">智能工作台：不是第五种模式</text>
<text x="406" y="290" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">是「用自然语言把应用造出来」的创建入口</text>

<text x="44" y="278" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">越往左，越依赖流程控制；越往右，越依赖模型的自主判断</text>
<text x="44" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">选错方向的代价：把开放任务塞进固定流程 → 到处是例外分支</text>

<text x="44" y="340" font-family="system-ui, sans-serif" font-size="10.5" fill="#6f7f91">判断口诀：能写死的写死（工作流），写不死的交给模型（Claw）；中间态的用分工（Multi-Agent）</text>
</svg>
