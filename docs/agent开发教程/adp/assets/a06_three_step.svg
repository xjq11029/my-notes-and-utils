<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img">
<title>三步看图法：一个业务场景到一种组合</title>
<desc>从左到右四步：拿到业务场景，第一步看构建模式（决定运行方式），第二步看核心能力组件（决定能力边界），第三步看 AI Model（决定智能上限），最后得到一个"模式 + 组件 + 模型"的组合。</desc>
<defs>
<marker id="ar6a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="350" fill="#111721"/>

<text x="34" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#dfe6ee">三步看图法：从一句需求到一个组合</text>
<text x="34" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#7d8b9c">顺序不能换——先定怎么跑，再定要什么能力，最后才挑模型</text>

<rect x="24" y="108" width="108" height="76" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="78" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9fb0c0">业务场景</text>
<text x="78" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">「做个能答</text>
<text x="78" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#7d8b9c">政策的助手」</text>

<path d="M132 146L150 146" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6a)"/>

<rect x="152" y="108" width="148" height="76" rx="7" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
<text x="226" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8ecbff">① 看构建模式</text>
<text x="226" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">步骤能提前写死吗？</text>
<text x="226" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">决定：怎么运行</text>

<path d="M300 146L318 146" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6a)"/>

<rect x="320" y="108" width="148" height="76" rx="7" fill="#241f38" stroke="#a78bfa" stroke-width="1.3"/>
<text x="394" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c9b8ff">② 看核心能力组件</text>
<text x="394" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">缺的是知识、动作还是流程？</text>
<text x="394" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">决定：能做什么</text>

<path d="M468 146L486 146" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6a)"/>

<rect x="488" y="108" width="148" height="76" rx="7" fill="#2a2320" stroke="#e8a34b" stroke-width="1.3"/>
<text x="562" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f3c47a">③ 看 AI Model</text>
<text x="562" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#93a1b1">要理解为先还是生成为主？</text>
<text x="562" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#6f7f91">决定：智能上限</text>

<text x="34" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#93a1b1">为什么顺序不能换：</text>
<text x="34" y="232" font-family="system-ui, sans-serif" font-size="10" fill="#6f7f91">先挑模型，等于先定发动机再造车——模式错了，模型再强也救不回来</text>
<text x="34" y="252" font-family="system-ui, sans-serif" font-size="10" fill="#6f7f91">先定组件也不行：同一对 RAG + 模型，放进单工作流和标准模式，跑起来的形态完全不同</text>

<path d="M340 268L340 288" fill="none" stroke="#6b7a8d" stroke-width="1.5" marker-end="url(#ar6a)"/>

<rect x="24" y="292" width="632" height="40" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.2"/>
<text x="340" y="317" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9fb0c0">得到组合：标准模式 + RAG + LLM　→　落到具体应用：知识问答助手</text>
</svg>
