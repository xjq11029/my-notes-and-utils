<svg viewBox="0 0 680 498" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="稀疏 MoE 的两个口径：稠密模型每次前向都用满全部参数，MoE 由路由器为每个 token 只放行少数专家、其余专家不参与计算；总参数决定模型文件与显存，激活参数决定每次前向的算力与成本">
  <rect x="0" y="0" width="680" height="498" fill="#111721"/>
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4a5a6c"/>
    </marker>
    <marker id="ar3t" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#2dd4a7"/>
    </marker>
  </defs>

  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">稀疏 MoE：参数量为什么有两个口径</text>
  <text x="340" y="42" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">总参数决定「装得下吗」，激活参数决定「算得起吗」</text>

  <text x="24" y="74" fill="#93a1b1" font-size="11" font-weight="650" font-family="sans-serif">① 稠密模型 Dense：每次都全员上阵</text>

  <rect x="24" y="84" width="110" height="52" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="79" y="110" fill="#dfe6ee" font-size="12" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">输入 token</text>

  <line x1="136" y1="110" x2="154" y2="110" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>

  <rect x="158" y="84" width="210" height="52" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="263" y="110" fill="#4dabf7" font-size="12.5" font-weight="650" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">FFN · 全部参数都参与</text>

  <line x1="370" y1="110" x2="388" y2="110" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>

  <rect x="392" y="84" width="150" height="52" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="467" y="110" fill="#dfe6ee" font-size="12" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">输出概率分布</text>

  <text x="340" y="154" fill="#6b7a8d" font-size="10.5" text-anchor="middle" font-family="sans-serif">每次前向都用满全部参数 → 总参数 = 激活参数</text>

  <text x="24" y="190" fill="#93a1b1" font-size="11" font-weight="650" font-family="sans-serif">② 稀疏 MoE：路由器挑几个专家上阵</text>

  <rect x="24" y="232" width="110" height="52" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="79" y="258" fill="#dfe6ee" font-size="12" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">输入 token</text>

  <line x1="136" y1="258" x2="154" y2="258" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>

  <rect x="158" y="232" width="150" height="52" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="233" y="250" fill="#4dabf7" font-size="12" font-weight="650" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">路由器 Router</text>
  <text x="233" y="269" fill="#7fa3c9" font-size="10" text-anchor="middle" dominant-baseline="central" font-family="sans-serif">给这个 token 打分</text>

  <line x1="308" y1="258" x2="336" y2="190" stroke="#3a4a5e" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ar3)"/>
  <line x1="308" y1="258" x2="336" y2="224" stroke="#2dd4a7" stroke-width="1.6" marker-end="url(#ar3t)"/>
  <line x1="308" y1="258" x2="336" y2="258" stroke="#3a4a5e" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ar3)"/>
  <line x1="308" y1="258" x2="336" y2="292" stroke="#3a4a5e" stroke-width="1.1" stroke-dasharray="3 3" marker-end="url(#ar3)"/>
  <line x1="308" y1="258" x2="336" y2="326" stroke="#2dd4a7" stroke-width="1.6" marker-end="url(#ar3t)"/>

  <rect x="340" y="176" width="170" height="28" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="356" y="190" fill="#6b7a8d" font-size="11" dominant-baseline="central" font-family="sans-serif">专家 1</text>
  <text x="494" y="190" fill="#6b7a8d" font-size="10.5" text-anchor="end" dominant-baseline="central" font-family="sans-serif">跳过</text>

  <rect x="340" y="210" width="170" height="28" rx="7" fill="#122b26" stroke="#2dd4a7" stroke-width="1.4"/>
  <text x="356" y="224" fill="#2dd4a7" font-size="11" dominant-baseline="central" font-family="sans-serif">专家 2</text>
  <text x="494" y="224" fill="#2dd4a7" font-size="10.5" text-anchor="end" dominant-baseline="central" font-family="sans-serif">参与计算</text>

  <rect x="340" y="244" width="170" height="28" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="356" y="258" fill="#6b7a8d" font-size="11" dominant-baseline="central" font-family="sans-serif">专家 3</text>
  <text x="494" y="258" fill="#6b7a8d" font-size="10.5" text-anchor="end" dominant-baseline="central" font-family="sans-serif">跳过</text>

  <rect x="340" y="278" width="170" height="28" rx="7" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="356" y="292" fill="#6b7a8d" font-size="11" dominant-baseline="central" font-family="sans-serif">专家 4</text>
  <text x="494" y="292" fill="#6b7a8d" font-size="10.5" text-anchor="end" dominant-baseline="central" font-family="sans-serif">跳过</text>

  <rect x="340" y="312" width="170" height="28" rx="7" fill="#122b26" stroke="#2dd4a7" stroke-width="1.4"/>
  <text x="356" y="326" fill="#2dd4a7" font-size="11" dominant-baseline="central" font-family="sans-serif">专家 5</text>
  <text x="494" y="326" fill="#2dd4a7" font-size="10.5" text-anchor="end" dominant-baseline="central" font-family="sans-serif">参与计算</text>

  <text x="340" y="358" fill="#6b7a8d" font-size="10.5" text-anchor="middle" font-family="sans-serif">每个 token 各自选一次；没被选中的专家这次完全不动（示意，实际激活比例远低于此）</text>

  <rect x="24" y="374" width="308" height="84" rx="10" fill="#122b26" stroke="#2dd4a7" stroke-width="1.4"/>
  <text x="44" y="400" fill="#2dd4a7" font-size="12.5" font-weight="650" font-family="sans-serif">总参数 Total</text>
  <text x="44" y="424" fill="#7fa89c" font-size="10.5" font-family="sans-serif">= 所有专家的数字全加起来</text>
  <text x="44" y="444" fill="#7fa89c" font-size="10.5" font-family="sans-serif">→ 模型文件多大、显存要装多少</text>

  <rect x="348" y="374" width="308" height="84" rx="10" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="368" y="400" fill="#e8a34b" font-size="12.5" font-weight="650" font-family="sans-serif">激活参数 Activated</text>
  <text x="368" y="424" fill="#c9a86a" font-size="10.5" font-family="sans-serif">= 每次真正被选中的那几个</text>
  <text x="368" y="444" fill="#c9a86a" font-size="10.5" font-family="sans-serif">→ 每次前向的算力、单 token 成本</text>

  <text x="340" y="487" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 3</text>
</svg>
