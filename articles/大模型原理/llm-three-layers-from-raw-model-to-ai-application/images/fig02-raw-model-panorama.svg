<svg viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="基础模型全景：token 列表输入，输出概率分布，权重矩阵决定参数量，训练微调与 GPU 并行运算共同塑造模型文件">
  <rect x="0" y="0" width="680" height="372" fill="#111721"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4a5a6c"/>
    </marker>
  </defs>

  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">基础模型：一个函数，一个矩阵</text>
  <text x="340" y="42" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">函数内部没有别的东西——参数量就是矩阵里数字的个数</text>

  <text x="24" y="96" fill="#93a1b1" font-size="10.5" font-family="sans-serif">中文 1 字 ≈ 1.5 token · 英文 1 词 ≈ 1.3 token</text>

  <rect x="24" y="110" width="190" height="76" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="119" y="134" fill="#dfe6ee" font-size="12.5" font-weight="650" text-anchor="middle" font-family="sans-serif">Token List</text>
  <text x="119" y="155" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">[3, 6, 12, 767665, 7878]</text>
  <text x="119" y="172" fill="#6b7a8d" font-size="10.5" text-anchor="middle" font-family="sans-serif">示意值，非真实分词结果</text>

  <rect x="250" y="110" width="180" height="76" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="340" y="134" fill="#4dabf7" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">Raw Model</text>
  <text x="340" y="155" fill="#7fa3c9" font-size="11.5" text-anchor="middle" font-family="sans-serif">基础模型</text>
  <text x="340" y="174" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">f(token 列表) → 概率分布</text>

  <rect x="466" y="110" width="190" height="76" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="561" y="134" fill="#dfe6ee" font-size="12.5" font-weight="650" text-anchor="middle" font-family="sans-serif">概率分布</text>
  <text x="561" y="155" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">{15: 0.7, 288: 0.2, …}</text>
  <text x="561" y="172" fill="#6b7a8d" font-size="10.5" text-anchor="middle" font-family="sans-serif">没有对话，只有可能性</text>

  <line x1="216" y1="148" x2="248" y2="148" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="432" y1="148" x2="464" y2="148" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar2)"/>

  <line x1="332" y1="188" x2="332" y2="230" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar2)"/>
  <line x1="348" y1="230" x2="348" y2="188" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar2)"/>

  <rect x="24" y="232" width="156" height="60" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="102" y="258" fill="#e8a34b" font-size="12.5" font-weight="650" text-anchor="middle" font-family="sans-serif">训练 / 微调</text>
  <text x="102" y="278" fill="#c9a86a" font-size="10.5" text-anchor="middle" font-family="sans-serif">原材料：语料 corpus</text>
  <line x1="182" y1="262" x2="198" y2="262" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar2)"/>

  <rect x="200" y="232" width="280" height="60" rx="8" fill="#122b26" stroke="#2dd4a7" stroke-width="1.4"/>
  <text x="340" y="258" fill="#2dd4a7" font-size="12.5" font-weight="650" text-anchor="middle" font-family="sans-serif">权重矩阵 Weight Matrix</text>
  <text x="340" y="278" fill="#7fa89c" font-size="10.5" text-anchor="middle" font-family="sans-serif">参数量 = 矩阵中数字的个数（7B = 70 亿）</text>

  <rect x="500" y="232" width="156" height="60" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
  <text x="578" y="249" fill="#f0655f" font-size="12.5" font-weight="650" text-anchor="middle" font-family="sans-serif">GPU 并行运算</text>
  <text x="578" y="266" fill="#9c7b7b" font-size="10.5" text-anchor="middle" font-family="sans-serif">浮点不满足结合律</text>
  <text x="578" y="281" fill="#9c7b7b" font-size="10.5" text-anchor="middle" font-family="sans-serif">→ 结果有微小抖动</text>
  <line x1="498" y1="262" x2="482" y2="262" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar2)"/>

  <text x="340" y="322" fill="#93a1b1" font-size="11.5" text-anchor="middle" font-family="sans-serif">模型文件 ≈ 权重矩阵 + 配置文件</text>

  <text x="340" y="361" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 2</text>
</svg>
