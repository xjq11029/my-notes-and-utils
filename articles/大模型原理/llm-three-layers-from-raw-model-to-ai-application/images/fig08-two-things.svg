<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="基础模型之上只能做两件事：模型服务层与 AI 应用层各自决定给模型输入什么、如何处理输出">
  <rect x="0" y="0" width="680" height="400" fill="#111721"/>
  <defs>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4a5a6c"/>
    </marker>
  </defs>

  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">基础模型之上，只能玩两件事</text>
  <text x="340" y="42" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">这是由「输入 → 数学运算 → 输出」的结构决定的，玩不出第三件事</text>

  <text x="16" y="130" fill="#6b7a8d" font-size="11.5" font-family="sans-serif">模型服务</text>
  <text x="16" y="274" fill="#6b7a8d" font-size="11.5" font-family="sans-serif">AI 应用</text>

  <rect x="76" y="88" width="160" height="76" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="156" y="112" fill="#4dabf7" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">① 给模型输入什么</text>
  <text x="156" y="132" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">前处理</text>
  <text x="156" y="150" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">提示词注入 · 分词</text>

  <rect x="448" y="88" width="200" height="76" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="548" y="112" fill="#e8a34b" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">② 如何处理输出</text>
  <text x="548" y="132" fill="#c9a86a" font-size="10.5" text-anchor="middle" font-family="sans-serif">后处理</text>
  <text x="548" y="150" fill="#c9a86a" font-size="10.5" text-anchor="middle" font-family="sans-serif">反分词 · 合规检查</text>

  <rect x="268" y="88" width="144" height="220" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="340" y="190" fill="#dfe6ee" font-size="12.5" font-weight="650" text-anchor="middle" font-family="sans-serif">Raw Model</text>
  <text x="340" y="210" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">基础模型</text>

  <rect x="76" y="232" width="160" height="76" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="156" y="256" fill="#4dabf7" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">① 给模型输入什么</text>
  <text x="156" y="276" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">决定发什么消息</text>
  <text x="156" y="294" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">（甚至自动追加）</text>

  <rect x="448" y="232" width="200" height="76" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="548" y="256" fill="#e8a34b" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">② 如何处理输出</text>
  <text x="548" y="276" fill="#c9a86a" font-size="10.5" text-anchor="middle" font-family="sans-serif">拿到结果做后续处理</text>
  <text x="548" y="294" fill="#c9a86a" font-size="10.5" text-anchor="middle" font-family="sans-serif">（甚至再发起新请求）</text>

  <line x1="240" y1="126" x2="264" y2="126" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar5)"/>
  <line x1="416" y1="126" x2="444" y2="126" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar5)"/>
  <line x1="240" y1="270" x2="264" y2="270" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar5)"/>
  <line x1="416" y1="270" x2="444" y2="270" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar5)"/>

  <text x="340" y="356" fill="#93a1b1" font-size="11.5" text-anchor="middle" font-family="sans-serif">所有新概念，说到底都在回答这两问</text>

  <text x="340" y="389" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 8</text>
</svg>
