<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="采样三参数示意：概率分布柱状图配合 top-P 截断框，下方说明 temperature、top-K、top-P 各自的作用">
  <rect x="0" y="0" width="680" height="440" fill="#111721"/>

  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">采样三参数：先截断候选集，再在候选集内随机</text>

  <text x="56" y="44" fill="#2dd4a7" font-size="10.5" font-family="sans-serif">top-P = 0.8 → 累计 0.30+0.25+0.20+0.15 = 0.90 ≥ 0.8，取前 4 个</text>

  <rect x="56" y="52" width="218" height="126" rx="6" fill="none" stroke="#2dd4a7" stroke-width="1.4" stroke-dasharray="5 4"/>

  <line x1="56" y1="170" x2="498" y2="170" stroke="#3a4a5e" stroke-width="1.3"/>

  <rect x="64" y="140" width="40" height="30" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="84" y="134" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.30</text>
  <text x="84" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">15</text>

  <rect x="118" y="145" width="40" height="25" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="138" y="139" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.25</text>
  <text x="138" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">288</text>

  <rect x="172" y="150" width="40" height="20" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="192" y="144" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.20</text>
  <text x="192" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">41</text>

  <rect x="226" y="155" width="40" height="15" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="246" y="149" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.15</text>
  <text x="246" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">902</text>

  <rect x="280" y="165" width="40" height="5" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="300" y="159" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.05</text>
  <text x="300" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">7</text>

  <rect x="334" y="166" width="40" height="4" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="354" y="160" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.03</text>
  <text x="354" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">66</text>

  <rect x="388" y="166" width="40" height="4" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="408" y="160" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.01</text>
  <text x="408" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">310</text>

  <rect x="442" y="166" width="40" height="4" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="462" y="160" fill="#7fa3c9" font-size="10.5" text-anchor="middle" font-family="sans-serif">0.01</text>
  <text x="462" y="190" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">884</text>

  <rect x="40" y="210" width="600" height="44" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="52" y="237" fill="#4dabf7" font-size="11.5" font-weight="650" font-family="sans-serif">temperature 管随机性</text>
  <text x="190" y="237" fill="#7fa3c9" font-size="10.5" font-family="sans-serif">0 = 直接取概率最大的那个；2 = 分布被大幅拉平（真正的完全随机要趋于无穷）</text>

  <rect x="40" y="266" width="600" height="44" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="52" y="293" fill="#e8a34b" font-size="11.5" font-weight="650" font-family="sans-serif">top-K 管候选集大小</text>
  <text x="170" y="293" fill="#c9a86a" font-size="10.5" font-family="sans-serif">按概率排序取前 K 个，候选集外绝不出现</text>

  <rect x="40" y="322" width="600" height="44" rx="8" fill="#122b26" stroke="#2dd4a7" stroke-width="1.4"/>
  <text x="52" y="349" fill="#2dd4a7" font-size="11.5" font-weight="650" font-family="sans-serif">top-P 管累计概率</text>
  <text x="160" y="349" fill="#7fa89c" font-size="10.5" font-family="sans-serif">从高到低累加到 P 为止截断（核采样）；OpenAI 接口目前只保留 top-P</text>

  <text x="340" y="390" fill="#f0655f" font-size="11.5" text-anchor="middle" font-family="sans-serif">先截断、再随机——top-K / top-P 决定「能选谁」，temperature 决定「怎么选」</text>

  <text x="340" y="429" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 7</text>
</svg>
