<svg viewBox="0 0 680 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="自回归循环流程图：输入分词结果，反复调用基础模型取下一个 token 并追加回输入，直到结束 token 跳出循环；下方用三轮对比说明 KV Cache——input 每轮都在变长，但只有新增的那一个 token 需要真正计算，前面已算过的 Key / Value 直接取用">
  <rect x="0" y="0" width="680" height="590" fill="#111721"/>
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#4a5a6c"/>
    </marker>
  </defs>

  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">自回归：输出不断追加回输入，直到结束 token</text>
  <text x="340" y="42" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">每生成一个 token 都要再调用一次模型</text>

  <rect x="40" y="62" width="300" height="44" rx="8" fill="#1b2532" stroke="#3a4a5e" stroke-width="1.3"/>
  <text x="190" y="89" fill="#dfe6ee" font-size="11.5" text-anchor="middle" font-family="sans-serif">input = 分词结果 · output = []</text>

  <rect x="40" y="124" width="300" height="44" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="190" y="151" fill="#4dabf7" font-size="11.5" text-anchor="middle" font-family="sans-serif">prob = raw_model(input)</text>

  <rect x="40" y="186" width="300" height="44" rx="8" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.4"/>
  <text x="190" y="213" fill="#4dabf7" font-size="11.5" text-anchor="middle" font-family="sans-serif">token = pickToken(prob, options)</text>

  <polygon points="190,238 340,271 190,304 40,271" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="190" y="275" fill="#e8a34b" font-size="11.5" text-anchor="middle" font-family="sans-serif">isOver(token)?</text>

  <rect x="40" y="330" width="300" height="44" rx="8" fill="#122b26" stroke="#2dd4a7" stroke-width="1.4"/>
  <text x="190" y="357" fill="#2dd4a7" font-size="11.5" text-anchor="middle" font-family="sans-serif">output.push(token) · input.push(token)</text>

  <line x1="190" y1="106" x2="190" y2="122" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="190" y1="168" x2="190" y2="184" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="190" y1="230" x2="190" y2="238" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>
  <line x1="190" y1="304" x2="190" y2="329" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>
  <text x="200" y="321" fill="#93a1b1" font-size="10.5" font-family="sans-serif">否</text>

  <line x1="342" y1="270" x2="398" y2="270" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>
  <text x="396" y="258" fill="#93a1b1" font-size="10.5" text-anchor="end" font-family="sans-serif">是（结束 token）</text>
  <rect x="400" y="248" width="240" height="44" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
  <text x="520" y="275" fill="#f0655f" font-size="11.5" text-anchor="middle" font-family="sans-serif">break → output 即本次回复</text>

  <path d="M40,352 H20 V146 H39" fill="none" stroke="#4a5a6c" stroke-width="1.4" marker-end="url(#ar3)"/>
  <text x="11" y="242" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">循</text>
  <text x="11" y="256" fill="#93a1b1" font-size="10.5" text-anchor="middle" font-family="sans-serif">环</text>

  <rect x="400" y="330" width="240" height="62" rx="8" fill="#2a2320" stroke="#e8a34b" stroke-width="1.4"/>
  <text x="520" y="351" fill="#e8a34b" font-size="11.5" font-weight="650" text-anchor="middle" font-family="sans-serif">输出为什么更贵</text>
  <text x="520" y="368" fill="#c9a86a" font-size="10.5" text-anchor="middle" font-family="sans-serif">输入一次性并行处理完；</text>
  <text x="520" y="383" fill="#c9a86a" font-size="10.5" text-anchor="middle" font-family="sans-serif">输出每步都要再走一次前向</text>

  <line x1="40" y1="404" x2="640" y2="404" stroke="#3a4a5e" stroke-width="1.3"/>

  <text x="40" y="426" fill="#2dd4a7" font-size="10.5" font-family="sans-serif">KV Cache：input 每轮都在变长，但只有新增的那一个 token 需要真算</text>

  <text x="40" y="453" fill="#93a1b1" font-size="10.5" font-family="sans-serif">第 1 轮</text>
  <rect x="100" y="438" width="30" height="22" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
  <rect x="133" y="438" width="30" height="22" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
  <rect x="166" y="438" width="30" height="22" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
  <text x="280" y="453" fill="#4dabf7" font-size="10.5" font-family="sans-serif">全是新的 → 整段计算</text>

  <text x="40" y="485" fill="#93a1b1" font-size="10.5" font-family="sans-serif">第 2 轮</text>
  <rect x="100" y="470" width="30" height="22" rx="3" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
  <rect x="133" y="470" width="30" height="22" rx="3" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
  <rect x="166" y="470" width="30" height="22" rx="3" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
  <rect x="199" y="470" width="30" height="22" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
  <text x="280" y="485" fill="#2dd4a7" font-size="10.5" font-family="sans-serif">前 3 个取缓存 · 只算新增的 1 个</text>

  <text x="40" y="517" fill="#93a1b1" font-size="10.5" font-family="sans-serif">第 3 轮</text>
  <rect x="100" y="502" width="30" height="22" rx="3" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
  <rect x="133" y="502" width="30" height="22" rx="3" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
  <rect x="166" y="502" width="30" height="22" rx="3" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
  <rect x="199" y="502" width="30" height="22" rx="3" fill="#122b26" stroke="#2dd4a7" stroke-width="1.2"/>
  <rect x="232" y="502" width="30" height="22" rx="3" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.2"/>
  <text x="280" y="517" fill="#2dd4a7" font-size="10.5" font-family="sans-serif">前 4 个取缓存 · 只算新增的 1 个</text>

  <text x="340" y="552" fill="#e8a34b" font-size="11.5" text-anchor="middle" font-family="sans-serif">省掉的是重复计算 —— 但每轮仍要再走一次网络，所以输出照样比输入贵</text>

  <text x="340" y="579" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 4</text>
</svg>
