<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="缓存命中与未命中的对比：前缀完全一致时前三段复用缓存、按 0.1 倍计费，只对最后一段做 prefill；前缀里改一个字，则从改动位置起整段作废，这一段要重新计算并按 1.25 倍计费——写入价取代输入价，不叠加">
  <rect x="0" y="0" width="680" height="440" fill="#111721"/>

  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">缓存命中：前缀一字不差就复用，差一个 token 就整段作废</text>

  <text x="40" y="44" fill="#2dd4a7" font-size="10.5" font-family="sans-serif">① 前缀完全一致 → 命中</text>

  <rect x="40" y="58" width="150" height="44" rx="5" fill="#122b26" stroke="#2dd4a7" stroke-width="1.3"/>
  <text x="115" y="85" fill="#2dd4a7" font-size="11" text-anchor="middle" font-family="sans-serif">系统提示词</text>

  <rect x="194" y="58" width="118" height="44" rx="5" fill="#122b26" stroke="#2dd4a7" stroke-width="1.3"/>
  <text x="253" y="85" fill="#2dd4a7" font-size="11" text-anchor="middle" font-family="sans-serif">工具定义</text>

  <rect x="316" y="58" width="118" height="44" rx="5" fill="#122b26" stroke="#2dd4a7" stroke-width="1.3"/>
  <text x="375" y="85" fill="#2dd4a7" font-size="11" text-anchor="middle" font-family="sans-serif">历史消息</text>

  <rect x="438" y="58" width="118" height="44" rx="5" fill="#1d2b3d" stroke="#4dabf7" stroke-width="1.3"/>
  <text x="497" y="85" fill="#4dabf7" font-size="11" text-anchor="middle" font-family="sans-serif">本次问题</text>

  <text x="237" y="116" fill="#2dd4a7" font-size="10.5" text-anchor="middle" font-family="sans-serif">复用缓存 · 0.1×</text>
  <text x="497" y="116" fill="#4dabf7" font-size="10.5" text-anchor="middle" font-family="sans-serif">新内容 · 1×</text>

  <rect x="40" y="134" width="600" height="40" rx="8" fill="#122b26" stroke="#2dd4a7" stroke-width="1.4"/>
  <text x="56" y="159" fill="#7fa89c" font-size="11" font-family="sans-serif">Key / Value 直接取用，只对最后一段做 prefill —— 前三段一分钱计算量都没花</text>

  <line x1="40" y1="196" x2="640" y2="196" stroke="#3a4a5e" stroke-width="1.3"/>

  <text x="40" y="210" fill="#f0655f" font-size="10.5" font-family="sans-serif">② 前缀里改了一个字 → 从改动处起整段作废</text>

  <polygon points="253,218 247,226 259,226" fill="#f0655f"/>

  <rect x="40" y="228" width="150" height="44" rx="5" fill="#122b26" stroke="#2dd4a7" stroke-width="1.3"/>
  <text x="115" y="255" fill="#2dd4a7" font-size="11" text-anchor="middle" font-family="sans-serif">系统提示词</text>

  <rect x="194" y="228" width="118" height="44" rx="5" fill="#2a1f24" stroke="#f0655f" stroke-width="1.7"/>
  <text x="253" y="255" fill="#f0655f" font-size="11" text-anchor="middle" font-family="sans-serif">工具定义</text>

  <rect x="316" y="228" width="118" height="44" rx="5" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
  <text x="375" y="255" fill="#f0655f" font-size="11" text-anchor="middle" font-family="sans-serif">历史消息</text>

  <rect x="438" y="228" width="118" height="44" rx="5" fill="#2a1f24" stroke="#f0655f" stroke-width="1.3"/>
  <text x="497" y="255" fill="#f0655f" font-size="11" text-anchor="middle" font-family="sans-serif">本次问题</text>

  <text x="115" y="286" fill="#2dd4a7" font-size="10.5" text-anchor="middle" font-family="sans-serif">仍命中 · 0.1×</text>
  <text x="375" y="286" fill="#f0655f" font-size="10.5" text-anchor="middle" font-family="sans-serif">作废 · 重算，按 1.25× 写入</text>

  <rect x="40" y="304" width="600" height="40" rx="8" fill="#2a1f24" stroke="#f0655f" stroke-width="1.4"/>
  <text x="56" y="329" fill="#c98a86" font-size="11" font-family="sans-serif">改动位置之后的缓存全部失效，整段重新 prefill——按 1.25× 计费，写入价取代输入价、不叠加</text>

  <text x="340" y="372" fill="#e8a34b" font-size="11.5" text-anchor="middle" font-family="sans-serif">同样的内容、同样的模型——只因排列顺序不同，账单差了近十倍</text>

  <text x="340" y="429" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 6</text>
</svg>
