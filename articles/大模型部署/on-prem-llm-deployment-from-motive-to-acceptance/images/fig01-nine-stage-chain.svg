<svg viewBox="0 0 680 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="私有化部署的九段链路：动机、算力、模型、软件栈、架构、部署、安全、运维、验收">
  <rect x="0" y="0" width="680" height="424" fill="#111721"/>

  <text x="340" y="24" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">私有化部署是一条九段链路，不是「买张卡把模型跑起来」</text>
  <text x="340" y="44" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">顺序不能颠倒：先答清动机与负载，再谈算力；跳过前面，后面全用返工还</text>

  <!-- row 1 -->
  <rect x="24" y="70" width="196" height="90" rx="9" fill="#18202b" stroke="#4dabf7" stroke-width="1.2"/>
  <circle cx="42" cy="92" r="10" fill="#4dabf7"/>
  <text x="42" y="96" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="60" y="96" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">动机</text>
  <text x="36" y="120" fill="#93a1b1" font-size="10.5" font-family="sans-serif">数据不能出域？嫌 API 贵？</text>
  <text x="36" y="138" fill="#93a1b1" font-size="10.5" font-family="sans-serif">要离线？要可审计？</text>

  <rect x="242" y="70" width="196" height="90" rx="9" fill="#18202b" stroke="#4dabf7" stroke-width="1.2"/>
  <circle cx="260" cy="92" r="10" fill="#4dabf7"/>
  <text x="260" y="96" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">2</text>
  <text x="278" y="96" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">算力</text>
  <text x="254" y="120" fill="#93a1b1" font-size="10.5" font-family="sans-serif">显存是唯一的硬门槛</text>
  <text x="254" y="138" fill="#93a1b1" font-size="10.5" font-family="sans-serif">不够不是慢，是跑不起来</text>

  <rect x="460" y="70" width="196" height="90" rx="9" fill="#18202b" stroke="#2dd4a7" stroke-width="1.2"/>
  <circle cx="478" cy="92" r="10" fill="#2dd4a7"/>
  <text x="478" y="96" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">3</text>
  <text x="496" y="96" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">模型</text>
  <text x="472" y="120" fill="#93a1b1" font-size="10.5" font-family="sans-serif">按任务分工，不找「最强」</text>
  <text x="472" y="138" fill="#93a1b1" font-size="10.5" font-family="sans-serif">先查许可证，再谈商用</text>

  <!-- row 2 -->
  <rect x="24" y="172" width="196" height="90" rx="9" fill="#18202b" stroke="#2dd4a7" stroke-width="1.2"/>
  <circle cx="42" cy="194" r="10" fill="#2dd4a7"/>
  <text x="42" y="198" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">4</text>
  <text x="60" y="198" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">软件栈</text>
  <text x="36" y="222" fill="#93a1b1" font-size="10.5" font-family="sans-serif">同一个模型换个引擎</text>
  <text x="36" y="240" fill="#93a1b1" font-size="10.5" font-family="sans-serif">吞吐差 3~5 倍</text>

  <rect x="242" y="172" width="196" height="90" rx="9" fill="#18202b" stroke="#e8a34b" stroke-width="1.2"/>
  <circle cx="260" cy="194" r="10" fill="#e8a34b"/>
  <text x="260" y="198" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">5</text>
  <text x="278" y="198" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">架构</text>
  <text x="254" y="222" fill="#93a1b1" font-size="10.5" font-family="sans-serif">五层职责 + 网络分区</text>
  <text x="254" y="240" fill="#93a1b1" font-size="10.5" font-family="sans-serif">推理端口绝不监听 0.0.0.0</text>

  <rect x="460" y="172" width="196" height="90" rx="9" fill="#18202b" stroke="#e8a34b" stroke-width="1.2"/>
  <circle cx="478" cy="194" r="10" fill="#e8a34b"/>
  <text x="478" y="198" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">6</text>
  <text x="496" y="198" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">部署</text>
  <text x="472" y="222" fill="#93a1b1" font-size="10.5" font-family="sans-serif">三档：半天 / 一下午 / 一季度</text>
  <text x="472" y="240" fill="#93a1b1" font-size="10.5" font-family="sans-serif">内网离线要「三个搬」</text>

  <!-- row 3 -->
  <rect x="24" y="274" width="196" height="90" rx="9" fill="#18202b" stroke="#f0655f" stroke-width="1.2"/>
  <circle cx="42" cy="296" r="10" fill="#f0655f"/>
  <text x="42" y="300" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">7</text>
  <text x="60" y="300" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">安全</text>
  <text x="36" y="324" fill="#93a1b1" font-size="10.5" font-family="sans-serif">机器搬进内网</text>
  <text x="36" y="342" fill="#93a1b1" font-size="10.5" font-family="sans-serif">只是把风险搬到自己家</text>

  <rect x="242" y="274" width="196" height="90" rx="9" fill="#18202b" stroke="#f0655f" stroke-width="1.2"/>
  <circle cx="260" cy="296" r="10" fill="#f0655f"/>
  <text x="260" y="300" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">8</text>
  <text x="278" y="300" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">运维</text>
  <text x="254" y="324" fill="#93a1b1" font-size="10.5" font-family="sans-serif">五个指标 + 降级三板斧</text>
  <text x="254" y="342" fill="#93a1b1" font-size="10.5" font-family="sans-serif">上线只是开始</text>

  <rect x="460" y="274" width="196" height="90" rx="9" fill="#18202b" stroke="#b197fc" stroke-width="1.2"/>
  <circle cx="478" cy="296" r="10" fill="#b197fc"/>
  <text x="478" y="300" fill="#0f1620" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">9</text>
  <text x="496" y="300" fill="#dfe6ee" font-size="12.5" font-weight="700" font-family="sans-serif">验收</text>
  <text x="472" y="324" fill="#93a1b1" font-size="10.5" font-family="sans-serif">性能基线 + 100 题评测</text>
  <text x="472" y="342" fill="#93a1b1" font-size="10.5" font-family="sans-serif">证不成，就不算成</text>

  <text x="340" y="386" fill="#6b7a8d" font-size="10.5" text-anchor="middle" font-family="sans-serif">返工代价沿链路单调递增：第 1 步错，第 9 步还；第 6 步错，钱和时间一起还</text>
  <text x="340" y="414" fill="#6b7a8d" font-size="11" text-anchor="middle" font-family="sans-serif">图 1</text>
</svg>
