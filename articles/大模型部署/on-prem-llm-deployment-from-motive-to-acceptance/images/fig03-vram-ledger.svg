<svg viewBox="0 0 680 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="显存账本：权重、KV Cache 与框架开销的堆叠，以 Qwen3.8-27B 4-bit 为例">
  <rect x="0" y="0" width="680" height="404" fill="#111721"/>

  <text x="340" y="24" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">显存不是「大概够」，是一笔可以算清的账</text>
  <text x="340" y="44" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">权重决定能不能装下，KV Cache 决定能同时服务几个人</text>

  <!-- formula -->
  <rect x="24" y="60" width="632" height="96" rx="8" fill="#151d27" stroke="#2c3949" stroke-width="1"/>
  <text x="40" y="82" fill="#4dabf7" font-size="11" font-weight="700" font-family="sans-serif">公式</text>
  <text x="40" y="104" fill="#dfe6ee" font-size="11.5" font-family="sans-serif">所需显存 ≈ 权重 + KV Cache + 框架开销</text>
  <text x="40" y="126" fill="#dfe6ee" font-size="11.5" font-family="sans-serif">权重(GB) ≈ 参数量(B) × 每参数字节　　Q4_K_M 实测约 0.6 字节/参数，不是 0.5</text>
  <text x="40" y="148" fill="#dfe6ee" font-size="11.5" font-family="sans-serif">KV Cache ≈ 2 × 层数 × KV 头数 × head_dim × 字节 × token 总数</text>

  <!-- bar -->
  <text x="40" y="184" fill="#93a1b1" font-size="10.5" font-family="sans-serif">Qwen3.8-27B · 4-bit · 4K 上下文 · 8 路并发（示意）</text>

  <rect x="40" y="196" width="319" height="34" fill="#2b4a6b" stroke="#4dabf7" stroke-width="1"/>
  <rect x="359" y="196" width="75" height="34" fill="#1d4a3f" stroke="#2dd4a7" stroke-width="1"/>
  <rect x="434" y="196" width="38" height="34" fill="#4a3a22" stroke="#e8a34b" stroke-width="1"/>

  <text x="199" y="218" fill="#dfe6ee" font-size="11" text-anchor="middle" font-family="sans-serif">权重 17 GB</text>
  <text x="396" y="218" fill="#2dd4a7" font-size="10.5" text-anchor="middle" font-family="sans-serif">KV 4</text>
  <text x="453" y="246" fill="#e8a34b" font-size="10" text-anchor="middle" font-family="sans-serif">开销 2</text>

  <!-- scale -->
  <line x1="40" y1="236" x2="640" y2="236" stroke="#3a4757" stroke-width="1"/>
  <line x1="190" y1="232" x2="190" y2="240" stroke="#3a4757" stroke-width="1"/>
  <line x1="340" y1="232" x2="340" y2="240" stroke="#3a4757" stroke-width="1"/>
  <line x1="490" y1="232" x2="490" y2="240" stroke="#3a4757" stroke-width="1"/>
  <line x1="640" y1="232" x2="640" y2="240" stroke="#3a4757" stroke-width="1"/>
  <text x="40" y="254" fill="#6b7a8d" font-size="9.5" text-anchor="middle" font-family="sans-serif">0</text>
  <text x="190" y="254" fill="#6b7a8d" font-size="9.5" text-anchor="middle" font-family="sans-serif">8</text>
  <text x="340" y="254" fill="#6b7a8d" font-size="9.5" text-anchor="middle" font-family="sans-serif">16</text>
  <text x="490" y="254" fill="#6b7a8d" font-size="9.5" text-anchor="middle" font-family="sans-serif">24</text>
  <text x="640" y="254" fill="#6b7a8d" font-size="9.5" text-anchor="middle" font-family="sans-serif">32 GB</text>

  <!-- thresholds -->
  <line x1="340" y1="186" x2="340" y2="236" stroke="#f0655f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="346" y="182" fill="#f0655f" font-size="9.5" font-family="sans-serif">16 GB 卡：装不下</text>
  <line x1="490" y1="186" x2="490" y2="236" stroke="#2dd4a7" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="496" y="182" fill="#2dd4a7" font-size="9.5" font-family="sans-serif">24 GB 卡：刚好，不宽裕</text>

  <!-- notes -->
  <text x="40" y="286" fill="#93a1b1" font-size="10.5" font-family="sans-serif">· 27B 的 4-bit 权重约 17 GB，正好卡在 16 GB 与 24 GB 之间——这是 2026 年本地部署最尴尬的一档</text>
  <text x="40" y="308" fill="#93a1b1" font-size="10.5" font-family="sans-serif">· KV Cache 与「上下文长度 × 并发数」成正比：上下文砍半，并发就能翻倍</text>
  <text x="40" y="330" fill="#93a1b1" font-size="10.5" font-family="sans-serif">· MoE 显存按总参数算，激活参数只省算力、不省显存</text>
  <text x="40" y="352" fill="#f0655f" font-size="10.5" font-family="sans-serif">· 用 0.5 字节/参数估算，8B 会算成 4.4 GB，实测 Q4_K_M 是 5.2 GB——误差 18%，正好决定装不装得下</text>
  <text x="340" y="394" fill="#6b7a8d" font-size="11" text-anchor="middle" font-family="sans-serif">图 3</text>
</svg>
