<svg viewBox="0 0 680 394" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三档私有化定位：个人档、团队档、企业档在场景、预算、显存、并发、部署形态上的差异">
  <rect x="0" y="0" width="680" height="394" fill="#111721"/>

  <text x="340" y="24" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">三档定位：绝大多数失败，是拿企业档的复杂度做个人档的需求</text>
  <text x="340" y="44" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">定档只用一个变量：同时在线人数。不要因为「公司要正规」直接上 C 档</text>

  <!-- A -->
  <rect x="24" y="64" width="200" height="238" rx="10" fill="#18202b" stroke="#4dabf7" stroke-width="1.3"/>
  <rect x="24" y="64" width="200" height="40" rx="10" fill="#16283c"/>
  <rect x="24" y="94" width="200" height="10" fill="#16283c"/>
  <text x="124" y="90" fill="#4dabf7" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">A · 个人档</text>
  <text x="40" y="126" fill="#93a1b1" font-size="10.5" font-family="sans-serif">场景</text>
  <text x="96" y="126" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">知识库 / 写作 / 代码辅助</text>
  <text x="40" y="150" fill="#93a1b1" font-size="10.5" font-family="sans-serif">预算</text>
  <text x="96" y="150" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">0 ~ 1 万元</text>
  <text x="40" y="174" fill="#93a1b1" font-size="10.5" font-family="sans-serif">显存</text>
  <text x="96" y="174" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">16 ~ 24 GB</text>
  <text x="40" y="198" fill="#93a1b1" font-size="10.5" font-family="sans-serif">可跑</text>
  <text x="96" y="198" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">8B~14B Q4，27B 吃力</text>
  <text x="40" y="222" fill="#93a1b1" font-size="10.5" font-family="sans-serif">并发</text>
  <text x="96" y="222" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">1 ~ 3 路</text>
  <text x="40" y="246" fill="#93a1b1" font-size="10.5" font-family="sans-serif">引擎</text>
  <text x="96" y="246" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">Ollama / llama.cpp</text>
  <text x="40" y="270" fill="#93a1b1" font-size="10.5" font-family="sans-serif">形态</text>
  <text x="96" y="270" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">一个安装包</text>
  <text x="40" y="292" fill="#93a1b1" font-size="10.5" font-family="sans-serif">人力</text>
  <text x="96" y="292" fill="#2dd4a7" font-size="10.5" font-family="sans-serif">0.5 ~ 1 天</text>

  <!-- B -->
  <rect x="240" y="64" width="200" height="238" rx="10" fill="#18202b" stroke="#2dd4a7" stroke-width="1.3"/>
  <rect x="240" y="64" width="200" height="40" rx="10" fill="#12302a"/>
  <rect x="240" y="94" width="200" height="10" fill="#12302a"/>
  <text x="340" y="90" fill="#2dd4a7" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">B · 团队档</text>
  <text x="256" y="126" fill="#93a1b1" font-size="10.5" font-family="sans-serif">场景</text>
  <text x="312" y="126" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">10~100 人内部问答</text>
  <text x="256" y="150" fill="#93a1b1" font-size="10.5" font-family="sans-serif">预算</text>
  <text x="312" y="150" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">3 万 ~ 15 万元</text>
  <text x="256" y="174" fill="#93a1b1" font-size="10.5" font-family="sans-serif">显存</text>
  <text x="312" y="174" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">48 ~ 96 GB</text>
  <text x="256" y="198" fill="#93a1b1" font-size="10.5" font-family="sans-serif">可跑</text>
  <text x="312" y="198" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">27B 全速 / 70B Q4</text>
  <text x="256" y="222" fill="#93a1b1" font-size="10.5" font-family="sans-serif">并发</text>
  <text x="312" y="222" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">10 ~ 50 路</text>
  <text x="256" y="246" fill="#93a1b1" font-size="10.5" font-family="sans-serif">引擎</text>
  <text x="312" y="246" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">vLLM 单机 + 网关</text>
  <text x="256" y="270" fill="#93a1b1" font-size="10.5" font-family="sans-serif">形态</text>
  <text x="312" y="270" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">Docker Compose</text>
  <text x="256" y="292" fill="#93a1b1" font-size="10.5" font-family="sans-serif">人力</text>
  <text x="312" y="292" fill="#e8a34b" font-size="10.5" font-family="sans-serif">1 人 × 1 ~ 2 周</text>

  <!-- C -->
  <rect x="456" y="64" width="200" height="238" rx="10" fill="#18202b" stroke="#e8a34b" stroke-width="1.3"/>
  <rect x="456" y="64" width="200" height="40" rx="10" fill="#332a1c"/>
  <rect x="456" y="94" width="200" height="10" fill="#332a1c"/>
  <text x="556" y="90" fill="#e8a34b" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">C · 企业档</text>
  <text x="472" y="126" fill="#93a1b1" font-size="10.5" font-family="sans-serif">场景</text>
  <text x="528" y="126" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">数百人 / 多部门 / 涉密</text>
  <text x="472" y="150" fill="#93a1b1" font-size="10.5" font-family="sans-serif">预算</text>
  <text x="528" y="150" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">20 万 ~ 数百万元</text>
  <text x="472" y="174" fill="#93a1b1" font-size="10.5" font-family="sans-serif">显存</text>
  <text x="528" y="174" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">192 GB 起</text>
  <text x="472" y="198" fill="#93a1b1" font-size="10.5" font-family="sans-serif">可跑</text>
  <text x="528" y="198" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">70B 全精度 / MoE</text>
  <text x="472" y="222" fill="#93a1b1" font-size="10.5" font-family="sans-serif">并发</text>
  <text x="528" y="222" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">100 路以上</text>
  <text x="472" y="246" fill="#93a1b1" font-size="10.5" font-family="sans-serif">引擎</text>
  <text x="528" y="246" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">vLLM / SGLang + K8s</text>
  <text x="472" y="270" fill="#93a1b1" font-size="10.5" font-family="sans-serif">形态</text>
  <text x="528" y="270" fill="#dfe6ee" font-size="10.5" font-family="sans-serif">K8s + 模型网关</text>
  <text x="472" y="292" fill="#93a1b1" font-size="10.5" font-family="sans-serif">人力</text>
  <text x="528" y="292" fill="#f0655f" font-size="10.5" font-family="sans-serif">3~5 人 × 2~4 月</text>

  <!-- threshold -->
  <rect x="24" y="316" width="632" height="34" rx="8" fill="#1b2431" stroke="#3a4757" stroke-width="1"/>
  <text x="340" y="338" fill="#93a1b1" font-size="11" text-anchor="middle" font-family="sans-serif">决策线：≤3 人 → A 档　｜　≤50 人 → B 档　｜　再往上才需要 C 档</text>
  <text x="340" y="384" fill="#6b7a8d" font-size="11" text-anchor="middle" font-family="sans-serif">图 2</text>
</svg>
