<svg viewBox="0 0 680 246" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="记忆的三个时间尺度：单轮对话由组件 4 管、一次任务由组件 7 管、跨会话由组件 3 管">
  <rect x="0" y="0" width="680" height="246" fill="#111721"/>
  <defs>
    <marker id="arMEM" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#6b7a8d"/>
    </marker>
  </defs>
  <text x="340" y="22" fill="#93a1b1" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">记忆的三个时间尺度</text>
  <text x="340" y="42" fill="#6b7a8d" font-size="11.5" text-anchor="middle" font-family="sans-serif">同一个"失忆"问题，在不同尺度上是三件不同的事，由三个组件分别负责</text>

  <line x1="40" y1="64" x2="632" y2="64" stroke="#4a5a6c" stroke-width="1.2" marker-end="url(#arMEM)"/>
  <text x="340" y="58" fill="#6b7a8d" font-size="11" text-anchor="middle" font-family="sans-serif">时间尺度递增</text>

  <rect x="40" y="76" width="190" height="116" rx="10" fill="#1b2532" stroke="#3a4a5e"/>
  <text x="135" y="98" fill="#dfe6ee" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">单轮对话</text>
  <text x="135" y="122" fill="#7d8b9c" font-size="11.5" text-anchor="middle" font-family="sans-serif">上下文窗口</text>
  <text x="135" y="146" fill="#7d8b9c" font-size="11.5" text-anchor="middle" font-family="sans-serif">组件 4 · 上下文管理</text>
  <text x="135" y="170" fill="#6b7a8d" font-size="11" text-anchor="middle" font-family="sans-serif">涨满 → 压缩 / 遮蔽 / 检索</text>

  <rect x="245" y="76" width="190" height="116" rx="10" fill="#1d2b3d" stroke="#4dabf7"/>
  <text x="340" y="98" fill="#dfe6ee" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">一次任务</text>
  <text x="340" y="122" fill="#7d9cbb" font-size="11.5" text-anchor="middle" font-family="sans-serif">状态 + 检查点</text>
  <text x="340" y="146" fill="#7d9cbb" font-size="11.5" text-anchor="middle" font-family="sans-serif">组件 7 · 状态管理</text>
  <text x="340" y="170" fill="#6b87a5" font-size="11" text-anchor="middle" font-family="sans-serif">进程崩溃 → 从检查点恢复</text>

  <rect x="450" y="76" width="190" height="116" rx="10" fill="#122b26" stroke="#2dd4a7"/>
  <text x="545" y="98" fill="#a8d8c8" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">跨会话</text>
  <text x="545" y="122" fill="#7fa89c" font-size="11.5" text-anchor="middle" font-family="sans-serif">CLAUDE.md / MEMORY.md</text>
  <text x="545" y="146" fill="#7fa89c" font-size="11.5" text-anchor="middle" font-family="sans-serif">组件 3 · 记忆</text>
  <text x="545" y="170" fill="#6f9c8c" font-size="11" text-anchor="middle" font-family="sans-serif">新会话一无所知 → 启动时注入</text>
  <text x="340" y="235" fill="#93a1b1" font-size="12.5" font-weight="600" text-anchor="middle" font-family="sans-serif">图 8</text>
</svg>
